[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkforge-aws"
version = "0.4.0"
description = "Agent skills and deterministic analyzers for AWS Glue PySpark, Parquet, Iceberg and Athena performance engineering"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sparkforge = "sparkforge.adapters.cli:main"

[tool.setuptools.packages.find]
include = ["sparkforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Regras explícitas: lint de CI que depende do default do ruff quebra em upgrade.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101", # assert é o vocabulário do pytest
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"] # subprocess com argv fixo, sem shell
