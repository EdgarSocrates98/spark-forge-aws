[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkforge-aws"
version = "0.5.0"
description = "Agent skills and deterministic analyzers for AWS Glue PySpark, Parquet, Iceberg and Athena performance engineering"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Edgar Socrates Caria" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/EdgarSocrates98/spark-forge-aws"
Repository = "https://github.com/EdgarSocrates98/spark-forge-aws"
Issues = "https://github.com/EdgarSocrates98/spark-forge-aws/issues"

[project.optional-dependencies]
aws = ["boto3>=1.34"]
# `<2` e deliberado: o SDK 2.x removeu os decoradores que `adapters/mcp.py`
# usa para registrar os tools. Ver a docstring daquele modulo.
# starlette e uvicorn sao do transporte HTTP (Devin Desktop); stdio nao precisa
# de nenhum dos dois, mas separar em dois extras deixaria o caminho HTTP
# instalavel pela metade, que e como ele chegou quebrado ate aqui.
# `idna` e `python-dotenv` NAO sao usados pelo codigo deste projeto. Estao aqui
# como PISO de versao para transitiva vulneravel, que e a unica forma de forcar
# isso em extras de pyproject -- pip nao tem constraints declarativas aqui.
#   idna          <3.15  CVE-2026-45409 ReDoS, via starlette -> anyio
#   python-dotenv <1.2.2 CVE-2026-28684 symlink, via mcp -> pydantic-settings
# Sao pisos (`>=`), nao pins (`==`): teto aqui congelaria a arvore de um pacote
# que nao e nosso e quebraria resolucao quando starlette ou mcp subirem.
# Remover quando starlette e mcp subirem os proprios pisos; o scan de SCA no CI
# avisa se a remocao for cedo demais.
mcp = [
    "mcp>=1.0,<2",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "idna>=3.15",
    "python-dotenv>=1.2.2",
]
# O extra `mcp` entra em `dev` para que o teste de construcao do servidor e do
# app HTTP rode de verdade no CI. Sem isso ele viraria skip permanente -- e um
# caminho pulado em silencio foi exatamente o defeito que o teste existe para
# pegar.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "defusedxml>=0.7",
    "mcp>=1.0,<2",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "idna>=3.15",
    "python-dotenv>=1.2.2",
]

[project.scripts]
sparkforge = "sparkforge.adapters.cli:main"

[tool.setuptools.packages.find]
include = ["sparkforge*"]

[tool.setuptools.package-data]
sparkforge = ["findings/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Torna o pacote importável independente de como o pytest é invocado. Sem isto,
# `pytest` chamado como script (não `python -m pytest`) não põe o cwd no sys.path
# e `import sparkforge` falha sem que haja defeito no pacote.
pythonpath = ["."]

# Regras explícitas: lint de CI que depende do default do ruff quebra em upgrade.
[tool.ruff]
line-length = 100
target-version = "py310"
# fixtures/ contem PySpark deliberadamente defeituoso para golden tests;
# lintar codigo de amostra ruim de proposito e ruido, nao sinal.
exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101", # assert é o vocabulário do pytest
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"] # subprocess com argv fixo, sem shell
