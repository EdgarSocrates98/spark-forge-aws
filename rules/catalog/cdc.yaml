catalog_version: 1
schema_version: 1
area: SF-CDC
retrieved: 2026-10-02

rules:
  - id: SF-CDC-001
    category: cdc
    title: Evento CDC sem chave primária observada
    requires_facts: [cdc.event, cdc.unresolved]
    when:
      all:
        - fact: cdc.unresolved
          where: {attrs.reason: missing_primary_key}
    status: structural
    severity_default: P0
    runtime_scope: {}
    explanation: >
      O artefato de mudança não traz uma chave observável para o evento. Isso
      impede provar idempotência, ordenação por entidade e aplicação segura de
      update/delete; não prova que a origem não tenha chave.
    proposed_change:
      - Coletar a chave primária declarada e o evento completo na mesma captura.
      - Definir deduplicação e aplicação por chave antes de reprocessar o stream.
    risks: ["Aplicar evento sem chave pode duplicar ou atualizar linha errada."]
    tradeoffs: ["Coletar metadados de chave aumenta evidência e retenção do dump."]
    validation: ["Comparar chave, contagem, deletes e valores em replay controlado."]
    rollback: ["Pausar aplicação e reverter somente a política de replay configurada."]
    action:
      kind: measurement.collect_baseline
      target: cdc.primary_key
      direction: investigate
      requires_absent: []
      moves: [correctness.write_result, observability.diagnostic_artifacts]
      depends_on: []
    sources:
      - {url: "https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Troubleshooting.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]

  - id: SF-CDC-002
    category: cdc
    title: Posição de origem repetida no dump CDC
    requires_facts: [cdc.duplicate]
    when:
      all:
        - fact: cdc.duplicate
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      A mesma posição de origem aparece mais de uma vez no artefato. Isso é
      evidência de replay ou duplicação observada, mas não identifica sozinho se
      o consumidor aplicou o evento duas vezes.
    proposed_change:
      - Correlacionar posição, transaction_id, chave e resultado no destino.
      - Tornar idempotência e replay parte do experimento de recuperação.
    risks: ["Deduplicar só por posição pode colapsar eventos legítimos de fontes diferentes."]
    tradeoffs: ["Guardar posição e chave aumenta estado do consumidor."]
    validation: ["Comparar eventos aplicados e linhas finais por chave declarada."]
    rollback: ["Reverter a deduplicação para a política anterior mantendo o dump."]
    action:
      kind: measurement.localize_divergence
      target: cdc.replay.duplicate_position
      direction: investigate
      requires_absent: []
      moves: [correctness.write_result, runtime.wall_clock]
      depends_on: []
    sources:
      - {url: "https://debezium.io/documentation/reference/stable/connectors/postgresql.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]

  - id: SF-CDC-003
    category: cdc
    title: Delete CDC com tombstone explicitamente desabilitado
    requires_facts: [cdc.event]
    when:
      all:
        - fact: cdc.event
          expr: 'attrs.operation == "DELETE" and attrs.tombstone == False'
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      O evento observado é DELETE e o dump declara tombstone false. O finding
      não afirma que todo consumidor exige tombstone; exige decidir a semântica
      do tópico e do compacted log para esse consumidor.
    proposed_change:
      - Confirmar delete handling e necessidade de tombstone por consumidor.
      - Testar delete, replay e compactação com schema e chave reais.
    risks: ["Remover tombstone pode deixar estado apagado em consumidores compactados."]
    tradeoffs: ["Tombstones aumentam tráfego e retenção até a compactação."]
    validation: ["Verificar que consumidores removem a chave e não apenas ignoram o evento."]
    rollback: ["Restaurar a política anterior de tombstone após preservar evidência."]
    action:
      kind: measurement.localize_divergence
      target: cdc.delete.tombstone
      direction: investigate
      requires_absent: []
      moves: [correctness.write_result, observability.diagnostic_artifacts]
      depends_on: []
    sources:
      - {url: "https://debezium.io/documentation/reference/stable/configuration/signalling.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]

  - id: SF-CDC-004
    category: cdc
    title: Junção snapshot-CDC sem posição inicial observada
    requires_facts: [cdc.unresolved]
    when:
      all:
        - fact: cdc.unresolved
          where: {attrs.reason: snapshot_cdc_seam}
    status: structural
    severity_default: P0
    runtime_scope: {}
    explanation: >
      O artefato declara full load + CDC, mas não traz a posição que liga a
      carga inicial ao log de mudanças. A ausência impede provar que nenhum
      intervalo ficou entre os dois lados.
    proposed_change:
      - Coletar timestamp ou posição de log usada no corte e o checkpoint do consumidor.
      - Reconciliar contagem, chave e valores no intervalo de transição.
    risks: ["Recomeçar CDC sem posição pode perder ou repetir mudanças."]
    tradeoffs: ["Guardar a posição de corte aumenta rastreabilidade operacional."]
    validation: ["Executar replay do intervalo com uma chave de negócio declarada."]
    rollback: ["Parar o cutover e retornar ao caminho anterior com posição preservada."]
    action:
      kind: measurement.collect_baseline
      target: cdc.snapshot_cdc_seam
      direction: investigate
      requires_absent: []
      moves: [correctness.write_result, observability.diagnostic_artifacts]
      depends_on: []
    sources:
      - {url: "https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]

  - id: SF-DEBEZIUM-001
    category: debezium
    title: Debezium sem schema history observada
    requires_facts: [debezium.connector, debezium.unresolved]
    when:
      all:
        - fact: debezium.unresolved
          where: {attrs.reason: schema_history}
    status: structural
    severity_default: P0
    runtime_scope: {}
    explanation: >
      A configuração observada não traz o armazenamento de schema history. Sem
      esse artefato não é possível avaliar recuperação após restart ou DDL.
    proposed_change:
      - Coletar a configuração efetiva de schema history e o tópico/armazenamento usado.
      - Validar DDL, restart e replay em ambiente controlado.
    risks: ["Perder histórico pode interpretar colunas futuras com schema errado."]
    tradeoffs: ["Schema history exige retenção e governança de acesso adicionais."]
    validation: ["Reiniciar a task após DDL e comparar schema/valores do consumidor."]
    rollback: ["Restaurar o conector anterior preservando offsets e histórico."]
    action:
      kind: measurement.collect_baseline
      target: debezium.schema_history
      direction: investigate
      requires_absent: []
      moves: [correctness.write_result, observability.diagnostic_artifacts]
      depends_on: []
    sources:
      - {url: "https://debezium.io/documentation/reference/stable/configuration/storage.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]

  - id: SF-DEBEZIUM-002
    category: debezium
    title: Debezium declara tombstone desligado para deletes
    requires_facts: [debezium.connector]
    when:
      all:
        - fact: debezium.connector
          expr: 'attrs.tombstones_on_delete == False'
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      O conector observado desabilita tombstones. A consequência depende de
      consumidores, compactação e delete handling; o finding não presume o uso.
    proposed_change:
      - Inventariar consumidores do tópico e testar deletes/compactação.
      - Declarar a política de tombstone no contrato do evento.
    risks: ["Consumidores compactados podem reter registros apagados."]
    tradeoffs: ["Habilitar tombstone aumenta mensagens e retenção transitória."]
    validation: ["Reprocessar delete em consumidor real e confirmar remoção por chave."]
    rollback: ["Restaurar a configuração anterior mantendo offsets e evidência."]
    action:
      kind: measurement.localize_divergence
      target: debezium.tombstones_on_delete
      direction: increase
      requires_absent: []
      moves: [correctness.write_result, observability.diagnostic_artifacts]
      depends_on: []
    sources:
      - {url: "https://debezium.io/documentation/reference/stable/connectors/postgresql.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]

  - id: SF-DMS-001
    category: dms
    title: AWS DMS sem table mappings observados
    requires_facts: [dms.task, dms.unresolved]
    when:
      all:
        - fact: dms.unresolved
          where: {attrs.reason: missing_table_mappings}
    status: structural
    severity_default: P0
    runtime_scope: {}
    explanation: >
      O dump do task DMS não traz regras que definam tabelas, schemas ou
      transformações. Sem elas o escopo da replicação não pode ser auditado.
    proposed_change:
      - Coletar table mappings efetivos e conferir seleção, transformação e destino.
      - Não iniciar cutover sem revisar o conjunto de tabelas declarado.
    risks: ["Escopo ausente pode omitir tabela ou replicar objeto indevido."]
    tradeoffs: ["Mapeamento explícito exige manutenção quando o schema evolui."]
    validation: ["Comparar tabelas esperadas, capturadas e estatísticas do task."]
    rollback: ["Parar o task e restaurar a última versão dos mappings."]
    action:
      kind: measurement.collect_baseline
      target: dms.table_mappings
      direction: investigate
      requires_absent: []
      moves: [correctness.write_result, observability.diagnostic_artifacts]
      depends_on: []
    sources:
      - {url: "https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Introduction.Components.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]

  - id: SF-DMS-002
    category: dms
    title: AWS DMS sem endpoint de origem observado
    requires_facts: [dms.task, dms.unresolved]
    when:
      all:
        - fact: dms.unresolved
          where: {attrs.reason: missing_source_endpoint}
    status: structural
    severity_default: P0
    runtime_scope: {}
    explanation: >
      O artefato do task não permite identificar a origem conectada. Isso
      impede validar engine, log nativo, permissões e posição de CDC.
    proposed_change:
      - Coletar endpoint por ARN/identificador sem incluir segredos.
      - Conferir engine, região, rede e usuário de captura separadamente.
    risks: ["Endpoint incorreto pode capturar outro banco ou falhar no log."]
    tradeoffs: ["Dump de endpoint precisa redigir credenciais e dados sensíveis."]
    validation: ["Comparar engine/identidade do endpoint com o task e teste de captura."]
    rollback: ["Remover somente o dump redigido conforme retenção; não mutar endpoint."]
    action:
      kind: measurement.collect_baseline
      target: dms.source_endpoint
      direction: investigate
      requires_absent: []
      moves: [runtime.engine_version, security.identity_access, observability.diagnostic_artifacts]
      depends_on: []
    sources:
      - {url: "https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]

  - id: SF-DMS-003
    category: dms
    title: AWS DMS Full Load + CDC sem corte observável
    requires_facts: [dms.task, dms.unresolved]
    when:
      all:
        - fact: dms.unresolved
          where: {attrs.reason: snapshot_cdc_seam}
    status: structural
    severity_default: P0
    runtime_scope: {}
    explanation: >
      O task declara Full Load + CDC sem timestamp ou posição de corte no dump.
      A transição não pode ser provada apenas pela modalidade do task.
    proposed_change:
      - Coletar posição de log/timestamp e checkpoint usados na transição.
      - Validar duplicidade e lacunas por chave antes do cutover.
    risks: ["Sem corte, mudanças podem ser perdidas ou reaplicadas."]
    tradeoffs: ["A coleta de posição aumenta rastreabilidade e esforço operacional."]
    validation: ["Executar reconciliação de contagem, schema, chaves e valores no seam."]
    rollback: ["Reverter o cutover e preservar posição anterior do task."]
    action:
      kind: measurement.collect_baseline
      target: dms.snapshot_cdc_seam
      direction: investigate
      requires_absent: []
      moves: [correctness.write_result, runtime.wall_clock]
      depends_on: []
    sources:
      - {url: "https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html", retrieved: 2026-10-02}
    knowledge_refs: [{ref: knowledge/cdc-replication.md}]
