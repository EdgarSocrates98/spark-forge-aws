catalog_version: 1
schema_version: 1
area: SF-STREAMICE
retrieved: 2026-10-02

rules:
  - id: SF-STREAMICE-001
    category: streaming_iceberg
    title: Operação não-append observada no caminho streaming para Iceberg
    requires_facts: [streaming.iceberg.link]
    when:
      all:
        - fact: streaming.iceberg.link
          where: {attrs.non_append_observed: true}
    status: structural
    severity_default: P1
    runtime_scope: {}
    explanation: >
      O vínculo declarado entre a query e a tabela contém pelo menos uma operação
      Iceberg não-append observada no dump de snapshots. Isso não prova que a
      operação quebrou a query, mas muda a pergunta de uma escrita append-only
      para uma compatibilidade que precisa ser validada contra o consumidor, o
      modo de leitura e a janela de replay.
    proposed_change:
      - Confirmar a operação e o snapshot no metadata dump e revisar consumidores downstream.
      - Testar leitura incremental, reinício e replay em ambiente controlado antes de alterar o sink.
      - Definir rollback de dados e retenção de snapshots com o dono da tabela.
    action:
      kind: validation.functional_replay
      target: streaming.iceberg.link
      direction: investigate
      requires_absent: [streaming.composition.unresolved]
      moves: [correctness.write_result, storage.snapshot_history]
      depends_on: []
    risks:
      - Tratar a correlação como causa pode levar a mudar o sink sem evidência do modo de falha.
      - Expirar snapshots antes da validação pode remover o caminho de rollback.
    tradeoffs:
      - Preservar histórico e executar replay aumenta armazenamento e duração do teste.
    validation:
      - Comparar snapshots, operações, progresso e proxies funcionais antes e depois do experimento.
      - Confirmar que consumidores downstream aceitam a semântica observada.
    rollback:
      - Reverter a configuração do sink e preservar snapshots necessários ao replay; não executar expiração sem aprovação.
    sources:
      - {url: "https://iceberg.apache.org/docs/latest/spark-structured-streaming/", retrieved: 2026-10-02}
    knowledge_refs:
      - {ref: knowledge/streaming-lakehouse-observability.md}

  - id: SF-STREAMICE-002
    category: streaming_iceberg
    title: Operação não-append observada na janela temporal da query e do Iceberg
    requires_facts: [streaming.iceberg.temporal]
    when:
      all:
        - fact: streaming.iceberg.temporal
          expr: "measures.paired_observation_count >= 2 and attrs.temporal_window_complete and attrs.non_append_observed"
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      A janela declarada contém pelo menos dois pares de progresso e snapshot
      Iceberg, e um snapshot pareado registra operação não-append. A observação
      fortalece a necessidade de validar replay, leitura incremental e resultado
      funcional, mas não prova que o commit causou atraso ou divergência.
    proposed_change:
      - Confirmar timestamps, ids, operações e tolerância no dump de origem.
      - Validar consumidores, leitura incremental, reinício e replay em ambiente controlado.
      - Comparar contagem, schema, chaves e agregados antes de qualquer mudança no sink.
    action:
      kind: validation.functional_replay
      target: streaming.iceberg.temporal
      direction: investigate
      requires_absent: [streaming.composition.unresolved]
      moves: [correctness.write_result, storage.snapshot_history]
      depends_on: []
    risks:
      - Pareamento temporal não prova causalidade entre commit e atraso da query.
      - Expirar snapshots antes da validação remove uma opção de rollback.
      - Tolerância ampla pode juntar janelas de execução diferentes.
    tradeoffs:
      - Preservar snapshots e fatos granulares aumenta armazenamento e bytes de análise.
    validation:
      - Conferir dois ou mais pares, skew observado, identidade e operação no metadata.
      - Repetir a coleta na mesma janela e executar proxies funcionais do destino.
      - Comparar replay e leitura incremental sem atribuir ganho não medido.
    rollback:
      - Reverter a configuração experimental do sink e preservar snapshots necessários ao replay.
    sources:
      - {url: "https://iceberg.apache.org/docs/latest/spark-structured-streaming/", retrieved: 2026-10-02}
      - {url: "https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html", retrieved: 2026-10-02}
    knowledge_refs:
      - {ref: knowledge/streaming-lakehouse-observability.md}
