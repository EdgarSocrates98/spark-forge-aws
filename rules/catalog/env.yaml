# Catálogo de regras — ambiente e versão
# Fase 0. Estas regras têm precedência sobre todas as outras: aplicar limiar ou API
# de uma versão errada invalida qualquer recomendação subsequente.

catalog_version: 1
schema_version: 1
area: SF-ENV
retrieved: 2026-07-29

rules:

  # ESCOPO VAZIO, DE PROPOSITO -- NAO PREENCHER.
  # As vizinhas agnosticas receberam `{spark: ">=3.0"}`. Esta nao pode, e a
  # razao e circular: SF-ENV-001 e a regra que denuncia que a versao detectada
  # NAO E CONFIAVEL. Condicionar o disparo dela a uma versao detectada com
  # sucesso e pedir a guarda que confie justamente no que a regra questiona.
  #
  # E nao e hipotetico. `runtime_detect` rastreia como sinal spark, python,
  # iceberg e athena; `RuntimeContext.to_dict()` sempre emite a chave `spark`,
  # com "" quando nao houve observacao, e `in_scope` falha fechada em valor
  # vazio. Divergencia so de iceberg (requirements=1.7.1 vs terraform=1.10.0,
  # sem event log e sem glue_version) produz `distinct_versions == 2` com
  # `spark == ""`: com `{spark: ">=3.0"}` a regra some do relatorio exatamente
  # no caso que ela existe para cobrir.
  #
  # Escopo vazio "sempre casa" -- a mesma propriedade do curinga `{glue: "*"}`
  # que esta fase esta removendo. A diferenca e intencao: no curinga era um
  # acidente que ninguem declarou; aqui e a semantica exigida, e esta escrita.
  # Ela tambem e a unica agnostica em que "sempre avaliar" e requisito e nao
  # conveniencia -- as demais dependem de um motor Spark existir; esta precisa
  # rodar ate quando nao se sabe qual motor e.
  - id: SF-ENV-001
    category: environment
    title: Divergência de runtime entre fontes de detecção
    requires_facts: [env.runtime_signal]
    when:
      all:
        - fact: env.runtime_signal
          expr: "measures.distinct_versions > 1"
    status: confirmed
    severity_default: P0
    runtime_scope: {}
    explanation: >
      A versão do runtime é detectável por event log (spark.version), Terraform
      (glue_version, --datalake-formats), e arquivos de dependência do projeto. Quando
      as fontes discordam, o extrator não escolhe uma: registra a divergência. Toda
      recomendação que dependa de versão fica sem base até isso ser resolvido, porque o
      limiar aplicado e a API sugerida podem não existir no runtime real. O salto de
      Iceberg entre Glue 4.0 (1.0.0), 5.0 (1.7.1) e 5.1 (1.10.0) é grande o suficiente
      para invalidar procedimentos inteiros. Ver knowledge/glue/runtime-matrix.md.
    proposed_change:
      - Confirmar a versão efetiva na aba Environment do Spark UI, que é a fonte mais confiável.
      - Alinhar o Terraform e os arquivos de dependência ao runtime efetivo.
      - Registrar no relatório a matriz detectada e a divergência encontrada.
    risks:
      - Prosseguir com a investigação sem resolver a divergência produz recomendações que podem não se aplicar.
    tradeoffs: [Nenhum. Resolver a divergência é pré-requisito, não escolha.]
    validation:
      - Aba Environment do Spark UI e Terraform concordando após a correção.
      - Versão de Iceberg confirmada no classpath, não inferida da versão de Glue.
    rollback: [Não aplicável; é correção de metadado de projeto, não de comportamento.]
    # As duas paginas de EMR entram aqui, e nao numa lista a parte, porque a
    # watchlist de `scripts/refresh_knowledge.py` E o conjunto de `sources[].url`
    # do catalogo: `compare()` PODA do lock toda URL que nenhuma regra cita.
    # Registrar as paginas so em `knowledge/sources.lock.json` faria o proximo
    # `--update` apaga-las em silencio -- o gate pareceria verde sem vigiar nada.
    #
    # SF-ENV-001 e a regra certa para cita-las: ela dispara sobre divergencia
    # entre fontes, e uma das fontes e justamente a derivacao por EMR_MATRIX.
    #
    # Os perfis de drift das duas sao OPOSTOS, e a diferenca esta registrada em
    # knowledge/emr/runtime-matrix.md secao 6: 6.x e serie estavel (mudanca na
    # pagina e o evento que a watchlist existe para pegar), 7.x recebe um minor
    # a cada 90 dias no maximo e cada minor PREPENDE uma coluna -- o hash muda
    # ~4x/ano sem drift do que a matriz conhece. Por isso o guard celula a
    # celula vive em `tests/test_runtime_emr_matrix.py`, nao no hash.
    sources:
      - {url: "https://docs.aws.amazon.com/glue/latest/dg/migrating-version-50.html", retrieved: 2026-07-29}
      - {url: "https://aws.amazon.com/blogs/big-data/introducing-aws-glue-5-1-for-apache-spark", retrieved: 2026-07-29}
      - {url: "https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-release-app-versions-7.x.html", retrieved: 2026-08-01}
      - {url: "https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-release-app-versions-6.x.html", retrieved: 2026-08-01}

  # INERTE ATE EXISTIR INVENTARIO DE CONSUMIDORES.
  # `env.consumer` nao e emitido por extrator nenhum: saber que uma tabela e
  # lida por Athena exige inventariar quem consome a tabela (workgroups,
  # queries salvas, dashboards), e isso nao se deduz do codigo do job nem dos
  # metadados da tabela. Sem `blocked_on`, `judge` reportaria "requires_facts"
  # e o operador ficaria esperando coletar um artefato que ninguem produz.
  # A regra fica registrada porque o conhecimento continua valido -- e P0 real:
  # o job passa, e o Athena quebra dias depois -- e porque `runtime_scope`
  # (glue >=5.1) ja limita o alcance a quem pode escrever V3.
  - id: SF-ENV-002
    category: environment
    title: Tabela Iceberg em format V3 com consumo por Athena
    requires_facts: [iceberg.table_property, env.consumer]
    when:
      all:
        - fact: iceberg.table_property
          where: {attrs.key: format-version, attrs.value: "3"}
        - fact: env.consumer
          where: {attrs.service: athena}
    status: confirmed
    severity_default: P0
    runtime_scope: {glue: ">=5.1", iceberg: ">=1.10.0"}
    explanation: >
      AWS Glue 5.1 pode escrever tabelas Iceberg format version 3. Amazon Athena não lê
      V3. O modo de falha é perverso: a migração de runtime passa, o job roda, e dias
      depois as queries e dashboards em Athena quebram, com a causa a semanas de
      distância no log de mudanças. Ver knowledge/cross-service-constraints.md secao 1.
    proposed_change:
      - Fixar format-version = 2 na table property.
      - Ou permanecer em Glue 5.0 até que Athena suporte V3.
      - Inventariar todos os consumidores da tabela antes de qualquer mudança de format version.
    risks:
      - Fixar V2 renuncia às capacidades novas do V3, incluindo deletion vectors e row lineage.
    tradeoffs:
      - V3 traz ganhos reais em merge-on-read; o custo é perder o consumo por Athena.
    validation:
      - format-version confirmado nas table properties.
      - Query de smoke test em Athena sobre a tabela, executada com sucesso.
      - Inventário de consumidores documentado.
    rollback: >
      Reverter format-version não é trivial após escritas em V3. Verificar a
      documentação da versão de Iceberg em uso antes de assumir que é reversível, e
      tratar a mudança para V3 como decisão de ida.
    sources:
      - {url: "https://aws.amazon.com/blogs/big-data/introducing-aws-glue-5-1-for-apache-spark", retrieved: 2026-07-29}

  - id: SF-ENV-003
    category: environment
    title: Observability metrics habilitado sem glueContext inicializado
    requires_facts: [tf.attribute, pyspark.module_analyzed]
    when:
      all:
        - fact: tf.attribute
          where: {attrs.key: "--enable-observability-metrics", attrs.value: "true"}
        - fact: pyspark.module_analyzed
        - absent: pyspark.glue_context_init
    status: confirmed
    severity_default: P1
    runtime_scope: {glue: ">=4.0"}
    explanation: >
      As métricas de observabilidade só são publicadas se glueContext estiver
      inicializado. Um job escrito como PySpark puro, com SparkSession.builder e sem
      GlueContext, não emite métrica alguma mesmo com o argumento habilitado. O
      operador conclui que o job está saudável quando na verdade não há dado. Ver
      knowledge/cross-service-constraints.md secao 3.
    proposed_change:
      - Inicializar GlueContext no job, ainda que o restante do código use DataFrame puro.
      - Ou remover o argumento e assumir explicitamente que o diagnóstico dependerá de Spark UI e event logs.
    risks:
      - Introduzir GlueContext num job PySpark puro adiciona dependência do runtime Glue, reduzindo a portabilidade para execução local.
    tradeoffs:
      - Portabilidade local versus observabilidade em produção.
    validation:
      - Métricas glue.driver.workerUtilization e glue.ALL.memory.heap.used.percentage presentes no CloudWatch após um run.
    rollback: [Reverter o commit; nenhuma mudança de infraestrutura envolvida.]
    sources:
      - {url: "https://docs.aws.amazon.com/glue/latest/dg/monitor-observability.html", retrieved: 2026-07-29}

  # ESCOPO VAZIO POR DECISÃO DA FASE 5a, TASK 3c. Declarava `{glue: "<4.0"}`.
  #
  # O guarda estava na CAMADA ERRADA, e isso não era cosmético. A condição do
  # `when` é `attrs.spark_minor < 3.2` -- puramente Spark. Num cluster EMR com
  # Spark 3.1.1 não há chave `glue` no runtime detectado, `in_scope` falha
  # fechada (`sparkforge/rules/version_scope.py`) e a regra era apagada
  # exatamente onde é mais necessária: alguém recomendando "confie no AQE" num
  # motor em que o AQE não está ligado por default. Glue 3.0 não é o único
  # runtime que roda Spark anterior a 3.2 -- é só o único que a AWS numera.
  #
  # As duas leituras foram consideradas, e `{spark: "<3.2"}` foi REJEITADA:
  #
  #   a. Seria REDUNDANTE. O `when` já lê a versão do fact. `runtime_detect.py`
  #      só põe `attrs.spark_minor` quando `component == "spark"` e há
  #      `resolved` não-vazio, e a condição exige `< 3.2` explícito -- ou seja,
  #      a regra só pode disparar quando a versão de Spark FOI resolvida e é
  #      antiga. O guarda não pode barrar nada que a condição já não barre.
  #
  #   b. Seria REDUNDANTE MAS NÃO INÓCUA. `RuntimeContext.spark` é o que a CLI
  #      montou, não o que o extrator resolveu: `build_runtime_context()` sem
  #      flags -- o padrão de `sparkforge judge` -- devolve `spark: ""`, e
  #      `{spark: "<3.2"}` falha fechada. A regra sumiria enquanto o fact
  #      `env.runtime_signal` na mesma execução diz `spark_minor: 3.1`. Esse é
  #      o defeito exato que esta task existe para eliminar, reintroduzido numa
  #      chave diferente.
  #
  # Ela é a segunda regra do catálogo em que "sempre avaliar" é requisito e não
  # conveniência, pela mesma razão de SF-ENV-001 logo acima: a regra existe para
  # falar SOBRE a versão detectada, então condicioná-la a uma versão detectada
  # com sucesso é circular. A diferença entre as duas: SF-ENV-001 dispara quando
  # a detecção é contraditória; esta, quando ela é conclusiva e antiga. Nenhuma
  # das duas pode depender do runtime que a CLI recebeu.
  #
  # A fronteira do AQE continua fixada nos dois sentidos por
  # `tests/test_fixtures_golden_runtime.py::test_aqe_boundary_holds_on_both_sides`
  # -- e agora pela CONDIÇÃO, não pelo guarda: Glue 4.0 resolve para Spark
  # 3.3.0, `spark_minor` é 3.3, e `< 3.2` é falso. O teste passa pelo motivo
  # certo.
  - id: SF-ENV-004
    category: environment
    title: Recomendação de AQE em runtime sem AQE por default
    requires_facts: [env.runtime_signal]
    when:
      all:
        - fact: env.runtime_signal
          where: {attrs.source: resolved}
          expr: "attrs.spark_minor < 3.2"
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      AQE é habilitado por default a partir do Apache Spark 3.2. Glue 3.0 roda Spark
      3.1.1, portanto AQE não está ativo por default e várias sub-configurações de AQE
      não existem nessa versão. Qualquer raciocínio do tipo "o AQE cuida do skew" ou
      "o coalescing ajusta as partições" é inválido nesse runtime. Ver
      knowledge/cross-service-constraints.md secao 4.
    proposed_change:
      - Verificar se AQE está explicitamente habilitado; se não, o skew e a contagem de partições precisam de tratamento manual.
      - Avaliar migração de runtime como alternativa a tuning manual extenso.
    risks:
      - Habilitar AQE numa versão antiga expõe comportamento menos maduro do que em 3.5.
    tradeoffs:
      - Migrar de runtime é mudança maior, com checklist próprio de breaking changes.
    validation:
      - Valor efetivo de spark.sql.adaptive.enabled na aba Environment.
    rollback: [Desabilitar spark.sql.adaptive.enabled restaura o comportamento anterior.]
    sources:
      - {url: "https://spark.apache.org/docs/3.5.6/sql-performance-tuning.html", retrieved: 2026-07-29}

  # IRMA DE SF-ENV-001, E DELIBERADAMENTE SEPARADA DELA.
  #
  # A tentacao e dizer "divergencia ja e SF-ENV-001". Nao e, e o motivo esta na
  # secao 3.3 do spec da Fase 5. SF-ENV-001 dispara sobre `env.runtime_signal`
  # com `measures.distinct_versions > 1` -- comparacao de VERSAO DE COMPONENTE.
  # Glue 4.0 deriva Spark 3.3.0, e ha release de EMR que roda 3.3.0: detectar as
  # duas plataformas juntas nesse par nao produz divergencia de versao nenhuma,
  # e a dupla deteccao passava MUDA. Nenhum ajuste de limiar, escopo ou `where`
  # em SF-ENV-001 alcanca esse caso, porque a pergunta e outra -- "quantas
  # plataformas?", nao "quais versoes?".
  #
  # As duas podem disparar juntas, e devem: sao dois defeitos independentes.
  # Quando so a plataforma diverge, esta fala sozinha; quando as versoes tambem
  # discordam, as duas falam.
  #
  # ESCOPO VAZIO, pela mesma razao de SF-ENV-001 e SF-ENV-004, e por uma a mais.
  # Pelo criterio de `rules/catalog/README.md` ("O que `runtime_scope` e, e o
  # que ele nao e"), escopo nao-vazio so se justifica quando o gatilho varia
  # genuinamente com a versao e essa versao vem do runtime. Aqui o gatilho e
  # contagem de identidades: nao ha versao nenhuma na condicao. A razao a mais e
  # circular, e a mais forte: esta e a regra que denuncia que a PLATAFORMA
  # detectada nao e confiavel. `{glue: "*"}` ou `{emr: "*"}` a apagariam
  # justamente quando a deteccao esta contraditoria -- pedir a guarda que confie
  # no que a regra questiona. O gate correto e `requires_facts: [env.platform]`,
  # e `runtime_detect` emite esse fact com UMA plataforma tambem, para que o
  # caso limpo seja avaliado e reprovado, nunca pulado em silencio.
  - id: SF-ENV-005
    category: environment
    title: Duas plataformas de runtime detectadas ao mesmo tempo
    requires_facts: [env.platform]
    when:
      all:
        - fact: env.platform
          expr: "measures.distinct_platforms > 1"
    status: confirmed
    severity_default: P0
    runtime_scope: {}
    explanation: >
      Um job roda numa plataforma só — ou AWS Glue, ou EMR, nunca as duas ao mesmo
      tempo. Detectar as duas não significa que o job é híbrido: significa que uma das
      fontes lidas descreve outra coisa — outro job, outro ambiente, um módulo Terraform
      que não é o deste job, um event log colado da execução errada. O efeito não se
      limita a um achado: todo achado de infraestrutura daquele relatório está ancorado
      na plataforma errada, com o worker type, o autoscaling, o bookmark e os argumentos
      de job lidos de um recurso que não é o analisado. Não é ruído a filtrar; é o
      relatório inteiro sob suspeita, e por isso tem a mesma precedência de SF-ENV-001.
      A divergência não é resolvida pelo extrator: `env.platform` registra as duas
      identidades e de qual fonte cada uma veio, e a escolha de qual descartar é do
      operador, que sabe qual artefato pertence a este job.
    proposed_change:
      - Identificar, em attrs.origins do fact, qual fonte declarou cada plataforma.
      - Remover do conjunto coletado o artefato que não pertence a este job — o módulo Terraform de outro recurso, o dump de cluster de outro ambiente, o event log de outra execução.
      - Reexecutar a coleta e confirmar que resta uma única plataforma antes de ler qualquer achado de infraestrutura.
    risks:
      - Descartar a fonte errada troca uma âncora incorreta por outra, e o relatório volta a parecer coerente sem estar correto.
      - Tratar o achado como ruído e seguir lendo os achados de infraestrutura mantém todos eles ancorados na plataforma errada.
    tradeoffs:
      - Nenhum. Um job tem uma plataforma; determinar qual é pré-requisito da leitura do relatório, não escolha de prioridade.
    validation:
      - Nome e identificador do recurso na fonte remanescente conferidos contra o job efetivamente analisado.
      - Nova execução da detecção com uma única plataforma em attrs.observed.
      - Achados de infraestrutura relidos após a correção, e comparados com os anteriores — os que mudarem eram os ancorados na fonte errada.
    rollback: [Não aplicável; é correção do conjunto de artefatos coletados, não de comportamento do job.]
    sources:
      - {origin: field-heuristic, note: "Exclusividade de plataforma é premissa do modelo de execução — um job Spark roda num runtime só —, não afirmação de documento. O que a detecção observa são declarações de fontes distintas, e duas identidades incompatíveis significam que ao menos uma delas descreve outro sistema."}
      - {origin: field-heuristic, note: "P0 pela mesma razão de SF-ENV-001: o defeito não invalida um achado, invalida a âncora de todo o eixo de infraestrutura do relatório. Severidade menor faria o operador ler os achados antes de resolver a ambiguidade."}
