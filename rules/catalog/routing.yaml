# Catálogo de roteamento — direcionamento determinístico
# Mesmo motor de regras, predicado sobre o estado do case em vez de sobre facts.
# É isto que faz o próximo passo ser decidido por dado e não por julgamento do modelo,
# e é o que sobrevive à troca de sessão Devin <-> Claude Code e à troca de modelo.
#
# Avaliado em ordem. O primeiro match vira recommended_skill; os seguintes que casarem
# entram em alternatives, com rank.

catalog_version: 1
schema_version: 1
area: ROUTE
retrieved: 2026-07-29

# Contrato dos gates do case — quem produz a evidência que destrava cada um.
# `store.set_phase` lê este bloco quando o case tem `strict_gates`: gate com
# `satisfied_by` é fail-closed nas fases de `guards_phases`; gate sem
# `satisfied_by` permanece advisory, mesmo sob rigor. A decisão é DADO, não `if`
# em Python — pela mesma razão que o roteamento de coordenador é dado.
#
# Os QUATRO gates de `store.GATES` aparecem aqui, inclusive os advisory: gate
# ausente do bloco seria ambíguo entre "esqueceram" e "é advisory de propósito".
#
# `guards_phases` é LISTA porque `set_phase` valida só pertinência a `PHASES` —
# nada impede `experiment -> report`, então uma fase só seria contornada pulando
# fase. A lista é o sufixo de `PHASES` a partir da primeira fase guardada.
#
# LIMITE, declarado onde ele opera: a checagem é por PRESENÇA do kind, não por
# conteúdo do fact. Ela prova que a análise rodou e produziu o artefato que
# destrava — nunca que ela cobriu todo `scope.entrypoints`, nem que o benchmark
# é do job certo.
gates:

  baseline_captured:
    satisfied_by: bench.run_delta
    produced_by: "sparkforge benchmark --before <facts_antes.json> --after <facts_depois.json> --out .sparkforge/facts_bench.json"
    # `experiment` NÃO entra: `bench.run_delta` exige o lado `--after`, que só
    # existe depois de rodar o job mudado. Guardar `experiment` seria gate
    # insatisfazível no momento em que morde.
    guards_phases: [validation, report]

  flows_mapped:
    satisfied_by: callgraph.reachable_spark_work
    produced_by: "sparkforge analyze call-graph --facts .sparkforge/facts.json --out .sparkforge/facts_callgraph.json"
    # NÃO `callgraph.summary`: aquele kind é emitido incondicionalmente, então
    # destravaria rodando `analyze call-graph` sobre um facts vazio.
    # `callgraph.reachable_spark_work` só existe se algum entrypoint alcança
    # trabalho Spark.
    guards_phases: [hypothesis, experiment, validation, report]

  dominant_bottleneck_identified:
    # SEM satisfied_by: dominância é ordenação entre candidatos, e nenhum dos
    # 102 kinds do vocabulário a afirma. O que se aproxima é um Finding, que
    # não é Fact -- mora em findings_index e não chega a `set_phase`.
    advisory_reason: "nenhum fact prova dominancia; o julgamento e do catalogo, nao da evidencia"

  functional_validation_defined:
    # A Fase 4c entregou o produtor, e o gate endurece DECLARANDO `satisfied_by`
    # -- sem tocar em uma linha de `store.py`. Era a propriedade que o criterio da
    # Fase 4b prometia, e ela cobra aqui.
    #
    # `funcval.plan`, e NAO `funcval.check_delta` nem `funcval.analyzed`: o nome
    # do gate diz *defined*, nao *executed*. O que satisfaz e o PLANO, e a ordem
    # importa -- definir o que validar DEPOIS de medir e escolher o check que
    # passa. `dq.check` foi medido e REJEITADO na Fase 4b: prova validacao dentro
    # do job, que e verdade antes e depois da mudanca e nao compara duas execucoes.
    satisfied_by: funcval.plan
    # `--facts` e REPETIVEL e precisa ser: o alvo vem do `pyspark.write` e o
    # schema/os agregados vem do `catalog.table_schema`, e nenhum verbo de
    # `analyze` produz os dois no mesmo arquivo. `--out` e obrigatorio -- o plano
    # e a evidencia deste gate, nao uma conveniencia.
    produced_by: "sparkforge funcval plan --facts .sparkforge/facts.json --facts .sparkforge/facts_catalog.json --out .sparkforge/facts_funcval_plan.json"
    # SO `report`, e a medicao que decide e o `phase_in` da ROTA que destrava este
    # gate. Pela R1 da Task 1 da Fase 4b -- o gate nao pode morder numa fase em que
    # a rota que o destrava ainda opera, senao a rota vira letra morta --, e a rota
    # aqui e a ROUTE-015 (`blocked_by: [functional_validation_defined]`), que opera
    # em `[validation, report]`.
    #
    # Guardar `validation` mataria a ROUTE-015: ela so casa com o gate FALSO, e um
    # case sob rigor nao entraria em `validation` com o gate falso -- a unica rota
    # que manda definir a validacao nunca apareceria para ninguem. Guardando so
    # `report`, o case entra em `validation`, a ROUTE-015 casa ali, o operador roda
    # `funcval plan`, e o fechamento passa a exigir o plano. E e literalmente o que
    # o `reason` da propria ROUTE-015 diz: "definir a validacao antes de fechar o
    # relatorio".
    #
    # A R2 (a fase guardada precisa ser uma em que o fact produtor ja possa
    # existir) nao empurra nada aqui, ao contrario do `baseline_captured`:
    # `funcval.plan` e DERIVADO de `pyspark.write` e `catalog.table_schema`, entao
    # ele e satisfazivel desde `facts` -- muito antes de morder.
    #
    # R3: a lista e o sufixo de `PHASES` a partir da primeira fase guardada, e
    # `report` e a ultima, entao o sufixo tem um elemento so.
    guards_phases: [report]

rules:

  - id: ROUTE-001
    phase_in: [intake]
    title: Runtime não detectado
    when:
      any:
        - {case: runtime.glue, absent: true}
        - {case: runtime.divergences, count_gt: 0}
    recommended_skill: sparkforge-diagnose
    reason: >
      Sem runtime confirmado, nenhum limiar nem API pode ser aplicado com segurança.
      Divergência entre fontes não é resolvida escolhendo uma.
    missing_artifacts: [terraform, event_log]
    collect_commands: ["sparkforge runtime detect", "sparkforge collect eventlog --job-run <id>"]

  - id: ROUTE-002
    phase_in: [intake, inventory]
    title: Sem inventário de código
    when:
      all:
        - {case: facts_index.count, count_eq: 0}
    recommended_skill: analyze-library-call-graph
    reason: Nenhum fact extraído. Mapear entrypoint e biblioteca antes de qualquer hipótese.
    collect_commands: ["sparkforge analyze pyspark --path <lib> --out .sparkforge/facts.json"]

  - id: ROUTE-003
    phase_in: [inventory, diagnosis]
    title: Fluxos full e incremental não separados
    when:
      all:
        - {case: scope.entrypoints, count_gt: 1}
        - {case: gates.flows_mapped, equals: false}
    recommended_skill: design-incremental-processing
    reason: >
      Com dois fluxos, o DAG de cada um precisa ser separado antes de diagnosticar.
      Trabalho global executado no fluxo incremental é a suspeita padrão, e não aparece
      sem essa separação.

  - id: ROUTE-004
    phase_in: [diagnosis]
    title: Action ou write dentro de loop encontrado
    when:
      all:
        - {finding: SF-PY-004, present: true}
    recommended_skill: analyze-batch-loop
    reason: >
      Recomputação de DAG por iteração domina qualquer outro custo e mascara os demais
      diagnósticos. Resolver antes de investigar joins, skew ou capacidade.

  - id: ROUTE-005
    phase_in: [diagnosis]
    title: Executor removido sem OOM de heap
    when:
      all:
        - {finding: SF-UI-005, present: true}
    recommended_skill: diagnose-oom
    reason: >
      Assinatura de estouro de container fora do heap. A correção é memoryOverhead, não
      memory, e classificar errado leva a "aumentei a memória e continuou".

  - id: ROUTE-006
    phase_in: [diagnosis]
    title: Skew de duração com input desigual
    when:
      all:
        - {finding: SF-UI-001, present: true}
        - {finding: SF-UI-002, present: true}
    recommended_skill: diagnose-data-skew
    reason: Duração e input ambos desiguais indicam skew de dados, tratável na chave.

  - id: ROUTE-007
    phase_in: [diagnosis]
    title: Skew de duração com input uniforme
    when:
      all:
        - {finding: SF-UI-001, present: true}
        - {finding: SF-UI-002, present: false}
    recommended_skill: optimize-pyspark-code
    reason: >
      Duração desigual com input uniforme é skew de computação, não de dados.
      Repartition não resolve. Investigar UDF e explode.

  - id: ROUTE-008
    phase_in: [diagnosis]
    title: Pruning de partição ausente
    when:
      all:
        - {finding: SF-PQ-002, present: true}
    recommended_skill: analyze-spark-plan
    reason: >
      Ler a tabela inteira invalida qualquer conclusão sobre capacidade. É o achado de
      maior alavanca e o mais rápido de confirmar no plano físico.

  - id: ROUTE-009
    phase_in: [diagnosis]
    title: Small files dominando
    when:
      any:
        - {finding: SF-PQ-001, present: true}
        - {finding: SF-ICE-001, present: true}
    recommended_skill: optimize-parquet-layout
    reason: >
      Gargalo de contagem de objetos e round-trips S3. Capacidade não corrige. Se a
      tabela é Iceberg, seguir para optimize-iceberg-table para corrigir na escrita.

  - id: ROUTE-010
    phase_in: [diagnosis]
    title: Dívida de metadados Iceberg
    when:
      any:
        - {finding: SF-ICE-002, present: true}
        - {finding: SF-ICE-003, present: true}
    recommended_skill: optimize-iceberg-table
    reason: >
      Planejamento lento aponta para manifests, snapshots e delete files, não para data
      files. Compactar dados quando o problema é metadado custa horas de DPU sem ganho.

  - id: ROUTE-011
    phase_in: [diagnosis]
    title: Spill dominante sem skew
    when:
      all:
        - {finding: SF-UI-003, present: true}
        - {finding: SF-UI-001, present: false}
    recommended_skill: optimize-pyspark-code
    reason: >
      Pressão de memória sem skew: reduzir bytes no shuffle por filtro, projeção e
      pré-agregação antes de considerar capacidade.

  - id: ROUTE-012
    phase_in: [diagnosis, hypothesis]
    title: Gargalo dominante identificado, sem baseline
    when:
      all:
        - {case: gates.dominant_bottleneck_identified, equals: true}
        - {case: gates.baseline_captured, equals: false}
    recommended_skill: benchmark-pyspark-job
    reason: >
      Sem baseline não há como provar impacto, e qualquer número de ganho seria
      inventado. Capturar antes de mudar.
    blocked_by: [baseline_captured]

  - id: ROUTE-013
    phase_in: [hypothesis, experiment]
    title: Baseline capturado e gargalo identificado
    when:
      all:
        - {case: gates.baseline_captured, equals: true}
        - {case: gates.dominant_bottleneck_identified, equals: true}
        - {case: hypotheses, any_where: {status: open}}
    recommended_skill: benchmark-pyspark-job
    reason: >
      Alterar uma variável principal por experimento e medir. Hipótese aberta sem
      experimento é opinião.

  - id: ROUTE-014
    phase_in: [diagnosis]
    title: Nenhum achado de código, dados ou execução
    when:
      all:
        - {case: findings_index.count, count_eq: 0}
        - {case: facts_index.count, count_gt: 0}
    recommended_skill: review-glue-terraform
    reason: >
      Facts extraídos e nenhum finding: o código não é o gargalo. Revisar capacidade,
      observabilidade e configuração de IaC, agora com evidência de que o problema não
      está no código.

  - id: ROUTE-015
    phase_in: [validation, report]
    title: Mudança medida sem validação funcional definida
    when:
      all:
        - {case: gates.functional_validation_defined, equals: false}
    recommended_skill: review-pyspark-pr
    reason: >
      Ganho de performance sem validação de contagem, schema, chaves e agregados não é
      resultado, é risco. Definir a validação antes de fechar o relatório.
    blocked_by: [functional_validation_defined]

  - id: ROUTE-016
    phase_in: [diagnosis]
    title: Consumo por Athena presente
    when:
      all:
        - {case: scope.consumers, contains: athena}
    recommended_skill: optimize-iceberg-table
    reason: >
      Decisões de formato, particionamento e format version do job determinam o custo em
      Athena. Verificar as restrições cruzadas antes de recomendar mudança de formato ou
      de versão de Glue.
    note: >
      Ver knowledge/cross-service-constraints.md secao 1. Iceberg V3 escrito por Glue
      5.1 não é legível por Athena.

  # Rotas de COORDENADOR. Escolher agente deixa de ser julgamento e vira consulta,
  # pelo mesmo motivo que a escolha de skill virou: prosa dizendo "use o agente certo"
  # multiplica vocabulario quando ha seis deles.
  - id: AGENT-001
    phase_in: [intake, inventory]
    title: Sem runtime nem inventário
    when:
      any:
        - {case: runtime.glue, absent: true}
    recommended_agent: spark-performance-architect
    reason: >
      Coordenador geral enquanto o terreno não está mapeado. Sem runtime confirmado,
      nenhuma especialização se justifica — a guarda de versão de qualquer área falha
      fechada.

  - id: AGENT-002
    phase_in: [diagnosis, hypothesis]
    title: Achado dominante em infraestrutura Glue
    when:
      all:
        - {findings_area: SF-GLUE, count_gt: 0}
    recommended_agent: glue-infra-reviewer
    reason: >
      O gargalo está na definição do job, não no código: worker, bookmark, retries,
      observabilidade. Tuning de código não move nenhum deles.

  - id: AGENT-003
    phase_in: [diagnosis, hypothesis]
    title: Achado dominante em consulta Athena
    when:
      all:
        - {findings_area: SF-ATH, count_gt: 0}
    recommended_agent: athena-query-optimizer
    reason: >
      Athena cobra por bytes escaneados. O caminho passa por consulta, schema do catálogo
      e a fusão dos dois — nenhuma das três responde sozinha.

  # A POSIÇÃO NESTE ARQUIVO É PRECEDÊNCIA: `router._matching_rules` devolve na ordem
  # do YAML e `next_step` projeta `agent_matches[0]`. Esta rota vem ANTES da AGENT-004
  # de propósito, e é o único par da tabela em que isso precisa ser dito, porque é o
  # único par que lê O MESMO artefato -- o `.py` do job. SF-DQ é estritamente mais
  # estreita: um achado dela só existe se alguém rodou o extrator de validação, e a
  # pergunta que ela responde some junto com as linhas de validação. Deixada depois da
  # AGENT-004, a rota seria letra morta na prática, porque SF-PY dispara em quase todo
  # job -- e rota que nunca casa é a mesma classe de defeito que os invariantes de
  # cobertura desta fase existem para pegar. Nenhuma decisão anterior muda: facts `dq.*`
  # não existiam antes da Fase 5c, então nenhum case já resolvido tinha como casar aqui.
  - id: AGENT-008
    phase_in: [diagnosis, hypothesis]
    title: Achado dominante em validação de dados
    when:
      all:
        - {findings_area: SF-DQ, count_gt: 0}
    recommended_agent: data-quality-reviewer
    reason: >
      A pergunta é sobre a validação, e não sobre o dado: onde ela roda em relação ao
      write, se o resultado leva a alguma consequência e quantas passadas ela cobra.
      Revisão de código responde ao custo da chamada; ela não responde se a garantia
      que a suíte aparenta dar existe.

  # SF-GRAPH entra AQUI, e não numa rota própria antes desta, e o número que decidiu está
  # medido em `tests/test_rules_graph_boundary.py` e escrito em `agents/pyspark-code-reviewer.md`:
  # nas 25 fixtures de `fixtures/graph/`, SF-PY dispara 23 vezes em 20 e SF-GRAPH 9 vezes em
  # 6, e as seis são SUBCONJUNTO das vinte — proporção remedida na revisão final da 6a,
  # depois de o corpus ir de 19 para 25 fixtures, e ela não mudou de lado. O inverso do que a Fase 5c mediu para SF-DQ,
  # que por isso ganhou a AGENT-008 com precedência declarada. Como o destino é o MESMO
  # agente, a pergunta de precedência não existe nesta rota. Antes desta linha, um case com
  # achados só de grafo voltava de `next_step` com `recommended_agent: None`.
  - id: AGENT-004
    phase_in: [diagnosis, hypothesis]
    title: Achado dominante em código PySpark
    when:
      any:
        - {findings_area: SF-PY, count_gt: 0}
        - {findings_area: SF-PLAN, count_gt: 0}
        - {findings_area: SF-CG, count_gt: 0}
        - {findings_area: SF-GRAPH, count_gt: 0}
    recommended_agent: pyspark-code-reviewer
    reason: >
      Fonte, plano físico e grafo de chamadas são três leituras do mesmo código, e o
      achado só é forte quando elas concordam. Job de grafo com GraphFrames é uma quarta
      leitura do mesmo `.py`, e no corpus da própria área o achado de PySpark é o
      dominante — apagar as linhas de GraphFrames não deixa job nenhum de pé.

  - id: AGENT-005
    phase_in: [diagnosis, hypothesis]
    title: Achado dominante em Iceberg ou layout
    when:
      any:
        - {findings_area: SF-ICE, count_gt: 0}
        - {findings_area: SF-PQ, count_gt: 0}
    recommended_agent: iceberg-performance-engineer
    reason: >
      Distinguir data files, delete files, manifests, snapshots e metadata files decide
      qual manutenção resolve — e compactar a camada errada gasta DPU sem efeito.

  - id: AGENT-006
    phase_in: [diagnosis, hypothesis, experiment]
    title: Fluxo incremental com latest-per-key
    when:
      any:
        - {case: scope.entrypoints, contains: incremental}
    recommended_agent: glue-incremental-performance-architect
    reason: >
      Fluxo full e incremental no mesmo job, latest-per-key em tabela bilionária e
      batching exigem mapear a biblioteca inteira antes de qualquer tuning localizado.

  # `SF-EMRS` entra AQUI, e a correção é PRÉ-EXISTENTE — não é regressão da Fase 6a.
  # `emr-infra-reviewer` declara a área em `rule_areas` desde a Fase 5d, e a condição
  # casava `findings_area` por IGUALDADE exata: um case só com achados de EMR
  # Serverless — as seis regras `SF-EMRS-*` — voltava de `next_step` com
  # `recommended_agent: None`, sem coordenador nenhum. `all:` com uma condição vira
  # `any:` com duas, e o destino é o mesmo agente, então não há pergunta de
  # precedência dentro desta rota. Um case com SF-GLUE junto continua indo para a
  # AGENT-002, que vem antes: nada do despacho já existente muda.
  - id: AGENT-007
    phase_in: [diagnosis, hypothesis]
    title: Achado dominante em infraestrutura EMR — cluster ou Serverless
    when:
      any:
        - {findings_area: SF-EMR, count_gt: 0}
        - {findings_area: SF-EMRS, count_gt: 0}
    recommended_agent: emr-infra-reviewer
    reason: >
      O gargalo ou o risco está na definição do cluster ou da application, não no código:
      modelo de instância, purchasing option por papel, managed scaling e Configurations em
      dois níveis no EMR on EC2; capacidade pré-inicializada faturada com a application
      ociosa, janela de auto-stop e segredo em `runtimeConfiguration` no Serverless. Nenhum
      deles tem equivalente em Glue, e a correção é o próximo provisionamento — não uma
      edição no que já está em execução.

  # AS TRÊS ÁREAS DE MEDIÇÃO, e a posição desta rota é precedência declarada.
  # `SF-UI`, `SF-BENCH` e `SF-FVAL` são as três áreas cujo artefato é uma EXECUÇÃO —
  # a Spark UI de um job que rodou, a comparação entre duas execuções, a validação
  # funcional de antes e depois —, e `spark-performance-architect` é o único
  # coordenador que declara as três em `rule_areas`. Como ele também declara `SF-PY` e
  # `SF-PLAN`, esta rota vem DEPOIS da AGENT-004: um case com achado de código e de
  # execução continua indo para o `pyspark-code-reviewer`, exatamente como antes desta
  # linha existir. Medido: nenhum despacho já resolvido muda, porque antes daqui as
  # três áreas não casavam rota nenhuma.
  - id: AGENT-009
    phase_in: [diagnosis, hypothesis]
    title: Achado dominante em medição de execução
    when:
      any:
        - {findings_area: SF-UI, count_gt: 0}
        - {findings_area: SF-BENCH, count_gt: 0}
        - {findings_area: SF-FVAL, count_gt: 0}
    recommended_agent: spark-performance-architect
    reason: >
      O achado veio de uma execução medida — Spark UI, comparação entre duas execuções ou
      validação funcional de antes e depois —, e nenhuma delas responde sozinha qual é o
      gargalo dominante. Correlacionar código, plano físico e medição é o trabalho do
      coordenador geral, e é ele quem decide se a especialização se justifica.

  # `SF-ENV` POR ÚLTIMO, e a razão é que ela é a área que TRÊS coordenadores declaram:
  # `glue-infra-reviewer`, `emr-infra-reviewer` e `glue-incremental-performance-architect`.
  # A posição resolve o empate sem inventar condição de runtime: quando há qualquer
  # evidência de outra área — Glue, EMR, Iceberg, código —, a rota daquela área vem antes
  # e leva o case. Esta só casa quando SF-ENV é TUDO que há, e aí a pergunta é sobre a
  # definição do job (versão de Glue, `glueContext`, default de AQE, format version do
  # Iceberg), que é o assunto do `glue-infra-reviewer`.
  - id: AGENT-010
    phase_in: [diagnosis, hypothesis]
    title: Achado apenas em ambiente e runtime
    when:
      all:
        - {findings_area: SF-ENV, count_gt: 0}
    recommended_agent: glue-infra-reviewer
    reason: >
      O achado é sobre o ambiente em que o job roda, e não sobre o que ele faz: divergência
      entre fontes de detecção de runtime, format version escrita por um runtime e lida por
      outro, observabilidade declarada sem o contexto que a alimenta. Todos se decidem na
      definição do job, e nenhum se resolve editando transformação.

# Fallback: nenhuma regra casou.
fallback:
  recommended_skill: sparkforge-diagnose
  reason: >
    Nenhuma regra de roteamento casou com o estado atual do case. Voltar ao diagnóstico
    ponta a ponta e registrar em open_questions qual evidência falta, para que uma regra
    nova cubra este estado.
