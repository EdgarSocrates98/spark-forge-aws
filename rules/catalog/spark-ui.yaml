# Catálogo de regras — métricas de execução (Spark UI / event log)
# Depende do extrator de event log da Fase 1. Regras ficam inertes até ele existir
# (requires_facts não satisfeito) e passam a valer sem mudança de código.
# Estas são as únicas regras com status confirmed por natureza: há measure de execução.
#
# ESCOPO (Fase 5a, Task 3c): as seis declaravam `runtime_scope:
# {spark: ">=3.0"}`, herdado da Task 2, que as moveu de `{glue: "*"}` --
# permissivo e errado -- para um guarda estrito e igualmente errado. Passaram
# para `{}`.
#
# O CRITÉRIO: `runtime_scope` só pode ser não-vazio quando o GATILHO varia com a
# versão E essa versão vem do runtime detectado. Aqui o gatilho é MEDIDA DE
# EXECUÇÃO tirada do event log: razão max/p50 de duração de task, bytes de
# spill, tempo de GC, executor perdido, contagem de tasks contra cores. Uma task
# 10x mais lenta que a mediana é skew em Spark 3.0 e em 3.5.
#
# O EFEITO MEDIDO, e o mais absurdo do catálogo: o event log é justamente a
# fonte MAIS confiável de `spark.version` -- mas `judge` recebe o runtime que a
# CLI montou, não o que o extrator viu. Com `build_runtime_context()` sem flags,
# que é o padrão de `sparkforge judge`, o contexto sai com `spark: ""`,
# `in_scope` falha fechada (`sparkforge/rules/version_scope.py`), e a ÁREA SF-UI
# INTEIRA sumia: 6 puladas, 0 avaliadas -- inclusive sobre um event log que
# carrega a versão. Se um dia o runtime for propagado do extrator para o
# `judge`, o lugar de usá-lo continua sendo uma regra cujo GATILHO dependa da
# versão; nenhuma destas seis é.
#
# RECOMENDAÇÃO VERSIONADA (Fase 5a.2, Task 3): SF-UI-006 manda "deixar o AQE
# coalescer" num bullet de `proposed_change`, e o AQE só é default a partir do
# Spark 3.2. SF-UI-002 cita AQE no `explanation`, e não como contexto: a frase
# nomeia o TRATAMENTO do skew que a regra classificou, e `proposed_change`
# aponta de volta para ela ("seguir o caminho de skew de dados"), então o
# operador decide por ali. As duas estão no remédio, nunca no gatilho -- cores
# ociosos e input desigual são o que são em qualquer versão, e o escopo segue
# vazio. O que mudou é o TEXTO: declara a condição e o que fazer em 3.0 e 3.1.
# AQE existe desde o Spark 3.0; o que mudou em 3.2 foi o default de
# `spark.sql.adaptive.enabled`, então nos dois casos a alternativa é habilitar a
# flag, ou dimensionar à mão o que o AQE ajustaria.
# Ramificar a recomendação por versão é decisão da Fase 5b.

catalog_version: 1
schema_version: 1
area: SF-UI
retrieved: 2026-07-29

rules:

  - id: SF-UI-001
    category: spark-ui
    title: Skew de duração de task no stage
    requires_facts: [spark.stage.task_duration]
    when:
      all:
        - fact: spark.stage.task_duration
          expr: "measures.max_ms / measures.p50_ms >= threshold.ratio"
    threshold: {ratio: 3.0}
    status: confirmed
    severity_by:
      - {when: "measures.max_ms / measures.p50_ms >= 10", severity: P0}
      - {when: "measures.max_ms / measures.p50_ms >= 3", severity: P2}
    # Escopo vazio: gate por `spark.stage.task_duration` (event log), nao por
    # versao. Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      O stage termina quando a última task termina. Uma task muito mais longa que a
      mediana significa que a maior parte do cluster está ociosa esperando por ela.
      Este achado sozinho não distingue skew de dados de skew de computação: cruzar com
      SF-UI-002 para separá-los, porque o tratamento é diferente. Ver
      knowledge/spark/shuffle-join-skew.md secao 3.
    proposed_change:
      - Cruzar com a razão de input bytes (SF-UI-002) para classificar o tipo de skew.
      - Identificar a chave responsável, medindo a distribuição das top-N chaves e a contagem de nulls.
      - Aplicar o tratamento adequado ao tipo, na ordem de custo crescente da tabela de tratamentos.
    action:
      kind: skew.apply_treatment
      target: spark.stage
      direction: replace
      requires_absent: []
      moves:
        - skew.task_duration_ratio
        - correctness.write_result
      depends_on:
        - SF-UI-002
    risks:
      - Tratar skew mexendo na chave de join pode alterar o resultado, por duplicação ou por descarte de nulls.
    tradeoffs:
      - Salting adiciona complexidade permanente ao código e deve ser a última tentativa, não a primeira.
    validation:
      - Contagem total antes e depois.
      - Contagem de linhas com chave nula.
      - Contagem distinta da chave primária do resultado, para detectar duplicação.
      - Agregados de controle por dimensão de negócio.
      - Nova razão max/p50 do stage após a mudança.
    rollback: [Reverter o commit. Se houve escrita, usar time travel em Iceberg.]
    sources:
      - {url: "https://docs.aws.amazon.com/glue/latest/dg/monitor-observability.html", retrieved: 2026-07-29}
      - {origin: field-heuristic, note: "Limiares 3 e 10 são heurística de campo. O fator default do Glue para skewness é 5, o que é consistente com a faixa."}

  - id: SF-UI-002
    category: spark-ui
    title: Skew de input bytes no stage
    requires_facts: [spark.stage.task_input]
    when:
      all:
        - fact: spark.stage.task_input
          expr: "measures.max_bytes / measures.p50_bytes >= threshold.ratio"
    threshold: {ratio: 3.0}
    status: confirmed
    severity_default: P2
    # Escopo vazio: gate por `spark.stage.task_input` (event log), nao por
    # versao. Ver ESCOPO (Fase 5a) no cabecalho.
    # RECOMENDACAO VERSIONADA: `explanation` nomeia o tratamento do skew de
    # dados, e um dos tres e o skew join do AQE (default so a partir do Spark
    # 3.2). Agora declara a condicao; os outros dois nao dependem de versao.
    # Ver RECOMENDACAO VERSIONADA no cabecalho.
    runtime_scope: {}
    explanation: >
      Distingue skew de dados de skew de computação, e essa distinção muda a ação.
      Duração desigual com input uniforme indica computação desigual: UDF caro em
      certas linhas, explode com fan-out variável. Repartition não resolve esse caso.
      Duração desigual com input desigual é skew de dados clássico, tratável pelo skew
      join do AQE — ligado por default a partir do Spark 3.2, e em 3.0 e 3.1 só com
      spark.sql.adaptive.enabled=true —, por separação de nulls ou por isolamento de hot
      key; estes dois últimos não dependem de versão e são o caminho quando o AQE não
      está disponível.
    proposed_change:
      - Se input é uniforme e duração não é, investigar UDF e explode, não a distribuição da chave.
      - Se input é desigual, seguir o caminho de skew de dados.
    action:
      kind: skew.classify_type
      target: spark.stage
      direction: investigate
      requires_absent: []
      moves: []
      depends_on: []
    risks: [Classificar errado leva a aplicar o tratamento inútil e concluir que "nada funciona".]
    tradeoffs: [Nenhum; é medição.]
    validation: [Nova razão max/p50 de input após a mudança.]
    rollback: [Não aplicável; regra de classificação.]
    sources:
      - {origin: field-heuristic, note: "A comparação entre razão de duração e razão de input é o discriminador; não há limiar oficial."}

  - id: SF-UI-003
    category: spark-ui
    title: Spill em disco maior que o input do stage
    requires_facts: [spark.stage.spill]
    when:
      all:
        - fact: spark.stage.spill
          expr: "measures.disk_spill_bytes / measures.input_bytes >= threshold.ratio"
    threshold: {ratio: 1.0}
    status: confirmed
    severity_default: P1
    # Escopo vazio: gate por `spark.stage.spill` (event log), nao por versao.
    # Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      Escrever em disco mais bytes do que leu indica que o algoritmo ou o tamanho de
      partição são inadequados, não apenas que falta memória. A correção começa por
      reduzir o volume que entra no shuffle, e só termina em mais memória. Aumentar
      memória primeiro trata o sintoma e mantém o custo. Ver
      knowledge/spark/memory-and-oom.md secao 4.
    proposed_change:
      - Reduzir bytes no shuffle por filtro, projeção e pré-agregação.
      - Aumentar o número de partições, reduzindo o tamanho de cada uma.
      - Verificar e corrigir skew antes de mexer em memória.
      - Só então avaliar worker da série R, que dobra a memória com o mesmo vCPU.
    action:
      kind: shuffle.reduce_bytes
      target: spark.stage.shuffle
      direction: decrease
      requires_absent: []
      moves:
        - shuffle.spill_bytes
      depends_on: []
    risks: [Aumentar partições em excesso troca spill por overhead de agendamento.]
    tradeoffs: [Worker R custa mais por vCPU efetivo; só se justifica com memória comprovadamente limitante.]
    validation:
      - Razão spill/input após a mudança.
      - Runtime e custo de compute medido antes e depois.
      - Resultado funcional idêntico.
    rollback: [Reverter configuração de capacidade e de partições.]
    sources:
      - {origin: field-heuristic, note: "Razão 1.0 é limiar de campo, escolhido por ser interpretável: escreveu mais do que leu."}

  - id: SF-UI-004
    category: spark-ui
    title: GC dominando o tempo de executor
    requires_facts: [spark.stage.gc]
    when:
      all:
        - fact: spark.stage.gc
          expr: "measures.gc_ms / measures.executor_run_ms >= threshold.ratio"
    threshold: {ratio: 0.15}
    status: confirmed
    severity_by:
      - {when: "measures.gc_ms / measures.executor_run_ms >= 0.20", severity: P1}
      - {when: "measures.gc_ms / measures.executor_run_ms >= 0.15", severity: P2}
    # Escopo vazio: gate por `spark.stage.gc` (event log), nao por versao.
    # Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      GC alto com heap não cheio indica muitos objetos de vida curta, típico de UDF
      Python e de conversão linha a linha. GC alto com heap cheio indica dado demais
      por executor. As duas causas têm correções opostas, então é obrigatório cruzar com
      glue.ALL.memory.heap.used.percentage antes de decidir.
    proposed_change:
      - Cruzar com a série temporal de heap dos executores para classificar a causa.
      - Se heap não está cheio, eliminar UDF Python e conversões por linha.
      - Se heap está cheio, reduzir dado por executor ou usar worker com mais memória.
    action:
      kind: measurement.collect_baseline
      target: spark.executor.memory
      direction: investigate
      requires_absent: []
      moves: []
      depends_on: []
    risks:
      - Aumentar memória quando a causa é alocação de objetos não resolve e encarece.
      - "Das três ações propostas, duas não tocam o resultado (heap, worker) e UMA toca: eliminar UDF Python troca a implementação que produz o valor. Nulo, precisão decimal, fuso, ordenação de string e comportamento de borda diferem entre a UDF e a função nativa que a substitui, e a diferença não aparece no tempo de GC — que é justamente o que esta regra mede."
    tradeoffs: []
    validation:
      - Razão gc/run após a mudança.
      - Runtime e custo de compute medido antes e depois.
      - "Se a ação foi eliminar UDF Python: resultado comparado linha a linha numa amostra representativa que inclua nulls e valores de borda, mais contagem total e contagem de nulls da coluna resultado idênticas. É a MESMA validação que SF-PY-001 e SF-PLAN-001 exigem para a MESMA troca, e ela não fica mais barata por a troca ter chegado aqui pela via do GC em vez da via do código."
      - "Se a ação foi reduzir dado por executor ou trocar de worker: nenhum eixo de dado é exigido, e declarar isso é parte da validação — capacidade não move o resultado, e dizer qual das duas metades você aplicou é o que separa um run comparável de um experimento com duas variáveis."
    rollback: [Reverter a mudança de código ou de capacidade.]
    sources:
      - {origin: field-heuristic, note: "Limiares 15% e 20% são heurística de campo amplamente usada; não há valor normativo da AWS ou do Apache."}

  - id: SF-UI-005
    category: spark-ui
    title: Executor removido sem OOM registrado no log
    requires_facts: [spark.executor.lost]
    when:
      all:
        - fact: spark.executor.lost
          where: {attrs.heap_oom_in_log: false}
    status: confirmed
    severity_default: P0
    # Escopo vazio: gate por `spark.executor.lost` (event log), nao por versao.
    # Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      Executor desaparecendo sem OOM de heap no log aponta para estouro de memória do
      container, fora do heap: Python worker, buffers Arrow, buffers de rede, metaspace.
      A correção é spark.executor.memoryOverhead, não spark.executor.memory. É o OOM
      mais mal diagnosticado que existe, e a assinatura de que foi mal diagnosticado é
      "aumentei a memória e continuou". Ver knowledge/spark/memory-and-oom.md secao 2,
      classe container/overhead.
    proposed_change:
      - Aumentar spark.executor.memoryOverhead, não spark.executor.memory.
      - Reduzir o tamanho de batch de pandas_udf, se houver.
      - Eliminar UDF Python, que é a fonte mais comum de consumo fora do heap.
      - Cruzar com glue.ALL.memory.non-heap.used.percentage para confirmar.
    action:
      kind: capacity.increase_memory_overhead
      target: spark.executor.memoryOverhead
      direction: increase
      requires_absent: []
      moves:
        - capacity.executor_footprint
        - availability.executor_loss
      depends_on: []
    risks:
      - Aumentar overhead reduz a memória disponível para o heap dentro do mesmo container.
      - "Duas das quatro ações propostas mudam o resultado, e nenhuma delas falha ao mudá-lo. Eliminar UDF Python troca nulo, precisão, fuso e borda pela semântica da função nativa. E reduzir o tamanho de batch de pandas_udf muda o resultado de toda UDF vetorizada que NÃO seja linha a linha — normalização, ranking, preenchimento por vizinho e qualquer coisa que olhe o batch inteiro devolvem outro valor com outro tamanho de batch. Nada no plano físico nem no event log acusa isso: o nó continua sendo ArrowEvalPython."
    tradeoffs: [Em algum ponto, worker maior é mais simples do que rebalancear heap e overhead.]
    validation:
      - Ausência de executores removidos no run seguinte.
      - glue.ALL.memory.non-heap.used.percentage abaixo do nível anterior.
      - Categoria de erro do Glue Observability sem OUT_OF_MEMORY_ERROR.
      - No Databricks, e em qualquer Spark sem Glue Observability, nenhum executor removido por OOM no event log do run seguinte.
      - "Se a ação foi eliminar UDF Python: resultado comparado linha a linha numa amostra que inclua nulls e valores de borda, mais contagem total e contagem de nulls da coluna resultado idênticas — a mesma validação que SF-PY-001 e SF-PLAN-001 exigem para a mesma troca."
      - "Se a ação foi reduzir o batch de pandas_udf: a coluna produzida pela UDF comparada VALOR A VALOR entre o batch antigo e o novo, sobre a mesma entrada. Contagem e schema são iguais por construção nos dois, então os eixos baratos não dizem nada aqui; é o valor que responde se a UDF era linha a linha ou não."
      - "Se a ação foi só memoryOverhead: nenhum eixo de dado é exigido, e declarar isso é parte da validação — é a única das quatro que mexe em capacidade e não em semântica."
    rollback: [Reverter o valor de memoryOverhead.]
    sources:
      - {url: "https://docs.aws.amazon.com/glue/latest/dg/monitor-observability.html", retrieved: 2026-07-29}

  - id: SF-UI-006
    category: spark-ui
    title: Subparalelismo — tasks muito abaixo dos cores disponíveis
    requires_facts: [spark.stage.task_count, spark.cluster.cores]
    when:
      all:
        - fact: spark.stage.task_count
          expr: "measures.task_count < measures.available_cores * threshold.factor"
    threshold: {factor: 0.5}
    status: confirmed
    severity_default: P2
    # Escopo vazio: gate por `spark.stage.task_count` +
    # `spark.cluster.cores` (event log), nao por versao.
    # RECOMENDACAO VERSIONADA: o segundo bullet de `proposed_change` manda
    # 'deixar o AQE coalescer', que so e default a partir do Spark 3.2, e agora
    # declara a condicao e o que fazer em 3.0/3.1. Cores ociosos sao cores
    # ociosos em qualquer versao. Ver ESCOPO (Fase 5a) e RECOMENDACAO
    # VERSIONADA no cabecalho.
    runtime_scope: {}
    explanation: >
      Cores alocados e ociosos são horas de compute pagas sem trabalho. Causas mais comuns:
      poucos arquivos de entrada grandes, arquivos de texto comprimidos com gzip que
      não são splitáveis, ou spark.sql.shuffle.partitions baixo para o volume. Um
      arquivo .csv.gz de 20 GB é sempre uma única task, e nenhum aumento de
      paralelismo ajuda. Ver knowledge/storage/parquet-layout.md secao 4.
    proposed_change:
      - Verificar splitabilidade dos arquivos de entrada; converter texto gzip para Parquet.
      - Aumentar spark.sql.shuffle.partitions e deixar o AQE coalescer o excesso. O coalescing só age com AQE ligado, default a partir do Spark 3.2; em 3.0 e 3.1, habilitar spark.sql.adaptive.enabled antes, ou dimensionar o valor pelo volume, porque sem AQE ele é a contagem final e um número alto demais só troca cores ociosos por overhead de agendamento.
      - Reduzir o número de workers se o paralelismo real não pode aumentar.
    action:
      kind: shuffle.change_partition_count
      target: spark.sql.shuffle.partitions
      direction: increase
      requires_absent: []
      moves:
        - shuffle.partition_count
      depends_on: []
    risks: [Aumentar partições em job pequeno cria overhead de agendamento sem ganho.]
    tradeoffs: [Converter formato de entrada é mudança no produtor, não no consumidor.]
    validation:
      - Contagem de tasks versus cores após a mudança.
      - glue.driver.workerUtilization antes e depois.
      - Runtime e custo de compute medido antes e depois.
    rollback: [Reverter configuração de partições e de capacidade.]
    sources:
      - {origin: field-heuristic, note: "Fator 0.5 é ponto de partida. O sinal decisivo é workerUtilization, não a contagem isolada."}

  - id: SF-UI-007
    category: spark-ui
    title: Executor lento em vários stages sem partição maior — lentidão do nó
    requires_facts: [spark.executor.slow_node]
    when:
      all:
        - fact: spark.executor.slow_node
          expr: "measures.stages_slow >= threshold.min_stages"
    threshold: {min_stages: 2}
    status: confirmed
    severity_default: P2
    # Escopo vazio: o criterio de task lenta ja e o da versao, resolvido no
    # extrator (`spark.stage.slow_tasks` le a versao de SparkListenerLogStart);
    # a regra so conta stages.
    runtime_scope: {}
    explanation: >
      O mesmo executor teve tasks acima do critério de cópia especulativa do
      Spark — max(multiplier × mediana, tempo mínimo) — em dois ou mais stages,
      e essas tasks não leram mais que a mediana do stage, contando input e
      shuffle lido. A partição não explica a lentidão; o nó explica: worker
      degradado, disco lento, rede ou vizinho barulhento. Skew é o caso oposto,
      a task lenta porque leu mais.
    proposed_change:
      - Investigar o worker do executor nomeado (disco, rede e CPU do nó no mesmo intervalo) antes de mexer em configuração.
      - Se o nó não puder ser trocado, ligar spark.speculation como mitigação — `sparkforge tune` propõe o valor com os stages medidos.
    action:
      kind: capacity.investigate_slow_executor
      target: spark.speculation
      direction: investigate
      requires_absent: []
      moves:
        - skew.task_duration_ratio
      depends_on: []
    risks: [Speculation duplica trabalho e I/O; com lentidão da partição ela só relança a task grande.]
    tradeoffs: [Investigar o nó custa tempo de análise; speculation custa recurso em todo run.]
    validation:
      - Razão p95/p50 de duração de task nos stages nomeados, depois da mudança.
      - Contagem de tasks lentas do mesmo executor no run seguinte.
    rollback: [Reverter spark.speculation; nenhuma escrita de dado é envolvida.]
    sources:
      - {url: "https://raw.githubusercontent.com/apache/spark/v3.5.4/core/src/main/scala/org/apache/spark/scheduler/TaskSetManager.scala", retrieved: 2026-09-14, note: "Critério de task especulável: max(multiplier × mediana, tempo mínimo), depois de o quantile de tasks terminar. A mesma fórmula nas tags v3.1.1 e v4.1.1."}
      - {url: "https://spark.apache.org/docs/latest/configuration.html", retrieved: 2026-09-14, note: "Defaults de spark.speculation.multiplier (3), quantile (0.9) e minTaskRuntime (100ms) desde o Spark 4.0.0; 1.5 e 0.75 antes."}
