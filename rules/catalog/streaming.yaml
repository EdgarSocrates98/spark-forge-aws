# Regras da primeira onda de Structured Streaming.
# `env.runtime_signal` é exigido como evidência de runtime observado; o escopo
# vazio não inventa uma fronteira de versão. Nenhuma regra promete capacidade,
# throughput, custo ou exactly-once.
catalog_version: 1
schema_version: 1
area: SF-STREAM
retrieved: 2026-10-01

rules:
  - id: SF-STREAM-001
    category: streaming
    title: Checkpoint não declarado na definição da query
    requires_facts: [streaming.query, env.runtime_signal]
    when:
      all:
        - fact: streaming.query
          where: {attrs.checkpoint_configured: false}
    status: structural
    severity_default: P1
    runtime_scope: {}
    explanation: >
      A leitura estática observou uma query Structured Streaming sem uma opção
      checkpointLocation na cadeia analisada. Isso não prova que uma configuração
      externa inexiste nem que houve perda de dados; exige conferir a configuração
      efetiva e o destino antes de recomendar mudança.
    proposed_change:
      - Confirmar o runtime e a configuração efetiva da query.
      - Declarar um checkpoint estável e exclusivo por query somente se a medição confirmar que falta.
      - Verificar reinício, replay e idempotência do sink antes de alterar produção.
    action:
      kind: measurement.collect_baseline
      target: streaming.checkpoint
      direction: investigate
      requires_absent: []
      moves: [observability.diagnostic_artifacts, correctness.write_result]
      depends_on: []
    risks:
      - Apontar query para checkpoint já usado pode misturar estado ou offsets incompatíveis.
      - Alterar checkpoint pode mudar o ponto de retomada e exigir procedimento de replay.
    tradeoffs:
      - Persistência do checkpoint acrescenta armazenamento e operação de retenção.
    validation:
      - Confirmar localização, permissões, isolamento por query e runtime efetivo.
      - Fazer teste controlado de parada e retomada com um sink idempotente.
      - Comparar contagem, chaves e agregados do resultado antes de promover a mudança.
    rollback:
      - Reverter a alteração de configuração e preservar o checkpoint anterior sem apagá-lo.
    sources:
      - {url: "https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html", retrieved: 2026-10-01}
      - {url: "https://docs.aws.amazon.com/glue/latest/dg/add-job-streaming.html", retrieved: 2026-10-01}
    knowledge_refs:
      - {ref: knowledge/streaming-reliability.md}

  - id: SF-STREAM-002
    category: streaming
    title: Série observada com processamento abaixo da entrada
    requires_facts: [streaming.progress.series, env.runtime_signal]
    when:
      all:
        - fact: streaming.progress.series
          expr: "measures.observation_count >= 2 and attrs.all_processed_below_input"
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      Em todas as observações da série, a taxa processada ficou abaixo da taxa de
      entrada registrada no mesmo progresso. O fato não identifica sozinho se a
      causa é fonte, trigger, estado, sink, capacidade ou atraso de métrica; a
      investigação deve cruzar o plano, o runtime e o backlog do transporte.
    proposed_change:
      - Coletar uma série comparável de progresso, duração de trigger, offsets e backlog da fonte.
      - Localizar se a diferença nasce em processamento, state store, sink ou capacidade.
      - Alterar uma variável principal por experimento e validar o resultado funcional.
    action:
      kind: measurement.collect_baseline
      target: streaming.progress.series
      direction: investigate
      requires_absent: []
      moves: [runtime.wall_clock, correctness.write_result]
      depends_on: []
    risks:
      - Comparar janelas ou fontes não pareadas pode criar uma diferença que não existe.
      - Escalar infraestrutura antes de localizar o gargalo pode aumentar custo sem resolver atraso.
    tradeoffs:
      - Maior observabilidade aumenta volume de logs e custo de retenção.
    validation:
      - Confirmar unidade, janela, batch_id, fonte e timestamp de cada observação.
      - Comparar backlog e duração por batch antes e depois da única variável alterada.
      - Executar proxies de contagem, schema, chaves e agregados do resultado.
    rollback:
      - Reverter a única alteração experimental e manter os artefatos de baseline.
    sources:
      - {url: "https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html", retrieved: 2026-10-01}
      - {url: "https://spark.apache.org/docs/latest/api/python/reference/pyspark.ss/api/pyspark.sql.streaming.StreamingQuery.lastProgress.html", retrieved: 2026-10-01}
    knowledge_refs:
      - {ref: knowledge/streaming-reliability.md}

  - id: SF-STREAM-003
    category: streaming
    title: Crescimento de state observado na série
    requires_facts: [streaming.progress.series, env.runtime_signal]
    when:
      all:
        - fact: streaming.progress.series
          expr: "measures.observation_count >= 2 and attrs.state_growth_observed"
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      A série contém medidas de state operator e o total de linhas de state no
      último ponto é maior que no primeiro. Isso é crescimento observado, não prova
      vazamento: watermark, cardinalidade, janela, atraso de eventos e política de
      limpeza ainda precisam ser medidos.
    proposed_change:
      - Correlacionar state rows, watermark, event-time, janela e late data por batch.
      - Confirmar se a operação é bounded e se o state store possui caminho de limpeza.
      - Medir memória e duração antes de escolher mudança de watermark, chave ou capacidade.
    action:
      kind: measurement.collect_baseline
      target: streaming.progress.state_operator
      direction: investigate
      requires_absent: []
      moves: [runtime.wall_clock, correctness.write_result]
      depends_on: []
    risks:
      - Reduzir watermark ou alterar chave pode descartar eventos tardios ou alterar agregados.
      - Limpar state sem replay controlado pode tornar o resultado irreprodutível.
    tradeoffs:
      - Watermark mais agressivo reduz state potencial e reduz tolerância a atraso de evento.
    validation:
      - Comparar state rows, memoryUsedBytes, watermark e agregados por janela.
      - Reprocessar amostra com atraso conhecido e conferir a política de late data.
      - Validar resultado funcional e reinício a partir do checkpoint.
    rollback:
      - Reverter a mudança de query e manter checkpoint/artefatos para replay controlado.
    sources:
      - {url: "https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html", retrieved: 2026-10-01}
      - {url: "https://spark.apache.org/docs/latest/api/python/_modules/pyspark/sql/streaming/listener.html", retrieved: 2026-10-01}
    knowledge_refs:
      - {ref: knowledge/streaming-reliability.md}

  - id: SF-STREAM-013
    category: streaming
    title: Watermark observado sem avanço na série
    requires_facts: [streaming.progress.series, env.runtime_signal]
    when:
      all:
        - fact: streaming.progress.series
          expr: "measures.observation_count >= 2 and attrs.watermark_stalled"
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      O watermark observado permaneceu igual entre os pontos válidos da série.
      Isso é um sintoma temporal no artefato fornecido; não prova falta de
      eventos, atraso de relógio, problema de source, state ou causa raiz.
    proposed_change:
      - Correlacionar watermark, event-time, input, atraso de eventos, state e backlog na mesma janela.
      - Confirmar se a ausência de avanço é esperada pelo workload ou representa atraso operacional.
      - Alterar uma variável principal somente depois de preservar baseline e validar o resultado.
    action:
      kind: measurement.localize_divergence
      target: streaming.progress.watermark
      direction: investigate
      requires_absent: []
      moves: [runtime.wall_clock, correctness.write_result]
      depends_on: []
    risks:
      - Reduzir watermark sem entender late data pode descartar eventos e mudar agregados.
      - Uma janela curta pode capturar período sem novos eventos e parecer parada.
    tradeoffs:
      - Reter event-time, watermark e backlog aumenta observabilidade e armazenamento.
    validation:
      - Confirmar timestamps timezone-aware, query, batch ids e watermark de cada ponto.
      - Comparar event-time, late data, state rows, backlog e resultado funcional em nova janela.
      - Executar proxies de contagem, schema, chaves e agregados antes de promover mudança.
    rollback:
      - Reverter a única mudança experimental e preservar a série original para reauditoria.
    sources:
      - {url: "https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html", retrieved: 2026-10-02}
      - {url: "https://spark.apache.org/docs/latest/api/python/_modules/pyspark/sql/streaming/listener.html", retrieved: 2026-10-02}
    knowledge_refs:
      - {ref: knowledge/streaming-reliability.md}

  - id: SF-STREAM-014
    category: streaming
    title: Crescimento observado de memória do state
    requires_facts: [streaming.progress.series, env.runtime_signal]
    when:
      all:
        - fact: streaming.progress.series
          expr: "measures.observation_count >= 2 and attrs.state_memory_growth_observed"
    status: confirmed
    severity_default: P1
    runtime_scope: {}
    explanation: >
      A memória total reportada pelos state operators aumentou entre o primeiro
      e o último ponto válido da série. O fato não prova leak, pressão de heap,
      cardinalidade ilimitada ou que a mudança de watermark seja correta.
    proposed_change:
      - Correlacionar memória, state rows, watermark, cardinalidade, duração e backlog.
      - Confirmar se todos os operadores da janela informaram a métrica e se a operação é bounded.
      - Medir uma variável principal e validar o resultado funcional antes de escalar capacidade.
    action:
      kind: measurement.localize_divergence
      target: streaming.progress.state_memory
      direction: investigate
      requires_absent: []
      moves: [runtime.wall_clock, correctness.write_result]
      depends_on: []
    risks:
      - Tratar crescimento observado como leak pode provocar alteração destrutiva de state ou watermark.
      - Escalar workers sem medir cardinalidade e sink pode elevar custo sem resolver a causa.
    tradeoffs:
      - Métricas por operador aumentam payload e retenção, mas preservam a prova da divergência.
    validation:
      - Confirmar unidade bytes, operador, batch ids, timestamps e completude dos operadores.
      - Comparar memória, state rows, watermark, input e resultado funcional antes/depois.
      - Testar restart/replay controlado quando a mudança tocar checkpoint ou state.
    rollback:
      - Reverter a única mudança experimental e preservar checkpoint e baseline sem apagá-los.
    sources:
      - {url: "https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html", retrieved: 2026-10-02}
      - {url: "https://spark.apache.org/docs/latest/api/python/_modules/pyspark/sql/streaming/listener.html", retrieved: 2026-10-02}
    knowledge_refs:
      - {ref: knowledge/streaming-reliability.md}
