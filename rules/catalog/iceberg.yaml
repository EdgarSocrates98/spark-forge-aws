# Catálogo de regras — Apache Iceberg
#
# VETOS DESTA ÁREA
#
# V-ICE-1 — MANIFESTS NÃO TÊM LIMIAR COM FONTE, e por isso não há regra sobre
#   eles. O extrator emite `iceberg.manifests_summary` com `manifest_count`,
#   `total_bytes` e `avg_data_files_per_manifest` desde a Fase 1, e
#   `knowledge/storage/iceberg-performance.md` diz que manifests causam
#   "planejamento lento; driver heap alto" e que `rewrite_manifests` é a ação
#   — mas **não publica número nenhum**.
#
#   `avg_data_files_per_manifest < N` seria N inventado, e no relatório ele
#   apareceria com a mesma cara de um limiar medido. É o mesmo defeito que
#   `IcebergMaintenancePlanner` tinha com `> 20`, `> 5` e `> 50` (removidos em
#   2026-09-02) e que os vetos V-CTM-5 (SLA) e V-BR-3 (fan-in) recusaram nas
#   suas áreas.
#
#   Consequência declarada: `sparkforge/iceberg/maintenance.py` mantém
#   `rewrite_manifests` em `refused`, com esta razão. A ação existe e é
#   conhecida; o que falta é saber QUANDO propô-la.
#
#   Destravaria: uma fonte que publique limiar de manifest — tamanho alvo,
#   contagem por partição, ou razão de data files por manifest —, ou uma
#   medição neste corpus que ligue `avg_data_files_per_manifest` a tempo de
#   planejamento observado em event log.
#
#   O que NÃO destrava: `SF-ICE-003` já pega churn de snapshot, e cada commit
#   cria manifests (`iceberg-performance.md` linha 138). Um `rewrite_manifests`
#   proposto por causa de churn seria a mesma evidência contada duas vezes.
#
# V-ICE-2 — VERSÃO DE FORMATO CONTRA BIBLIOTECA EMBARCADA NÃO TEM PRODUTOR, e
#   por isso a família ICE-VERSION do prompt de origem não virou regra. A
#   pergunta seria: "esta tabela pede uma versão de spec que o Iceberg deste
#   runtime não suporta?" Ela precisa dos dois lados, e só um existe.
#
#   `iceberg.format_version` é extraído do `metadata.json` e diz de que versão a
#   tabela É — esse lado está medido. O outro lado não: **nenhum fact carrega a
#   versão da biblioteca Iceberg em uso**, e `RuntimeContext.iceberg` só é
#   preenchido derivando de `GLUE_MATRIX` (quando alguma fonte trouxe
#   `glue_version`) ou pela flag `--iceberg` da CLI — ver a seção ESCOPO logo
#   abaixo, que é a mesma medida que fez as cinco primeiras regras desta área
#   abandonarem `runtime_scope: {iceberg: ...}`.
#
#   Escrever a regra assim mesmo produziria um dos dois defeitos que este
#   repositório recusa: um guarda derivado de Glue apagando a área inteira num
#   runtime EMR, ou uma comparação de versão contra `""`.
#
#   Destravaria: um fact que publique a versão da biblioteca Iceberg do runtime
#   — de `spark.conf_effective`, se alguma propriedade a expuser, ou de um dump
#   de classpath do job.
#
#   O que NÃO destrava: `knowledge/storage/iceberg-v3.md` publica a matriz de
#   suporte do formato v3 por engine. Ela é conhecimento, não fact: dá o lado
#   direito da comparação e continua sem o esquerdo medido.
#
# V-ICE-3 — A CHAVE `glue.lakeformation-enabled` NUM CATÁLOGO NÃO RENDE REGRA
#   DESTA ÁREA, e a razão foi medida escrevendo a regra e a fixture antes de
#   retirar as duas.
#
#   A regra proposta (`SF-ICE-007`) julgava
#   `spark.sql.catalog.<nome>.glue.lakeformation-enabled = true` num job que
#   declara o argumento de FGAC. Ela carregava fonte, `runtime_scope` e o
#   conserto localizado no catálogo, e ainda assim **nunca disparava sozinha**:
#   essa chave é um dos DOIS marcadores de Full Table Access que
#   `sparkforge/facts/lakeformation.py::_marcadores_de_fta` procura, então com
#   FGAC ligado o `lakeformation.access_model` sai sempre com `model: "both"` e
#   `SF-LF-005` acusa a mesma entrada. Medido sobre a fixture
#   `fgac_com_lakeformation_enabled_no_catalogo`, depois removida:
#   `['SF-ICE-007', 'SF-LF-005']`, as duas, em toda execução.
#
#   O conjunto de disparo dela era subconjunto estrito do de `SF-LF-005` — que
#   dispara também quando o marcador é o resolver do filesystem sozinho. E a
#   localização que ela acrescentava, "a chave está NESTE catálogo", **já está
#   no achado da outra**: `SF-LF-005` nomeia `attrs.fta_markers` no
#   `explanation` e lista as duas chaves possíveis, e a evidência do achado
#   aponta o fact que carrega qual delas foi vista.
#
#   Duas regras para a mesma entrada, uma delas dizendo menos, é o defeito que
#   o cabeçalho de `rules/catalog/errors.yaml` recusa em quatro assinaturas por
#   "já coberta". Aqui ele apareceu ao contrário — a específica é a redundante —
#   e a recusa é a mesma.
#
#   `TestAdversarial::test_each_fixture_fires_exactly_one_rule` de
#   `tests/test_fixtures_golden_infra_code.py` foi o que cobrou: aquele corpus
#   trava um achado por fixture, e o invariante não foi afrouxado para acomodar
#   a regra. Foi a regra que saiu.
#
#   Destravaria: um fact que dissesse o que a combinação FAZ.
#
#   **A LACUNA FOI MEDIDA em 2026-09-10, e não estimada.** As duas páginas de
#   FGAC — `security-lf-enable.html` (10 307 chars) e
#   `security-lf-enable-considerations.html` (5 282 chars) — foram coletadas e
#   varridas por oito termos. Ocorrências de `lakeformation-enabled`: **zero** nas
#   duas. De `credentialsResolverClass`: **zero**. De `precedence`, `conflict`,
#   `ignored`, `overrid`, `both` e `simultaneous`: **zero** nas duas.
#
#   Ou seja: as páginas que descrevem FGAC **nunca mencionam** a chave de
#   credential vending, e nenhuma delas diz o que acontece quando as duas metades
#   estão declaradas — qual vence, qual é ignorada, se há erro. A afirmação
#   anterior deste veto ("não está documentado em nenhuma página que este
#   repositório vigie") era leitura de memória; agora ela é contagem.
#
#   O que a coleta ACHOU, e virou entrega em vez de veto: a página de FTA
#   enumera `MERGE INTO` e `UPDATE` entre o DML que ela habilita, e declara
#   suporte a biblioteca custom, UDF e RDD. Os dois viraram eixo em
#   `knowledge/glue/lakeformation-matrix.yaml` (`fta_ddl_dml` e
#   `fta_custom_libraries_udf`), e a assimetria contra a lista ilustrativa do
#   lado FGAC está na §0 de `knowledge/glue/lakeformation-fgac.md`.
#
#   A §4 de `knowledge/storage/iceberg-catalog.md` e a §7 de
#   `knowledge/glue/lakeformation-fgac.md` registram a lacuna que permanece.
# Depende do leitor de metadata tables da Fase 1. Regras inertes até ele existir.
# Atenção: procedimentos e propriedades variam muito entre Iceberg 1.0.0 (Glue 4.0),
# 1.7.1 (5.0) e 1.10.0 (5.1). Onde uma regra depender de comportamento introduzido
# numa versão, o `runtime_scope` dela tem que dizer qual — ver SF-ENV-002
# (`env.yaml`), que declara `{glue: ">=5.1", iceberg: ">=1.10.0"}` porque fala de
# deletion vectors, que não existem antes disso. Nenhuma das cinco regras DESTE
# arquivo é assim.
#
# ESCOPO (Fase 5a): as cinco declaravam `runtime_scope: {iceberg: ">=1.0.0"}`.
# Passaram para `{}`. Três razões, em ordem de gravidade:
#
#   1. FALSO NEGATIVO MEDIDO. `RuntimeContext.iceberg` não é observado por
#      extrator nenhum. `sparkforge/facts/runtime_detect.py` só o preenche por
#      dois caminhos: derivando de `GLUE_MATRIX` quando alguma fonte trouxe
#      `glue_version`, ou lendo `iceberg_version`/`iceberg` de uma fonte -- que
#      na prática é a flag `--iceberg` da CLI. `iceberg_metadata.py` extrai
#      metadados de tabela Iceberg e não emite versão de runtime.
#      Consequência: fora do Glue, e sem alguém digitar a versão à mão, o campo
#      é `""`. Depois que o curinga e as comparações passaram a exigir a chave
#      presente (`sparkforge/rules/version_scope.py`), um runtime EMR realista
#      -- `{'glue':'','spark':'3.5.1','python':'','iceberg':'','athena':''}`,
#      em que só o event log observou Spark -- apagava a ÁREA SF-ICE INTEIRA.
#      Tabelas Iceberg existem em EMR; a área sumia porque ninguém DETECTOU a
#      versão, não porque ela não se aplicava. Um guarda derivado de Glue
#      gateando regras que nada têm de Glue é o mesmo erro de camada que a
#      Fase 5a desfaz no resto do catálogo. (Contraste: SF-GLUE sumir nesse
#      runtime é o resultado CORRETO -- não há infraestrutura Glue para
#      revisar, e agora isso aparece como pulado, com motivo.)
#
#   2. O GATE REAL JÁ EXISTE E É ESTRITAMENTE MAIS PRECISO. Nenhuma destas
#      regras é sequer considerada sem facts de metadados Iceberg:
#      SF-ICE-001 exige `iceberg.files_summary`; SF-ICE-002,
#      `iceberg.delete_files_summary` + `iceberg.files_summary`; SF-ICE-003,
#      `iceberg.snapshots_summary`; SF-ICE-004, `iceberg.table_property` +
#      `iceberg.files_summary`; SF-ICE-005, `iceberg.table_property`. Esses
#      facts só existem se alguém apontou `analyze iceberg` para um dump de
#      metadata tables -- ou seja, se há tabela Iceberg. É a natureza do
#      artefato analisado, e quem gateia por isso é `requires_facts`.
#
#   3. O GUARDA ERA QUASE VAZIO. `>=1.0.0` antecede toda versão de Glue
#      suportada exceto a 3.0 (Iceberg 0.13.1). Seu único efeito real era
#      calar SF-ICE em Glue 3.0 -- e mesmo lá `requires_facts` faz o trabalho
#      melhor: um dump de 0.13.1 não tem a metadata table `delete_files`,
#      `extract_iceberg_metadata` não emite fact para seção ausente, e
#      SF-ICE-002 não é considerada. O guarda de versão respondia por
#      suposição o que o fact responde por medição.
#
# Se um dia um extrator observar a versão de Iceberg em uso, o lugar de usá-la
# é uma regra que dependa MESMO da versão, com o range de verdade -- não um
# piso genérico repetido na área inteira.

catalog_version: 1
schema_version: 1
area: SF-ICE
retrieved: 2026-07-29

rules:

  - id: SF-ICE-001
    category: iceberg
    title: Data files pequenos — tamanho médio muito abaixo do alvo
    requires_facts: [iceberg.files_summary]
    when:
      all:
        - fact: iceberg.files_summary
          expr: "measures.avg_file_bytes < threshold.min_avg_bytes"
    threshold: {min_avg_bytes: 33554432}
    status: confirmed
    severity_by:
      - {when: "measures.avg_file_bytes < 8388608", severity: P1}
      - {when: "measures.avg_file_bytes < 33554432", severity: P2}
    # Escopo vazio: gate por `iceberg.files_summary`, nao por versao. Tamanho
    # medio de data file e o mesmo problema em qualquer versao de Iceberg, e a
    # medida vem do fact. Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      Arquivos pequenos custam listing, abertura e overhead de task. Em Iceberg o custo
      adicional é de metadados: mais data files significam manifests maiores e
      planejamento mais lento, inclusive para consumidores como Athena. O limiar de 32MB
      é conservador contra um alvo usual de 128 a 512MB. Ver
      knowledge/storage/iceberg-performance.md secao 1 e knowledge/storage/parquet-layout.md secao 3.
    proposed_change:
      - Corrigir na origem primeiro, com write.distribution-mode hash ou range, que reduz o número de arquivos por partição na própria escrita.
      - Ajustar write.target-file-size-bytes ao alvo desejado.
      - Compactar o passivo com rewrite_data_files, estratégia binpack se o problema é contagem.
      - Se o pruning também é ruim, usar estratégia sort com a coluna de filtro dominante em vez de binpack.
    action:
      kind: maintenance.rewrite_data_files
      target: iceberg.table.data_files
      direction: replace
      requires_absent: []
      moves:
        - storage.file_layout
      depends_on:
        - SF-ICE-005
    risks:
      - Compactação reescreve dados e cria um novo snapshot, consumindo computação (DPU no Glue; tempo de cluster no Databricks ou em qualquer Spark) e armazenamento temporário.
      - Alterar write.distribution-mode adiciona shuffle na escrita, aumentando o custo de cada run.
    tradeoffs:
      - Corrigir na origem encarece cada escrita e evita compactação recorrente. Compactar depois mantém a escrita barata e adiciona um job de manutenção.
    validation:
      - Tamanho médio, p50 e p95 de arquivo antes e depois, via metadata table files.
      - Contagem total de linhas idêntica antes e depois da compactação.
      - Tempo de planejamento de uma query de referência antes e depois.
    rollback: [Time travel para o snapshot anterior à compactação, se ainda não expirado.]
    sources:
      - {url: "https://iceberg.apache.org/docs/latest/spark-procedures/", retrieved: 2026-07-29, note: "doc latest; confirmar parâmetros contra a versão embarcada"}
      - {url: "https://aws.amazon.com/blogs/aws/new-improve-apache-iceberg-query-performance-in-amazon-s3-with-sort-and-z-order-compaction", retrieved: 2026-07-29}

  - id: SF-ICE-002
    category: iceberg
    title: Dívida de delete files em tabela merge-on-read
    requires_facts: [iceberg.delete_files_summary, iceberg.files_summary]
    when:
      all:
        - fact: iceberg.delete_files_summary
          expr: "measures.delete_file_count / measures.data_file_count >= threshold.ratio"
    threshold: {ratio: 0.1}
    status: confirmed
    severity_default: P1
    # Escopo vazio: gate por `iceberg.delete_files_summary` +
    # `iceberg.files_summary`, nao por versao. A explicacao cita Iceberg 1.10
    # (deletion vectors), mas como MUDANCA DE TRADE-OFF na correcao, nao como
    # condicao de disparo: divida de delete files continua sendo divida em
    # 1.10, e o `expr` compara contagens medidas, nao versao. Quem tem regra de
    # verdade sobre deletion vectors e SF-ENV-002, com `{glue: ">=5.1",
    # iceberg: ">=1.10.0"}`. Se a metadata table `delete_files` nao existe na
    # versao em uso, nao ha fact e a regra nem e considerada.
    # Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      Em merge-on-read, cada leitura reconcilia os delete files com os data files. Sem
      compactação regular, a degradação é lenta e silenciosa: a query fica mais lenta a
      cada semana sem que nada tenha mudado nela. É a armadilha de MoR. Iceberg 1.10
      introduz deletion vectors, que mudam esse trade-off; confirmar disponibilidade na
      versão em uso antes de assumir o comportamento antigo.
    proposed_change:
      - Compactar delete files com rewrite_position_delete_files, ou rewrite_data_files com reconciliação.
      - Estabelecer manutenção periódica, não pontual.
      - Reavaliar a escolha MoR versus copy-on-write com base na razão real entre leitura e escrita da tabela.
      - Em Iceberg 1.10, avaliar deletion vectors.
    action:
      kind: maintenance.compact_delete_files
      target: iceberg.table.delete_files
      direction: replace
      requires_absent: []
      moves:
        - storage.delete_file_count
      depends_on: []
    risks: ["Compactação de delete files é reescrita e consome computação (DPU no Glue; tempo de cluster no Databricks ou em qualquer Spark); agendar fora do horário crítico."]
    tradeoffs:
      - Copy-on-write encarece a escrita e mantém a leitura rápida sem manutenção recorrente.
    validation:
      - Contagem de delete files antes e depois, via metadata table delete_files.
      - Duração de uma query de referência antes e depois.
      - Contagem de linhas visíveis na tabela idêntica antes e depois.
    rollback: [Time travel para o snapshot anterior.]
    sources:
      - {url: "https://iceberg.apache.org/docs/latest/spark-procedures/", retrieved: 2026-07-29}
      - {url: "https://aws.amazon.com/blogs/big-data/introducing-aws-glue-5-1-for-apache-spark", retrieved: 2026-07-29, note: "deletion vectors em Iceberg 1.10.0"}

  - id: SF-ICE-003
    category: iceberg
    title: Snapshots acumulados por commits frequentes
    requires_facts: [iceberg.snapshots_summary]
    when:
      all:
        - fact: iceberg.snapshots_summary
          expr: "measures.snapshot_count >= threshold.count"
    threshold: {count: 500}
    status: confirmed
    severity_default: P2
    # Escopo vazio: gate por `iceberg.snapshots_summary`, nao por versao. Um
    # snapshot por commit e a semantica do formato desde a v1; nada aqui depende
    # da versao do engine. Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      Cada commit cria um snapshot. Um loop de append por lote cria um snapshot por
      lote, com manifests correspondentes. O efeito é metadata.json crescendo,
      planejamento de leitura mais lento, e heap do driver subindo ao longo de runs
      longos. Correlaciona com SF-PY-004 quando a causa é loop de escrita. Ver
      knowledge/storage/iceberg-performance.md secao 7.
    proposed_change:
      - Reduzir o número de commits, agrupando lotes ou escrevendo numa única action.
      - Habilitar write.metadata.delete-after-commit.enabled e definir write.metadata.previous-versions-max.
      - Estabelecer expire_snapshots periódico com retenção acordada.
    action:
      kind: maintenance.expire_snapshots
      target: iceberg.table.snapshots
      direction: remove
      requires_absent: []
      moves:
        - storage.snapshot_count
      depends_on: []
    risks:
      - expire_snapshots é destrutivo e remove capacidade de time travel para os snapshots expirados.
      - Reduzir commits diminui a granularidade de recuperação parcial após falha.
    tradeoffs: [Time travel longo custa metadados e armazenamento; retenção é decisão de negócio, não técnica.]
    validation:
      - Contagem de snapshots antes e depois.
      - Tamanho de metadata.json antes e depois.
      - Tempo de planejamento de uma query de referência antes e depois.
    rollback:
      - >
        Não há rollback para expire_snapshots. A mitigação é escolher a retenção com
        confirmação explícita antes de executar.
    sources:
      - {url: "https://iceberg.apache.org/docs/latest/spark-procedures/", retrieved: 2026-07-29}

  # DESBLOQUEADA EM 2026-07-30, mas leia o parágrafo 3 antes de confiar num
  # silêncio desta regra. Ela ficou inerte sob a premissa de que
  # `attrs.written_before_sort_order` exigiria histórico entre duas coletas.
  # Não exige, e o caminho "óbvio" para o histórico também não funciona:
  #   1. Datar a mudança de sort order pelo `metadata-log` NÃO funciona. A spec
  #      define cada entrada com exatamente `metadata-file` e `timestamp-ms`,
  #      sem sort order. E o snapshot registra `schema-id` mas NÃO registra
  #      `sort-order-id` -- assimetria real da spec. Responder por aí exigiria
  #      baixar e parsear cada metadata.json histórico, vários já apagados por
  #      `write.metadata.previous-versions-max`.
  #   2. O que responde é o campo 140 do struct `data_file`, `sort_order_id`
  #      (int, opcional), presente desde o formato v1 -- logo em Iceberg 1.0.0
  #      (Glue 4.0), 1.7.1 (5.0) e 1.10.0 (5.1). Um id NÃO-ZERO só é gravado
  #      quando um writer chamou `withSortOrder` com uma ordem registrada em
  #      `sort-orders`, então "id != 0 e != default-sort-order-id" prova
  #      escrita sob outra ordem, e "id == default" prova o contrário.
  #   3. ARMADILHA: `sort_order_id == 0` NÃO prova arquivo não ordenado.
  #      `DataFiles.Builder` inicializa `sortOrderId =
  #      SortOrder.unsorted().orderId()` (0), e `SparkWrite` só passou a
  #      sobrescrever isso no Iceberg 1.11.0 -- depois de TODO runtime Glue
  #      existente. Na prática todo data file escrito por Glue sai com 0,
  #      inclusive os recém-produzidos por `rewrite_data_files` com estratégia
  #      sort. Tratar 0 como "não ordenado" faria esta regra disparar em toda
  #      tabela Iceberg de Glue, mandando compactar tabelas recém-compactadas.
  #      Por isso 0 conta como DESCONHECIDO, junto com a coluna ausente.
  # Consequência operacional: numa tabela escrita só por Glue esta regra fica
  # calada por falta de evidência, não por ausência de passivo. O silêncio vem
  # acompanhado de `iceberg.unresolved` com reason `sort_order_id_missing` e
  # da contagem em `iceberg.table_analyzed.unresolved_count`. Ela dispara de
  # verdade em tabela com passivo escrito por writer que registra sort order
  # (outro engine, ou Iceberg >= 1.11).
  # `sparkforge/facts/iceberg_metadata.py::_written_before_sort_order` só
  # afirma `true` com arquivo comprovadamente sob outra ordem registrada, só
  # `false` com TODOS comprovadamente sob a vigente, e deixa o atributo ausente
  # no resto. O `where` abaixo exige `true` explícito, então ambiguidade não
  # casa.
  - id: SF-ICE-004
    category: iceberg
    title: Sort order definido sem rewrite dos dados existentes
    requires_facts: [iceberg.table_property, iceberg.files_summary]
    # `iceberg.files_summary` vem PRIMEIRO de proposito: `engine._build_finding`
    # usa `evidence[0]` como fact primario, e e dele que sai `measured`. Com
    # `iceberg.table_property` na frente o finding saia com `measured: {}` --
    # a regra acusaria passivo de sort order sem mostrar quantos arquivos,
    # contra AGENT_PROTOCOL regra 3.
    when:
      all:
        - fact: iceberg.files_summary
          where: {attrs.written_before_sort_order: true}
        - fact: iceberg.table_property
          where: {attrs.key: sort-order, attrs.present: true}
    status: confirmed
    severity_default: P2
    # Escopo vazio: gate por `iceberg.files_summary` + `iceberg.table_property`,
    # nao por versao. Esta e a regra da area com mais raciocinio de versao no
    # comentario acima, e por isso o caso foi examinado antes de esvaziar o
    # escopo: NADA nesse raciocinio e satisfeito por `{iceberg: ">=1.0.0"}`.
    #   - O campo 140 `sort_order_id` existe desde o formato v1, ou seja em
    #     TODA versao do range -- inclusive 0.13.1 (Glue 3.0), que `>=1.0.0`
    #     excluia sem motivo.
    #   - A versao que importa e a do WRITER que gravou os data files da tabela
    #     analisada (so Iceberg >= 1.11 grava sort order no `SparkWrite`), nao a
    #     do runtime que roda a analise. Sao coisas diferentes, e `runtime_scope`
    #     so sabe falar da segunda. `>=1.0.0` nem sequer aproxima a primeira.
    #   - Quem responde por essa distincao e a evidencia:
    #     `iceberg_metadata.py::_written_before_sort_order` so afirma `true` com
    #     arquivo comprovadamente sob outra ordem registrada, e o `where` abaixo
    #     exige `true` explicito. Ambiguidade nao casa, e o ponto cego sai como
    #     `iceberg.unresolved` com reason `sort_order_id_missing`.
    # Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      Sort order afeta apenas escritas futuras e o rewrite_data_files com estratégia
      sort. Definir sort order numa tabela existente e esperar melhoria de pruning nos
      dados já gravados é um erro de expectativa comum: nada muda nos arquivos antigos.
      Estatística min/max só ajuda se os valores estiverem agrupados. A evidência aqui
      é por arquivo, não temporal: measures.files_written_before_sort_order conta os
      data files cujo sort_order_id é um id de sort order registrado diferente do
      default-sort-order-id da tabela. É um PISO confirmado, não um total: arquivos com
      sort_order_id 0 ou sem a coluna ficam de fora, porque até Iceberg 1.10.0 o writer
      do Spark não grava esse campo e 0 não distingue "não ordenado" de "não
      registrado". Ver knowledge/storage/parquet-layout.md secao 2 e
      knowledge/storage/iceberg-performance.md secao 3.
    proposed_change:
      - Executar rewrite_data_files com estratégia sort e o sort_order desejado sobre o passivo.
      - Se os filtros variam entre duas ou três colunas, avaliar zorder em vez de sort.
      - Confirmar o ganho medindo bytes lidos por uma query de referência, não pela duração.
    action:
      kind: maintenance.rewrite_data_files
      target: iceberg.table.data_files
      direction: replace
      requires_absent: []
      moves:
        - scan.bytes_read
      depends_on: []
    risks: ["Rewrite de tabela grande é caro em computação (DPU no Glue; tempo de cluster no Databricks ou em qualquer Spark) e cria um snapshot volumoso."]
    tradeoffs: [Zorder custa mais que sort e só se justifica com evidência de filtros multi-coluna.]
    validation:
      - Bytes lidos por uma query de referência antes e depois.
      - Contagem total de linhas idêntica.
      - Razão entre bytes lidos e tamanho da tabela, que é a medida direta de pruning.
      - SELECT sort_order_id, count(*) FROM db.tbl.files GROUP BY 1 antes e depois; depois do rewrite todo arquivo deve carregar o default-sort-order-id.
    rollback: [Time travel para o snapshot anterior ao rewrite.]
    sources:
      - {url: "https://aws.amazon.com/blogs/aws/new-improve-apache-iceberg-query-performance-in-amazon-s3-with-sort-and-z-order-compaction", retrieved: 2026-07-29}
      - {url: "https://github.com/apache/iceberg/blob/apache-iceberg-1.0.0/format/spec.md", retrieved: 2026-07-30, note: "data_file campo 140 sort_order_id e a sentinela order id 0; metadata-log so tem metadata-file e timestamp-ms; snapshot nao tem sort-order-id. Tag 1.0.0, a versao mais antiga do range Glue suportado"}
      - {url: "https://github.com/apache/iceberg/blob/apache-iceberg-1.10.0/core/src/main/java/org/apache/iceberg/DataFiles.java", retrieved: 2026-07-30, note: "private Integer sortOrderId = SortOrder.unsorted().orderId() -- o default 0 que Glue nunca sobrescreve"}
      - {url: "https://github.com/apache/iceberg/blob/apache-iceberg-1.11.0/spark/v3.5/spark/src/main/java/org/apache/iceberg/spark/source/SparkWrite.java", retrieved: 2026-07-30, note: "dataSortOrder(...) so aparece aqui; ausente nas tags 1.7.1 e 1.10.0, que sao Glue 5.0 e 5.1"}

  - id: SF-ICE-005
    category: iceberg
    title: write.distribution-mode none com particionamento
    requires_facts: [iceberg.table_property]
    when:
      all:
        - fact: iceberg.table_property
          where: {attrs.key: write.distribution-mode, attrs.value: none}
        - fact: iceberg.table_property
          where: {attrs.key: partition-spec, attrs.non_empty: true}
    status: confirmed
    severity_default: P2
    # Escopo vazio: gate por `iceberg.table_property`, nao por versao. A regra
    # dispara sobre o valor OBSERVADO de `write.distribution-mode` no dump; se a
    # propriedade nao existir na versao em uso, nao ha fact e a regra nem e
    # considerada. Ver ESCOPO (Fase 5a) no cabecalho.
    runtime_scope: {}
    explanation: >
      Com distribution-mode none não há shuffle antes da escrita, então cada task grava
      em cada partição que ela contém. O resultado é da ordem de N tasks vezes M
      partições arquivos. É a causa estrutural de small files em Iceberg, e corrigi-la
      na escrita é preferível a compactar indefinidamente.
    proposed_change:
      - Definir write.distribution-mode como hash, ou range quando há sort order.
      - Confirmar o comportamento exato do modo escolhido na documentação da versão embarcada.
      - Medir o número de arquivos por partição antes e depois.
    action:
      kind: storage.set_write_layout_property
      target: iceberg.table_property.write.distribution-mode
      direction: replace
      requires_absent: []
      moves:
        - storage.file_layout
      depends_on: []
    risks: [Adicionar shuffle na escrita aumenta o custo de cada run; o ganho está no consumo, não na escrita.]
    tradeoffs: [Escrita mais cara contra leitura mais barata e menos manutenção.]
    validation:
      - Contagem de arquivos por partição antes e depois, via metadata table files.
      - Runtime e DPU-hours da escrita antes e depois; no Databricks ou em qualquer Spark, a duração da escrita no event log.
      - Contagem total de linhas idêntica.
    rollback: [Restaurar write.distribution-mode anterior; afeta apenas escritas futuras.]
    sources:
      - {url: "https://iceberg.apache.org/docs/latest/spark-procedures/", retrieved: 2026-07-29, note: "comportamento exato por versão não reconfirmado nesta coleta"}

  # ---------------------------------------------------------------------------
  # SF-ICE-006 -- a CONFIGURACAO do catalogo, e nao a saude da tabela. As cinco
  # primeiras regras desta area leem dump de metadata table; esta le
  # `lakeformation.iceberg_catalog`, que e derivado das tres superficies de conf
  # por `sparkforge/facts/lakeformation.py`.
  #
  # O kind mora no namespace `lakeformation.*` e a regra mora na area SF-ICE, e
  # isso NAO e inconsistencia: namespace de kind diz quem PRODUZIU o fact, area
  # de regra diz quem DECIDE o conserto. Quem decide a classe de implementacao
  # do catalogo Iceberg e quem responde pelo formato de tabela, nao quem
  # responde pela governanca de acesso -- e e por isso que SF-ICE-006 nao exige
  # FGAC nenhum para disparar.
  #
  # A SEGUNDA regra desta familia foi ESCRITA E RETIRADA. Ver V-ICE-3 no
  # cabecalho: ela nunca disparava sozinha.
  #
  # Documento de conhecimento: `knowledge/storage/iceberg-catalog.md`.
  # ---------------------------------------------------------------------------

  - id: SF-ICE-006
    category: iceberg-catalog
    title: >-
      Catálogo de sessão configurado com SparkCatalog, que não carrega tabela
      não-Iceberg
    requires_facts: [lakeformation.iceberg_catalog]
    when:
      all:
        - fact: lakeformation.iceberg_catalog
          where:
            attrs.is_session_catalog: true
            attrs.catalog_impl: "org.apache.iceberg.spark.SparkCatalog"
    status: structural
    severity_default: P1
    runtime_scope: {}
    explanation: >
      A documentação do Apache Iceberg declara as duas implementações lado a
      lado: `org.apache.iceberg.spark.SparkCatalog` *"supports a Hive Metastore
      or a Hadoop warehouse as a catalog"*, e
      `org.apache.iceberg.spark.SparkSessionCatalog` *"adds support for Iceberg
      tables to Spark's built-in catalog, and delegates to the built-in catalog
      for non-Iceberg tables"*. Sobre a primeira, com backend Hive, a mesma
      página é explícita: *"The Hive-based catalog only loads Iceberg tables. To
      load non-Iceberg tables in the same Hive metastore, use a session
      catalog."*


      Este job aponta o **catálogo de sessão** -- `spark_catalog`, o que resolve
      todo nome de tabela não qualificado -- para a implementação que não
      delega. Pela própria fonte, tabela que não é Iceberg deixa de carregar por
      esse caminho.


      **O sintoma aparece na tabela ERRADA.** A tabela Iceberg continua
      resolvendo, e é a tabela Parquet que para -- com erro de tabela não
      encontrada, que não se parece com problema de configuração de Iceberg.
      Job que lê Parquet e Iceberg na mesma sessão é onde isso morde, e é o
      arranjo em que a troca é mais fácil de fazer sem perceber.


      **Isto é independente de Lake Formation.** `SF-LF-003` restringe o NOME do
      catálogo sob FGAC; esta regra restringe a CLASSE no catálogo de sessão, e
      quem a declara é o Apache Iceberg. Um job pode violar uma sem violar a
      outra -- ver o quadro da §3 de `knowledge/storage/iceberg-catalog.md`.
    proposed_change:
      - >-
        Trocar a classe do catálogo de sessão para a que delega:
        `spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkSessionCatalog`,
        que é a forma que a documentação publica para adicionar suporte a
        Iceberg ao catálogo embutido.
      - >-
        Se o job precisa de `SparkCatalog` por outra razão -- funções SQL com
        escopo de catálogo, que a página declara indisponíveis via
        `spark_catalog` antes do Spark 4.2.0 --, declará-lo num catálogo de nome
        próprio ao lado, e deixar `spark_catalog` com `SparkSessionCatalog`.
      - >-
        Conferir se alguma tabela não-Iceberg é lida por nome não qualificado.
        É esse conjunto que a configuração atual deixa de alcançar, e ele é o
        que mede o tamanho do problema.
    action:
      kind: config.replace_property_value
      target: spark.sql.catalog.spark_catalog
      direction: replace
      requires_absent: []
      moves:
        - correctness.read_result
      depends_on: []
    risks:
      - >-
        A regra afirma que a configuração está fora do recorte que a
        documentação sustenta, e **não** que uma falha observada veio dela. A
        conclusão vem de DUAS frases da mesma página somadas, não de uma frase
        única -- a derivação está escrita na §2 do documento de conhecimento, e
        o achado é `structural` por isso.
      - >-
        Um job que lê SOMENTE tabela Iceberg funciona com esta configuração, e
        para ele o achado não descreve defeito nenhum. O que separa os dois casos
        é o conjunto de tabelas lidas, e nada neste motor o mede.
      - >-
        `SparkCatalog` em catálogo de nome próprio é a configuração que a própria
        fonte exemplifica três vezes, e correta. A regra só dispara quando o nome
        é `spark_catalog`.
    tradeoffs:
      - >-
        `SparkSessionCatalog` envolve o catálogo embutido, e a página registra
        uma limitação em troca: antes do Spark 4.2.0, funções com escopo de
        catálogo (`system.bucket`, `system.days`, `system.iceberg_version`) não
        estão disponíveis por `spark_catalog`. Job que dependa delas precisa de
        um catálogo nomeado ao lado.
    validation:
      - >-
        Resolver, no run seguinte, cada tabela não-Iceberg que o job lê por nome
        não qualificado -- é esse conjunto que a mudança destrava, e contá-lo
        antes e depois é o que prova.
      - >-
        Contagem de linhas e schema da tabela Iceberg alvo antes e depois: trocar
        a classe do catálogo troca o caminho de resolução dela também, e o
        resultado é que prova que resolveu para o mesmo lugar.
      - >-
        A configuração efetiva do run seguinte, lida do event log
        (`spark.conf_effective`), e não a declarada no Terraform.
    rollback:
      - >-
        Restaurar a classe anterior em `spark.sql.catalog.spark_catalog`. Se um
        catálogo nomeado foi acrescentado junto, remover os dois na mesma
        mudança -- deixar o catálogo nomeado sozinho muda como as referências
        qualificadas resolvem.
    sources:
      - {url: "https://iceberg.apache.org/docs/latest/spark-configuration/", retrieved: 2026-09-09}

  # ---------------------------------------------------------------------------
  # SF-ICE-008 -- a OPERACAO, e nao a tabela. Primeira regra desta area que le
  # texto SQL, e ela existe porque `MERGE INTO` que falha nao e "Iceberg nao faz
  # MERGE": a documentacao marca tres operacoes com "Requires Iceberg Spark
  # extensions" e as outras nao, e ate aqui o motor nao distinguia uma da outra.
  #
  # O fact que ela consome e `sql.write_statement.enriched`, derivado por
  # `fusion.py`: a OPERACAO vem do texto (`sql_literal.py`) e a EXTENSAO vem da
  # configuracao. Nenhum dos dois lados a conhece sozinho, e e por isso que o
  # enriquecimento existe -- mesmo molde de `table_format_columnar`.
  #
  # `iceberg_extensions_declared` e TERNARIO, e a regra usa so o `false`:
  #   true   -- a chave foi lida numa das tres superficies, com a classe do Iceberg
  #   false  -- alguma superficie de conf foi lida, e a chave nao estava nela
  #   null   -- superficie de conf NENHUMA apareceu no case; ninguem mediu
  # Disparar no `null` seria inventar ausencia a partir de ausencia de artefato.
  # ---------------------------------------------------------------------------

  - id: SF-ICE-008
    category: iceberg-catalog
    title: >-
      Operação SQL que exige as extensões do Iceberg, e a sessão não as declara
    requires_facts: [sql.write_statement.enriched]
    when:
      all:
        - fact: sql.write_statement.enriched
          where:
            attrs.requires_iceberg_extensions: true
            attrs.iceberg_extensions_declared: false
    status: structural
    severity_default: P1
    runtime_scope: {}
    explanation: >
      A tabela de suporte de escrita do Apache Iceberg marca três operações com a
      mesma ressalva, e apenas essas três: *"SQL merge into ✔️ ⚠ Requires Iceberg
      Spark extensions"*, *"SQL update ✔️ ⚠ Requires Iceberg Spark extensions"* e
      *"SQL delete from ✔️ ⚠ Row-level delete requires Iceberg Spark
      extensions"*. `INSERT INTO` e `INSERT OVERWRITE` **não** estão entre elas
      -- a mesma tabela as marca só com `spark.sql.storeAssignmentPolicy=ANSI`,
      que é default desde o Spark 3.0.


      Este job pede uma das três, e a configuração lida não declara
      `spark.sql.extensions` com `IcebergSparkSessionExtensions`.


      **É a razão pela qual "MERGE falhou" não é "Iceberg não faz MERGE".** As
      duas frases descrevem o mesmo sintoma e consertos opostos: a primeira é uma
      linha de configuração ausente, a segunda seria uma limitação de formato que
      não existe. `attrs.operation` no fact diz qual das operações foi pedida, e
      `attrs.iceberg_extensions_source` diz em qual superfície a configuração foi
      lida -- event log, Terraform ou código.


      **O achado não afirma que a falha observada veio daqui.** Ele afirma que a
      pré-condição que a documentação nomeia não está satisfeita na configuração
      que este motor leu. `status: structural` por isso.
    proposed_change:
      - >-
        Declarar as extensões na sessão:
        `spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions`.
        É uma linha de configuração, e ela precisa estar aplicada ANTES de a
        sessão existir -- extensão de SQL é resolvida na construção da sessão, e
        `spark.conf.set(...)` no meio do script não a instala.
      - >-
        Se a configuração JÁ está declarada em outra superfície que este motor não
        leu, coletar o event log do run e reavaliar: `attrs.iceberg_extensions_source`
        diz de onde a leitura veio, e `spark.conf_effective` é a única que
        responde pela sessão que realmente existiu.
      - >-
        Se a intenção era não depender das extensões, reescrever a operação: um
        `MERGE INTO` cuja lógica é só inserir vira `INSERT INTO`, que a mesma
        tabela de suporte não marca com essa ressalva. Isto é mudança de
        semântica de escrita, e não de configuração -- ver `validation`.
    action:
      kind: config.satisfy_property_precondition
      target: spark.sql.extensions
      direction: add
      requires_absent: []
      moves:
        - correctness.write_result
      depends_on: []
    risks:
      - >-
        A regra correlaciona o texto SQL com a configuração da SESSÃO sem
        `same_subject`, e não poderia ser de outro jeito: o statement tem subject
        de localização de fonte e a conf tem subject de recurso ou de chave. Num
        case com dois jobs -- um que declara as extensões e outro que não --, a
        configuração lida é a união das superfícies, e o achado pode apontar o
        job errado. Conferir `attrs.iceberg_extensions_source` no achado.
      - >-
        `iceberg_extensions_declared: false` significa "alguma superfície de conf
        foi lida e a chave não estava nela", nunca "a sessão não a tem". Um job
        que instala a extensão por `--conf` em `non_overridable_arguments`, por
        propriedade de conexão, ou por qualquer caminho que este motor não leia, é
        acusado sem estar errado.
      - >-
        O parse de statement é ancorado no INÍCIO do texto e é regex, não
        gramática. `MERGE` construído por concatenação de string, ou statement
        precedido por algo que o `_strip_comments` não remove, não é reconhecido
        -- e ali não há achado nenhum, o que é falso negativo e não falso
        positivo.
      - >-
        A tabela da fonte diz que a operação **exige** a extensão, e não o que
        acontece sem ela. O erro concreto que o Spark levanta nesse caso não está
        nesta regra, e nenhuma assinatura de
        `knowledge/errors/` o cobre hoje.
    tradeoffs:
      - >-
        As extensões do Iceberg acrescentam regras de análise e procedimentos à
        sessão INTEIRA, não só à operação que as pediu. Num job que também toca
        tabela não-Iceberg, isso é superfície nova para todo o job -- e é a mesma
        classe de decisão que `SF-ICE-006` levanta sobre o catálogo de sessão.
    validation:
      - >-
        Se o conserto foi a configuração: a operação passa a executar, e o
        resultado se compara por contagem de linhas e agregado por chave de
        negócio no destino, antes e depois -- `MERGE` que executa não é `MERGE`
        que casou as linhas certas.
      - >-
        Se o conserto foi reescrever a operação -- `MERGE` virando `INSERT` --, a
        validação é de SEMÂNTICA e não de execução: as duas não fazem a mesma
        coisa com linha que já existe, e a comparação tem de ser linha a linha
        sobre a chave declarada.
      - >-
        `spark.sql.extensions` na configuração efetiva do run seguinte, lida do
        event log. É a única superfície que responde pela sessão que existiu.
    rollback:
      - >-
        Remover a chave restaura a configuração anterior, e nenhum dado muda por
        causa disso -- desde que nenhuma escrita tenha acontecido no meio. Se
        alguma aconteceu, o rollback é de dado, e o destino precisa ser comparado
        antes de a versão anterior ser descartada.
    sources:
      - {url: "https://iceberg.apache.org/docs/latest/spark-writes/", retrieved: 2026-09-09}
      - {url: "https://iceberg.apache.org/docs/latest/spark-configuration/", retrieved: 2026-09-09}

  # ---------------------------------------------------------------------------
  # SF-ICE-009 -- DUAS versoes de Iceberg no mesmo job, e qual vence nao esta
  # declarado. Ela fecha metade do `V-ICE-2`, e a outra metade continua aberta:
  # o veto pedia a versao da biblioteca EM EXECUCAO, e `spark.jars.packages` e
  # DECLARACAO. O que esta regra julga e a pergunta vizinha, e mais acionavel.
  #
  # ELA NAO TEM FIXTURE GOLDEN, e a razao e medida. `iceberg.library_conflict`
  # exige DOIS facts no mesmo pool: `tf.spark_conf` (a coordenada Maven) e
  # `env.runtime_signal` com `component: iceberg` (a versao embarcada, que
  # `runtime_detect` deriva de `glue_version`). NENHUM runner de fixture coloca
  # os dois juntos -- `regen_fusion` extrai SQL, catalogo e Terraform, e nao
  # chama `detect_runtime`; `regen_terraform` nao passa por `fuse`.
  #
  # Uma fixture foi escrita e REMOVIDA por isso: ela nao emitia o kind, e o
  # `proves` dela falava de um par que o golden nao continha. Fixture que nao
  # produz o que descreve e pior que nenhuma.
  #
  # A cobertura mora em `tests/test_facts_fusion.py`, nos quatro cenarios
  # unitarios -- conflito, versoes iguais, sem declaracao, e runtime
  # desconhecido. Destravaria a fixture: `regen_fusion` e o `_extract` do teste
  # de golden chamando `detect_runtime` sob guarda, no mesmo molde da guarda de
  # `*.tf` que a entrega de `SF-ICE-008` acrescentou.
  # ---------------------------------------------------------------------------

  - id: SF-ICE-009
    category: iceberg-catalog
    title: >-
      Job declara versao de Iceberg diferente da que o runtime embarca
    requires_facts: [iceberg.library_conflict]
    when:
      all:
        - fact: iceberg.library_conflict
          where:
            attrs.order_declared: false
    status: structural
    severity_default: P1
    runtime_scope: {}
    explanation: >
      Este job declara uma versao de Iceberg em `spark.jars.packages` e o runtime
      embarca outra. `attrs.declared_version` e `attrs.runtime_version` trazem as
      duas, e `attrs.declared_in` diz em qual superficie a declaracao foi lida --
      event log, Terraform ou codigo.


      **O que decide qual vence e a ORDEM DO CLASSPATH, e ela nao esta
      declarada.** `--user-jars-first` e o argumento de job que a inverte, e o
      fact carrega a leitura dele como TERNARIO em `attrs.user_jars_first`:
      `true`, `false` (lido e a chave ausente) ou `null` (nao lido).


      A regra compara `attrs.order_declared`, que e o predicado DERIVADO -- ele e
      `true` so quando a chave existe. Os dois outros estados dizem a mesma coisa
      para quem vai agir: **o job nao declara qual jar vence**. Juntar os dois num
      campo e o que a regra 33 do `CLAUDE.md` manda fazer, porque `where` compara
      igualdade e nada mais.


      **Duas versoes de Iceberg no classpath nao falham no import.** Elas falham
      mais tarde e de forma que nao se parece com versao: metodo que nao existe
      na outra versao (`NoSuchMethodError`), comportamento de escrita diferente
      do documentado, ou propriedade de tabela que uma versao le e a outra
      ignora. E a razao de o achado ser `structural` -- ele afirma a combinacao,
      nao a falha.
    proposed_change:
      - >-
        Remover a declaracao e usar a versao embarcada, quando ela atende. E a
        saida mais barata: uma versao no classpath, e a que o runtime testou.
      - >-
        Se a versao declarada e necessaria, declarar `--user-jars-first = "true"`
        junto, para que a ordem deixe de ser adivinhavel -- e registrar POR QUE a
        versao embarcada nao serve.
      - >-
        Conferir a compatibilidade da versao declarada com o Spark do runtime. A
        coordenada Maven do Iceberg nomeia o minor do Spark
        (`iceberg-spark-runtime-3.5_2.12`), e uma coordenada de outro minor e
        defeito diferente e mais grave que o desta regra.
    action:
      kind: dependency.align_version_with_runtime
      target: spark.jars.packages
      direction: replace
      requires_absent: []
      moves:
        - runtime.engine_version
      depends_on: []
    risks:
      - >-
        A regra afirma que DUAS versoes foram declaradas e que a ordem nao esta
        declarada. Ela **nao** afirma que a versao embarcada vence, nem que a
        declarada vence -- e afirmar qualquer um dos dois exigiria ler o
        classpath em execucao, que nenhum artefato deste motor carrega.
      - >-
        `spark.jars.packages` e DECLARACAO. Um job que receba o jar por outro
        caminho -- `--extra-jars`, fat jar corporativo, ou pacote instalado na
        imagem -- nao e visto por esta regra, e ali o conflito existe sem
        achado. Falso negativo, nao falso positivo.
      - >-
        Com `--user-jars-first` declarado (`true` ou `false`), a regra fica MUDA
        de proposito: ali a ordem esta escrita, e o operador decidiu. O achado e
        sobre a ausencia da decisao.
    tradeoffs:
      - >-
        Usar a versao embarcada custa as features que a declarada trazia; usar a
        declarada custa sair da combinacao que a AWS testou. A matriz de versao
        por runtime esta em `knowledge/glue/runtime-matrix.yaml`.
    validation:
      - >-
        A configuracao efetiva do run seguinte, lida do event log, mostrando uma
        versao so -- ou as duas com a ordem declarada.
      - >-
        Contagem de linhas e agregado por chave sobre a tabela alvo, antes e
        depois: trocar a biblioteca de Iceberg troca o escritor, e propriedade de
        tabela que uma versao le e a outra ignora muda o layout do que foi
        escrito.
    rollback:
      - >-
        Restaurar a declaracao anterior. Se alguma escrita aconteceu sob a versao
        nova, o rollback e de dado -- metadata de Iceberg escrita por uma versao
        pode carregar campo que a anterior nao le.
