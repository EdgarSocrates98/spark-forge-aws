name: glue_51_runtime
proves: >
  Glue 5.1 -> Spark 3.5.6, Python 3.11, Iceberg 1.10.0. E a linha da matriz que
  carrega a armadilha mais cara documentada em
  `knowledge/glue/runtime-matrix.md` secao 3: Glue 5.1 pode escrever Iceberg
  format V3, que o Athena nao le, e o modo de falha aparece no consumidor, nao
  no job que mudou. E tambem o unico runtime em que SF-ENV-002
  (`glue: ">=5.1"`, `iceberg: ">=1.10.0"`) entra em escopo -- ela continua
  inerte por `blocked_on: inventario-de-consumidores-de-tabela`, e esta
  fixture existe para que o dia em que esse extrator nascer, a regra passe a
  ser exercitada por um corpus que ja esta no lugar.
runtime:
  glue: "5.1"
  spark: "3.5.6"
  python: "3.11"
  iceberg: "1.10.0"
expects_kinds:
  - env.platform
  - env.runtime_signal
expects_rules: []
