name: malformed_dump
proves: >
  Dump do Glue Data Catalog com uma tabela boa, uma entrada sem `name` e uma
  que nem objeto e. A tabela boa continua virando `catalog.table_schema` --
  uma entrada ruim nao pode descartar as outras -- e as duas ruins viram
  `catalog.unresolved` com reasons distintos (`missing_table_name` e
  `malformed_json`), contados na sentinela. Sem isso, um dump truncado no meio
  pareceria um catalogo com menos tabelas, e toda regra escrita com `absent:`
  sobre fact de catalogo passaria a valer vacuamente.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - catalog.analyzed
  - catalog.table_schema
  - catalog.unresolved
expects_rules: []
