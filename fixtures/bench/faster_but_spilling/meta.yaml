name: faster_but_spilling
proves: >
  Ganho fragil: o depois soma 16,6 s de tempo de task contra 22,0 s do antes
  (-24,5%) sobre o MESMO volume lido (140 MB, 0,0%), mas derrama 160 MB contra
  5 MB do antes (+3100,0%) e gasta o dobro de GC (2,2 s contra 1,1 s). O
  antes derrama pouco de proposito, e o que isso compra e cobertura de FATO, nao
  de regra: base nao-zero e a unica forma de o comparador emitir
  `total_spill_bytes_delta_pct` (com zero no antes ele OMITE a chave -- divisao
  por zero e "nao sei", nao "infinito por cento"), entao e esta fixture que fixa
  o valor 3100,0 no golden. A `SF-BENCH-003` dispararia dos dois jeitos: ela le
  os TOTAIS e nao o percentual, justamente porque spill que nasce do zero seria
  invisivel para o percentual (D-4a-25). Esse outro ramo do gatilho e guardado em
  `tests/test_facts_benchmark.py::TestSFBench003SobreOSpillQueNasce`, com facts
  construidos. Tempo caiu comprando memoria -- e o ganho desaparece quando o dado
  crescer.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - bench.analyzed
  - bench.run_delta
  - bench.stage_delta
expects_rules:
  - SF-BENCH-003
