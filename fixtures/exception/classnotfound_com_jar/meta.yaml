name: classnotfound_com_jar
proves: >
  O POSITIVO de `SF-ERR-009`, a mais simples das tres desta familia: a classe
  NUNCA esteve no classpath.

  `error.signature_match` com `signature_id: ERR-SPARK-003` e
  `matched_on: exception_class`, mais o `.jar` e o `main.tf` que a assinatura
  declara em `evidence_required`.

  E a UNICA das tres em que "falta um jar" e a leitura certa. Em
  `noclassdef_com_jar` a classe ESTAVA na compilacao, e em
  `abstractmethod_com_jar` ela esta la na versao errada -- as tres fixtures
  existem juntas porque tratar as tres como a mesma coisa e o erro que as
  regras existem para evitar.
runtime:
  glue: "6.0"
  spark: "4.0.0"
  python: "3.11"
  iceberg: "1.9.1"
expects_kinds:
  - error.signature_match
  - mig.jar_binary
  - spark.cluster.cores
  - spark.conf_effective
  - spark.conf_excluded
  - spark.exception
  - spark.exception.frame
  - spark.job.spill_summary
  - spark.log_analyzed
  - spark.runtime_version
  - spark.stage.callsite
  - spark.stage.failure
  - spark.stage.gc
  - spark.stage.spill
  - spark.stage.task_count
  - spark.stage.task_duration
  - spark.stage.task_input
  - tf.attribute
  - tf.module_analyzed
  - tf.observability.spark_ui
  - tf.resource
expects_rules:
  - SF-ERR-009
  - SF-SPARK4-004
