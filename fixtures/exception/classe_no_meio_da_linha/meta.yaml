name: classe_no_meio_da_linha
proves: >
  O LIMITE ATUAL do parser, registrado como recusa nomeada em vez de ficar
  implicito no codigo.

  O `Failure Reason` aqui e a forma que o `DAGScheduler` escreve quando uma task
  falha N vezes:

      Job aborted due to stage failure: Task 3 in stage 5.0 failed 4 times, [...]
      executor 2): java.lang.OutOfMemoryError: Java heap space

  A classe que importa -- `java.lang.OutOfMemoryError` -- esta no MEIO da primeira
  linha, depois do prefixo do escalonador. `_CABECA` e ancorada em `^` de
  proposito: sem a ancora, qualquer `chave.pontuada: valor` de mensagem livre
  viraria classe de excecao que ninguem lancou. Com ela, esta forma sai como
  `spark.exception.unresolved` com `reason: sem_forma_de_stacktrace`.

  Esta fixture NAO afirma que a recusa e o comportamento desejado -- afirma que e
  o comportamento ATUAL, e o prende. `sparkforge/facts/exception.py` ja nomeava
  essa lacuna em prosa desde a T1, dizendo que alargar a ancora exigia a fixture
  que provasse a forma. A fixture agora existe. Quando alguem alargar o parser,
  este golden e o que muda, e o diff dele e a discussao -- em vez de o
  comportamento mudar em silencio para os dois lados.

  Ela divide o kind com `texto_sem_forma_de_stacktrace` e o mesmo `reason`, e as
  duas nao sao duplicata: aquela nao tem excecao NENHUMA no texto, esta TEM e o
  parser nao a alcanca. O kind e o mesmo porque o extrator nao distingue os dois
  casos -- e nao distinguir e justamente o limite que se esta registrando.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - spark.cluster.cores
  - spark.conf_effective
  - spark.conf_excluded
  - spark.exception.unresolved
  - spark.job.spill_summary
  - spark.log_analyzed
  - spark.runtime_version
  - spark.stage.callsite
  - spark.stage.failure
  - spark.stage.gc
  - spark.stage.spill
  - spark.stage.task_count
  - spark.stage.task_duration
  - spark.stage.task_input
expects_rules: []
