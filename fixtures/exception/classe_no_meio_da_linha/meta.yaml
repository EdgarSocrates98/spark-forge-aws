name: classe_no_meio_da_linha
proves: >
  A forma que o `DAGScheduler` escreve quando uma task falha N vezes, e o
  SEGUNDO padrao do parser que a alcanca (2026-09-09).

  O `Failure Reason` aqui e:

      Job aborted due to stage failure: Task 3 in stage 5.0 failed 4 times, [...]
      executor 2): java.lang.OutOfMemoryError: Java heap space

  A classe que importa -- `java.lang.OutOfMemoryError` -- esta no MEIO da
  primeira linha, depois do prefixo do escalonador. `_CABECA` e ancorada em `^` e
  CONTINUA ancorada: afrouxa-la faria qualquer `chave.pontuada: valor` de
  mensagem livre virar classe de excecao que ninguem lancou. Quem alcanca esta
  forma e `_CABECA_APOS_EXECUTOR`, um segundo padrao com ancora PROPRIA --
  `executor <algo>):` e prefixo literal do `DAGScheduler`, nao forma generica.

  `attrs.parsed_by: after_executor` diz por qual dos dois a excecao entrou, pela
  mesma razao que `matched_on` existe no matcher: sem ele, duas procedencias
  ficariam indistinguiveis dentro do mesmo fact.

  A HISTORIA desta fixture e o ponto dela. Ela nasceu na T5 registrando a
  RECUSA (`spark.exception.unresolved: sem_forma_de_stacktrace`) como
  comportamento ATUAL, e o `proves` de entao dizia: *quando alguem alargar o
  parser, este golden e o que muda, e o diff dele e a discussao -- em vez de o
  comportamento mudar em silencio para os dois lados*. O golden mudou, e o diff
  e exatamente esse: o `unresolved` virou `spark.exception` com dois
  `spark.exception.frame`.

  O `error.signature.unresolved` que esta fixture publicava ate 2026-09-09 SUMIU,
  e a mudanca nao foi do parser -- foi do CATALOGO. `ERR-SPARK-006` passou a
  existir e descreve exatamente esta excecao, entao o match de hoje e uma
  assinatura nova alcancando um texto que ja estava no corpus, e nao invencao.
  `SF-ERR-012` dispara em consequencia.

  `texto_sem_forma_de_stacktrace` continua sendo a recusa deste corpus, e agora
  as duas fixtures nao dividem mais kind: aquela nao tem excecao NENHUMA no
  texto, esta TEM e o parser passou a alcanca-la.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - error.signature_match
  - spark.cluster.cores
  - spark.conf_effective
  - spark.conf_excluded
  - spark.exception
  - spark.exception.frame
  - spark.job.spill_summary
  - spark.log_analyzed
  - spark.runtime_version
  - spark.stage.callsite
  - spark.stage.failure
  - spark.stage.gc
  - spark.stage.spill
  - spark.stage.task_count
  - spark.stage.task_duration
  - spark.stage.task_input
expects_rules:
  - SF-ERR-012
