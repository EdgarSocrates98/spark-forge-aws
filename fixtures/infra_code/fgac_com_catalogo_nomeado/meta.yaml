name: fgac_com_catalogo_nomeado
proves: >
  O POSITIVO de `SF-LF-003`, e a primeira fixture do repositorio que exercita
  `sparkforge/facts/lakeformation.py`.

  Um `aws_glue_job` em Glue 5.1 declara
  `--enable-lakeformation-fine-grained-access = "true"` e, no mesmo
  `default_arguments`, um catalogo Iceberg de nome arbitrario
  (`spark.sql.catalog.glue_catalog`). A AWS declara que Iceberg sob FGAC so pode
  usar o session catalog, e o session catalog do Spark e `spark_catalog`.

  O que a fixture prova sobre o EXTRATOR, e nao sobre a regra: as tres chaves
  `spark.sql.catalog.glue_catalog*` produzem UM `lakeformation.iceberg_catalog`,
  nao tres -- `catalog-impl` e `warehouse` sao propriedades do catalogo, nao
  catalogos novos. Sem esse corte a contagem de catalogos do case seria ficcao,
  e a regra disparia tres vezes sobre o mesmo defeito.

  `lakeformation.unresolved` sai junto, e ele e a metade honesta do achado: os
  grants do Lake Formation, a policy do runtime role e o registro da localizacao
  S3 nao entram em artefato que este motor colete, e a autorizacao da escrita
  mora exatamente ali.

  A fixture e TF-only pela mesma razao das outras duas de `SF-LF`: o `.py`
  acrescentaria facts de PySpark capazes de fazer outra regra disparar junto e
  contaminar o que ela prova.
runtime:
  glue: "5.1"
  spark: "3.5.6"
  python: "3.11"
  iceberg: "1.10.0"
expects_kinds:
  - lakeformation.access_model
  - lakeformation.iceberg_catalog
  - lakeformation.unresolved
  - tf.attribute
  - tf.module_analyzed
  - tf.observability.spark_ui
  - tf.resource
  - tf.spark_conf
expects_rules:
  - SF-LF-003
