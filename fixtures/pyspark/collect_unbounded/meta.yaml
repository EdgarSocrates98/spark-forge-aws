name: collect_unbounded
proves: >
  collect() sem limit/take antes traz todo o resultado para o heap do driver.
  SF-PY-002 dispara sobre pyspark.driver_collect com attrs.bounded == false.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds: [pyspark.driver_collect, pyspark.action, pyspark.module_analyzed]
expects_rules: [SF-PY-002]
