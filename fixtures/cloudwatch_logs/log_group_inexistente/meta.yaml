name: log_group_inexistente
proves: >
  Recusa nomeada 1 de 4. `/aws-glue/jobs/logs-v2` nao existe nesta conta, e a
  resposta e a MESMA lista vazia das outras tres. Sem `reason`, o operador nao
  sabe se corrige o nome do grupo, pede permissao, aumenta a janela ou faz
  login.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - cloudwatch.logs.analyzed
  - cloudwatch.logs.unresolved
expects_rules: []
