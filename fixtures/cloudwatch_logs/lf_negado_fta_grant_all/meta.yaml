name: lf_negado_fta_grant_all
proves: >
  O NEGATIVO de `SF-LF-011`: o grant cobre a escrita (`ALL`), e a falha de
  `ERR-LF-001` esta em outra parte do caminho. Nenhum
  `lakeformation.missing_grant` e emitido, e o extrator nao inventa uma perna.
  `SF-LF-010` tambem dispara, e o texto dela nao e verdadeiro aqui: FTA nao
  produz `lakeformation.access_model` (D9, a superficie dele e
  `lakeformation.filesystem`), e a regra so pergunta `absent:
  lakeformation.access_model` ao lado do registro. Lacuna da regra, anterior a
  LF_GRANTS; o golden a prende como esta para que a correcao apareca no diff.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - cloudwatch.log_event
  - cloudwatch.logs.analyzed
  - error.signature_match
  - lakeformation.data_lake_settings
  - lakeformation.filesystem
  - lakeformation.grant
  - lakeformation.grants.analyzed
  - lakeformation.registered_location
  - pyspark.chain
  - pyspark.module_analyzed
  - pyspark.read
  - pyspark.write
  - tf.attribute
  - tf.module_analyzed
  - tf.observability.spark_ui
  - tf.resource
  - tf.spark_conf
expects_rules:
  - SF-LF-010
