name: auto_termination_near_threshold
proves: >
  A contraparte negativa de `auto_termination_idle_day`, e ela é near-threshold de
  verdade: o mesmo dump, com `IdleTimeout` 82800 em vez de 86400 — vinte e três
  horas contra vinte e quatro. Nada mais muda. A measure
  `idle_timeout_seconds` está presente no `emr.cluster` e SF-EMR-009 NÃO dispara,
  o que é a única forma de provar que o limiar do catálogo é lido e comparado, em
  vez de a regra disparar por presença da measure.
  O golden vazio de `findings.json` é assertivo aqui, não decorativo: se alguém
  baixar `threshold.idle_timeout_seconds`, trocar `>=` por `>` do lado errado, ou
  fizer a regra disparar pela mera existência da política, é este arquivo que
  quebra.
  A terceira direção — cluster SEM política nenhuma, onde a measure não existe e
  o avaliador falha fechado — já está coberta pelo resto do corpus: sete das dez
  fixtures de `fixtures/emr/` não trazem `AutoTerminationPolicy`, e
  `instance_groups_spot_task` traz o default da AWS (3600 s). Nenhuma delas
  dispara SF-EMR-009, e os goldens delas continuam intactos.
runtime:
  emr: "7.5.0"
  spark: "3.5.2-amzn-1"
  iceberg: "1.6.1-amzn-1"
expects_kinds:
  - emr.analyzed
  - emr.application
  - emr.cluster
  - emr.instance_capacity
expects_rules: []
