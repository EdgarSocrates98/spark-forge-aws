name: all_spot_groups_maximize
proves: >
  A contraparte negativa das duas regras desta area que sao mais faceis de
  escrever errado, e ela e um cluster que a AWS RECOMENDA, nao um cluster
  neutro. E a linha "cost-driven workloads" da tabela oficial de cenarios --
  primary, core e task inteiramente em Spot, transiente, com `AutoTerminate` --,
  e nela primary em Spot e a escolha certa.
  SF-EMR-004 NAO dispara aqui, e e esse o ponto: a regra acusa a CONTRADICAO
  entre primary Spot e core On-Demand, nunca primary Spot por si. Uma versao
  ingenua da regra -- "MASTER com Spot" -- acusaria esta fixture, ou seja,
  acusaria a recomendacao oficial, que o `rules/catalog/README.md` trata como o
  pior tipo de defeito de regra. `instance_fleets_maximize` e o lado positivo:
  la o core e On-Demand e a contradicao existe.
  SF-EMR-001 tambem NAO dispara, pelo outro discriminante:
  `maximizeResourceAllocation=true` esta aqui no nivel cluster, e e correto --
  `InstanceCollectionType` e `INSTANCE_GROUP`, onde o grupo core tem um tipo de
  instancia so e o calculo do executor e deterministico. O defeito so existe em
  `INSTANCE_FLEET`, onde a frota pode ter varios tipos e o EMR dimensiona por
  um deles.
  SF-EMR-008 tambem NAO dispara, e este e o terceiro discriminante -- o unico
  que precisou de um fact derivado para existir. O cluster e 6.x, tem Spot no
  TASK, e portanto casa as duas primeiras condicoes da regra; o que o barra e o
  `yarn-site` com as DUAS propriedades de node label no nivel cluster
  (`yarn.node-labels.enabled=true` e
  `yarn.node-labels.am.default-node-label-expression=CORE`), que faz
  `sparkforge/facts/emr_cluster.py::_am_node_label_facts` emitir
  `emr.yarn.am_node_label` e o `absent:` da regra falhar. Sem esse fact a regra
  nao poderia existir: o motor so sabe `absent: <kind>`, sem `where` negado e
  sem `absent` filtrado por atributo, entao ela acusaria em P1 todo cluster
  6.x/7.x com Spot no TASK -- inclusive este, que fixou o AM corretamente.
  `node_labels_half_configured` e o par positivo, com so uma das duas
  propriedades.
  Bootstrap action sem segredo nos `Args` e `LogUri` presente fecham os lados
  negativos de SF-EMR-002 e SF-EMR-006, e `ALL_STEPS_COMPLETED` num cluster ja
  TERMINATED fecha o de SF-EMR-007: terminar nao e falhar.
runtime:
  emr: "6.15.0"
  spark: "3.4.1-amzn-2"
  iceberg: "1.4.0-amzn-0"
expects_kinds:
  - emr.analyzed
  - emr.application
  - emr.bootstrap_action
  - emr.cluster
  - emr.configuration
  - emr.instance_capacity
  - emr.yarn.am_node_label
expects_rules: []
