name: conf_local_checkpoints_nao_booleano
proves: >
  A diferenca entre "nao ha literal" e "ha literal que nao converte", que o
  vocabulario de razoes confundia numa so. `conf_local_checkpoints_ilegivel`
  passa a conf por parametro e sai com `non_literal_argument`; esta passa `1`,
  que e literal, e sai com `non_boolean_value`.
  A decisao e a mesma nos dois -- exigencia OMITIDA, ponto cego contado --, e o
  que muda e para onde o rotulo manda quem for investigar: procurar a variavel
  num caso, converter o valor no outro.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - graph.import
  - graph.construction
  - graph.algorithm
  - graph.unresolved
  - graph.module_analyzed
expects_rules: []
