name: import_com_jar_declarado
proves: >
  O MESMO `.py` e o MESMO runtime sem jar de `import_sem_jar_no_iac`, com
  `--extra-jars` declarado no `default_arguments` do Glue job.
  A Task 4 escreveu esta fixture como a metade NEGATIVA da regra de
  disponibilidade. A Task 5 mediu que ela nao e negativa, e o golden registra
  isso: SF-GRAPH-002 dispara nos dois lados do par. Duas razoes independentes,
  ambas em `rules/catalog/graph.yaml` (veto V-GR-1) -- o motor nao sabe dizer
  "esta chave nao esta la" (`engine._absent_satisfied` compara so `kind`, e
  `tf.attribute` existe nos dois), e `availability.md` §7 recusa afirmar que um
  jar de outro minor de Spark roda aqui. Como para 3.3 nao existe artefato
  publicado, QUALQUER `--extra-jars` de GraphFrames neste job aponta para um jar
  de outro minor.
  O que ela prova, entao, e o contrario do que o nome sugere e continua sendo
  necessario: que a acusacao e sobre o ARTEFATO e nao sobre o IaC, e que
  declarar um jar nao a fecha. Sem esta fixture, alguem escreveria a condicao
  sobre `tf.attribute` achando que fecha, e nenhum golden reclamaria.
  EM 2026-08-31 ELA GANHOU O SEGUNDO PAPEL, e e o que faltava: com o kind
  derivado `tf.graphframes.jar` (`facts/terraform.py::_check_graphframes_jar`),
  ela e o golden NEGATIVO de `SF-GRAPH-005` -- a metade acusatoria que o veto
  V-GR-1 barrava. `import_sem_jar_no_iac` dispara `SF-GRAPH-005`; esta nao, e
  as duas continuam disparando `SF-GRAPH-002`. E a assimetria e exatamente o
  que o veto dizia: declarar o jar fecha a pergunta do IaC e nao fecha a do
  artefato.
runtime:
  glue: "4.0"
  spark: "3.3.0"
  python: "3.10"
  iceberg: "1.0.0"
expects_kinds:
  - graph.import
  - graph.construction
  - graph.algorithm
  - graph.checkpoint_dir
  - graph.module_analyzed
  - tf.attribute
  - tf.graphframes.jar
  - tf.module_analyzed
  - tf.observability.spark_ui
  - tf.resource
expects_rules:
  - SF-GRAPH-002
