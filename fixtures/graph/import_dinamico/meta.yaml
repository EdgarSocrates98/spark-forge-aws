name: import_dinamico
proves: >
  Ponto cego CONTADO, e nunca adivinhado.
  `importlib.import_module("graphframes")` conta porque o nome literal e do
  pacote; `__import__(nome)` conta pelo motivo oposto -- o nome pode ser montado
  em runtime, e a honestidade e dizer "nao sei" em vez de varrer o arquivo.
  Nenhuma construcao sai daqui: sem `import` lido, `gf.GraphFrame` nao e
  reconhecido. `unresolved_count: 2` com `import_count: 0` e exatamente a
  assinatura que separa "nao ha grafo" de "nao consegui ver o grafo".
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - graph.unresolved
  - graph.module_analyzed
expects_rules: []
