name: worker_upsized_no_evidence
proves: >
  O PR troca `worker_type` de G.1X para G.4X -- quadruplica o custo por
  DPU-hora -- e o event log do run mostra zero spill em todos os stages, com
  pico de heap de ~2 GB por executor. SF-GLUE-005 dispara: aumentar o worker
  sem evidencia de limitacao de memoria e tuning por intuicao, e as causas mais
  comuns de lentidao (skew, small files, trabalho no driver) nao melhoram com
  worker maior.
  A fixture correlaciona tres coisas que nenhuma responde sozinha: o diff diz o
  que mudou, `spark.job.spill_summary` diz que nao houve spill, e
  `spark.executor.memory_usage` prova que houve medida de memoria -- sem esta
  ultima, "sem evidencia" poderia significar so "ninguem olhou".
  SF-UI-006 dispara junto e de proposito: 4 tasks contra 16 cores e
  subparalelismo real, e e a explicacao mais provavel da lentidao que
  levou alguem a aumentar o worker. As duas regras lendo o mesmo run e o
  quadro completo que o operador precisa.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - tf.module_analyzed
  - tf.resource
  - tf.attribute
  - tf.observability.spark_ui
  - spark.log_analyzed
  - spark.cluster.cores
  - spark.stage.task_duration
  - spark.stage.task_input
  - spark.stage.spill
  - spark.stage.gc
  - spark.stage.task_count
  - spark.job.spill_summary
  - spark.executor.memory_usage
expects_rules:
  - SF-GLUE-005
  - SF-UI-006
