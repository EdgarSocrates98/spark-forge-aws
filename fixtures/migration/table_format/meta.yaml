name: table_format
proves: >
  `format-version` de uma tabela Iceberg/Hudi/Delta lido de um `ALTER TABLE
  ... TBLPROPERTIES`. E a versao do FORMATO, distinta da versao da
  BIBLIOTECA que le/escreve (`knowledge/storage/iceberg-v3.md`) --
  observacao pura, sem regra nenhuma no catalogo hoje. Runtime Glue 5.0 por
  consistencia com o resto do corpus -- nao ha fronteira de versao a provar
  aqui, so o vocabulario do fact.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - mig.table_format
expects_rules: []
