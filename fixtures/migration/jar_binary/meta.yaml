name: jar_binary
proves: >
  Um `.jar` e observacao de ARQUIVO INTEIRO, nao de linha de fonte
  (`_jar_facts`, `sparkforge/facts/migration.py`): um binario nao tem linha
  Python para varrer. O nome codifica a versao de Scala
  (`conector_2.12-1.4.0.jar` -> "2.12"), que o extrator le do nome do
  arquivo, nao do conteudo, e dela deriva `scala_minor` 12 -- inteiro, porque
  o avaliador de `expr` do catalogo compara numero e nao versao.

  Esta fixture e tambem o par NEGATIVO POR VERSAO de `spark4_jar_scala_212`
  para SF-SPARK4-004: o `scala_minor` esta ABAIXO do limiar `< 13` da regra, e
  mesmo assim `expects_rules` fica vazio, porque o runtime e Glue 5.0
  (Spark 3.5.4) -- abaixo do `runtime_scope` `spark >=4.0.0` dela. O fact esta
  la, a regra e pulada por VERSAO e nao por falta de dado, e isso e correto --
  Scala 2.12 e o CERTO em Spark 3.5. Mesma forma do par `python_dep` /
  `spark4_pyarrow_pin`. O runtime Glue 5.0 ja estava aqui por consistencia com
  o resto do corpus, e passou a sustentar peso.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - mig.jar_binary
expects_rules: []
