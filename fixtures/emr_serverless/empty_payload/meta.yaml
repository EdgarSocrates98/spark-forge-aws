name: empty_payload
proves: >
  JSON valido e vazio: nem `application`. Vira UM `emrs.unresolved` com
  `reason: missing_application` mais a sentinela `emrs.analyzed` com os quatro
  contadores em zero -- e a sentinela e o ponto. Sem ela, uma condicao `absent:`
  sobre qualquer fact `emrs.*` seria vacuamente verdadeira num repositorio onde
  o extrator nunca rodou, e a regra dispararia sobre uma application que ninguem
  olhou. Com ela, "analisei e nao ha" e "nunca analisei" sao dois estados
  distintos no proprio corpus de facts.
  `missing_application` e distinto de `missing_application_id` de proposito: aqui
  falta o `get-application` inteiro, e o operador precisa saber qual comando
  rodar, nao que o payload veio incompleto.
# Runtime vazio de PROPOSITO, e a razao e medida, nao omissao:
# a documentacao do EMR Serverless nao publica a matriz de release
# (D-5d-5), entao nao ha versao de Spark, Hadoop, Iceberg ou Python que
# este artefato sustente. Declarar uma copiada do EMR on EC2 seria
# exatamente a invencao que a fase recusou. Corolario para a Task 5:
# toda regra SF-EMRS precisa de `runtime_scope: {}` -- qualquer
# restricao de versao a tornaria inalcancavel neste corpus, e o golden
# ficaria verde por SKIP, que e pior que ficar vermelho.
runtime: {}
expects_kinds:
  - emrs.analyzed
  - emrs.unresolved
expects_rules: []
