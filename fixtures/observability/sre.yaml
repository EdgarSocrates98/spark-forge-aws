schema_version: 1
service: orders-platform
slos:
  - id: orders_freshness
    indicator: freshness
    unit: seconds
    operator: lte
    target: 900
    objective: 0.99
    window: 1h
  - id: orders_completeness
    indicator: completeness
    unit: ratio
    operator: gte
    target: 0.999
    objective: 0.99
    window: 1d
  - id: orders_lag
    indicator: consumer_lag
    unit: records
    operator: lte
    target: 1000
    objective: 0.99
    window: 15m
  - id: orders_latency_missing
    indicator: latency
    unit: milliseconds
    operator: lte
    target: 500
    objective: 0.99
    window: 15m
measurements:
