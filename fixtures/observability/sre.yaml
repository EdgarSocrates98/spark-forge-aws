  - {slo_id: orders_completeness, value: 0.9995, unit: ratio, timestamp: "2026-10-02T10:00:00Z"}
  - {slo_id: orders_lag, value: 400, unit: records, timestamp: "2026-10-02T10:00:00Z"}
incidents:
  - id: inc-2026-10-02-001
    severity: P1
    started_at: "2026-10-02T09:00:00Z"
    resolved_at: "2026-10-02T09:45:00Z"
    impacted_nodes: [kafka.orders, flink.orders_enriched, iceberg.orders]
    runbook_ref: synthetic://runbook/consumer-lag
  - id: inc-open
    severity: P2
    started_at: "2026-10-02T10:30:00Z"
    impacted_nodes: [athena.orders]
dependencies:
