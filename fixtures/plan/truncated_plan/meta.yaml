name: truncated_plan
proves: >
  Spark trunca listas longas de campos com `... 56 more fields`. Contar o que
  sobrou inflaria a razao de SF-PQ-004 em silencio (24 de 80 colunas listadas).
  O extrator nao emite `read_schema_columns` nem `referenced_columns` quando a
  lista veio truncada, conta o ponto cego como `plan.unresolved` com reason
  `truncated_field_list`, e nenhuma regra dispara sobre contagem parcial.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - plan.analyzed
  - plan.file_scan
  - plan.unresolved
expects_rules: []
