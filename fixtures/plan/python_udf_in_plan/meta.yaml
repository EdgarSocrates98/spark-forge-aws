name: python_udf_in_plan
proves: >
  UDF Python aparece no plano fisico como no proprio -- `BatchEvalPython` (UDF
  Python linha a linha) e `ArrowEvalPython` (transferencia colunar por Arrow em
  vez de pickle linha a linha -- `pandas_udf` ou UDF Python otimizada para
  Arrow; o plano nao diz qual). O extrator distingue os dois em
  `attrs.udf_type`, e a distincao muda a recomendacao: trocar uma UDF em Arrow
  por funcao nativa e ganho menor que eliminar uma UDF linha a linha, que
  serializa cada registro para o interpretador Python. SF-PLAN-001 e
  SF-PLAN-002 consomem `plan.python_udf` -- e por isso mesmo precisa de
  golden: campo consumido por regra e o que quebra em silencio numa
  refatoracao sem ninguem notar.
  O Scan tem PartitionFilters preenchido de proposito, para que a fixture nao
  dispare SF-PQ-002 e o corpus continue provando so o que se propoe.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - plan.analyzed
  - plan.aqe
  - plan.file_scan
  - plan.python_udf
expects_rules:
  - SF-PLAN-001
  - SF-PLAN-002
