name: clean_query
proves: >
  Query bem formada: colunas explicitas, filtro sobre uma coluna, sem LIMIT.
  Nao deve produzir nenhum finding -- nem por defeito do extrator, nem por
  qualquer regra SF-ATH-* alcancavel a partir so de texto SQL nesta fase.
runtime:
  glue: "5.0"
  spark: "3.5.4"
  python: "3.11"
  iceberg: "1.7.1"
expects_kinds:
  - sql.projection
  - sql.predicate
  - sql.analyzed
expects_rules: []
