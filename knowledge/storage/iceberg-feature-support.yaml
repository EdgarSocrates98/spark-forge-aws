          retrieved: "2026-08-22"
          note: >-
            VARIANT com shredding, nomeado como suportado no Glue 6.0. Dois recortes declarados pela mesma fonte: os tipos novos da v3 so funcionam com Spark DataFrames (DynamicFrame e Visual ETL do Glue Studio nao os alcancam), e FGAC nao e suportado com coluna VARIANT.
        "5.1": UNKNOWN
      athena:
        "*":
          status: UNSUPPORTED
          source: "https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html"
          source_type: OFFICIAL_TECHNICAL_DOC
          retrieved: "2026-08-22"
          note: >-
            Tabela com 'format-version'='3' nao e lida pelo Athena SQL: "Cannot read unsupported version 3". VARIANT e tipo exclusivo da v3, logo inalcancavel via Athena. Para compatibilidade entre engines, v2. A mesma cadeia NAO foi estendida as outras features da v3, porque a fonte fala do formato da tabela e nao de cada feature -- ver `engines.athena.note`.
      emr_ec2:
        "*": UNKNOWN
      emr_serverless:
        "*": UNKNOWN
      emr_eks:
        "*": UNKNOWN
