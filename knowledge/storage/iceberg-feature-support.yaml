          source: "https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg.html"
          source_type: OFFICIAL_TECHNICAL_DOC
          retrieved: "2026-09-01"
          note: >-
            IAM NAO E PROVA DE ACESSO AO DADO, e esta e a celula que mostra isso: "Although you can use Lake Formation to manage read access permissions for TransactionTable Formats (TTFs) like Apache Iceberg, Apache Hudi, and Linux Foundation Delta Lake, you cannot use Lake Formation to manage permissions for operations like VACUUM, MERGE, UPDATE or OPTIMIZE with these table formats." A engine executa o MERGE; a camada de governanca nao consegue autoriza-lo com granularidade. Sao camadas separadas, e o UNSUPPORTED e da camada, nao do motor.
