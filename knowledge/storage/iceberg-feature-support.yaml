    # Sem `spec_version`: MERGE INTO e SQL, nao adicao de formato. Carimbar 2 ou 3
    # aqui a colocaria dentro do veredito de upgrade de format version, que e
    # outra pergunta.
    #
    # Sem `min_library_version`: LACUNA REGISTRADA. As notas curadas citam MERGE
    # em contextos de engine (Spark 3.5, row lineage), nunca como capacidade nova
    # da biblioteca numa release. Nao ha limite inferior a declarar.
    #
    # A CELULA DE LAKE FORMATION AQUI E A SEGUNDA COMBINACAO DA SECAO 7:
    # DELETE/MERGE x FGAC, e ela e CONFIRMADA por fonte.
    engines:
      glue:
        "*": UNKNOWN
      athena:
        "*":
          status: PARTIAL
          source: "https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg-updating-iceberg-table-data.html"
          source_type: OFFICIAL_TECHNICAL_DOC
          retrieved: "2026-09-01"
          note: >-
            O Athena expoe INSERT INTO, DELETE, UPDATE e MERGE INTO sobre tabela Iceberg. O recorte esta na propria fonte: "The UPDATE, MERGE INTO, and DELETE FROM operations always use the merge-on-read approach with positional deletes, regardless of specified table properties" -- `write.merge.mode` = copy-on-write e IGNORADO em silencio, sem falhar a query. Um plano que dependa de copy-on-write pelo Athena esta contando com algo que a fonte diz que nao acontece.
