    engines:
      glue:
        "*":
          status: UNKNOWN
          note: >-
            RECUSA NOMEADA. A pagina do endpoint Iceberg REST do Glue enumera 12 operacoes (GetConfig, ListNamespaces, CreateNamespace, LoadNamespaceMetadata, UpdateNamespaceProperties, DeleteNamespace, ListTables, CreateTable, LoadTable, TableExists, UpdateTable, DeleteTable) e nenhuma delas e de scan planning. Ausencia de uma operacao numa lista NAO foi lida como negativa: a pagina nao diz que a lista e exaustiva com essas palavras, e transformar uma omissao em UNSUPPORTED e fabricar celula por raciocinio na direcao negativa. A medida que destrava: a pagina nomear PlanTableScan, FetchPlanningResult ou FetchScanTasks, em qualquer das duas direcoes.
