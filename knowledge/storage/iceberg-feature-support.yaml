          source: "https://docs.aws.amazon.com/glue/latest/dg/connect-glu-iceberg-rest.html"
          source_type: OFFICIAL_TECHNICAL_DOC
          retrieved: "2026-09-01"
          note: >-
            O Glue Data Catalog publica um endpoint Iceberg REST. O recorte que IMPORTA para uma decisao de v3 esta na propria frase da fonte: "The endpoint supports both Apache Iceberg table specifications - v1 and v2, defaulting to v2." A pagina NAO nomeia v3 -- e por isso este PARTIAL nao pode ser lido como suporte a v3 por este caminho. Outros dois recortes declarados: o endpoint expoe 12 operacoes REST nomeadas, e o Glue so suporta namespace de UM nivel.
