    engines:
      glue:
        "6.0":
          status: SUPPORTED
          source: "https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html"
          source_type: OFFICIAL_TECHNICAL_DOC
          retrieved: "2026-08-22"
          note: >-
            "VARIANT com shredding" e o texto da fonte. O efeito do shredding sobre custo de leitura, pruning e plano fisico nao foi lido nesta coleta -- ver `iceberg-v3.md`, secao Fontes.
        "5.1": UNKNOWN
      athena:
