          source: "https://docs.aws.amazon.com/glue/latest/dg/connect-glu-iceberg-rest.html"
          source_type: OFFICIAL_TECHNICAL_DOC
          retrieved: "2026-09-01"
          note: >-
            "Using an Iceberg REST client, you can connect your application running on an analytics engine to the REST catalog hosted in the Data Catalog." A fonte fala do ENDPOINT e do padrao de conexao, nunca de um cliente concreto: o que um cliente REST consegue fazer depende da engine por tras dele. `ENGINE_DEPENDENT` e a resposta exata -- nem afirmar suporte generico, nem esconder que o caminho existe.
      s3_tables:
        "*": UNKNOWN
      lakeformation:
        "*":
          status: UNKNOWN
          note: >-
            A QUARTA COMBINACAO DA SECAO 7 DO PROMPT MESTRE, e ela fica UNKNOWN de proposito. A pagina do endpoint Iceberg REST do Glue nao menciona Lake Formation em lugar nenhum -- nem para dizer que integra, nem para dizer que nao. A medida que destravaria: uma pagina da AWS que nomeie credential vending ou FGAC no endpoint `glue.<regiao>.amazonaws.com/iceberg`. Ate la, permissao IAM concedida ao endpoint NAO e prova de acesso ao dado.
