          status: PARTIAL
          source: "https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html"
          source_type: OFFICIAL_TECHNICAL_DOC
          retrieved: "2026-08-22"
          note: >-
            FGAC (controle de acesso fino) nao e suportado com coluna VARIANT. A escolha e entre VARIANT e granularidade de acesso, nao as duas. O que o Lake Formation faz com a tabela FORA do FGAC nao foi lido. E a primeira das quatro combinacoes da secao 7 do prompt mestre -- ver `engines.lakeformation.note`.
  variant_shredding:
    # Sem `spec_version`: a lista de adicoes da v3 lida na spec 1.11.0 nomeia o
