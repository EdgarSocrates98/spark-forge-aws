      note: >-
        Notas curadas do Apache Iceberg, na tag 1.11.0. 1.8.0, secao Spec: "Add Variant Type (#10831)"; secao API: "Define Variant Data type (#11324)". Os leitores e escritores de Parquet e ORC so chegam em 1.9.0 -- por isso 1.8.0 e LIMITE INFERIOR e nao data de disponibilidade.
    engines:
      glue:
        "6.0":
          status: SUPPORTED
          source: "https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html"
