            funcionam com Spark DataFrames: job escrito sobre DynamicFrame nao
            os alcanca, e o Visual ETL do Glue Studio tambem nao os suporta.
        "5.1": UNKNOWN
      athena:
        "*": UNKNOWN
      emr:
        "*": UNKNOWN
