# Matriz de compatibilidade: feature de Iceberg CONTRA engine.
#
# POR QUE ESTE ARQUIVO EXISTE: `knowledge/storage/iceberg-v3.md` separa em
# prosa a metade "feature da spec" da metade "suporte da engine", e diz que uma
# nao se deduz da outra. Prosa nao e consultavel e nao tem gate. Aqui a mesma
# separacao vira DADO, com uma regra gravada em codigo por
# `sparkforge/storage/feature_support.py`:
#
#   TODA CELULA AFIRMATIVA PRECISA DE EVIDENCIA PROPRIA. Nunca se infere "o
#   Iceberg suporta, logo o Athena suporta". Celula sem fonte da engine e
#   `UNKNOWN`, e `UNKNOWN` e o resultado honesto -- nao uma falha.
#
# `UNKNOWN` NAO precisa de fonte (desconhecimento nao precisa de prova), mas
# precisa EXISTIR: celula ausente e celula desconhecida sao coisas diferentes.
# A ausente diz "ninguem perguntou"; a `UNKNOWN` diz "perguntamos e nao ha
# fonte". Por isso toda celula desconhecida esta escrita, na forma curta
# (`"6.0": UNKNOWN`) ou na forma longa com `note` quando a RECUSA TEM NOME --
# quando da para dizer qual medida a destravaria.
#
# `emr` NAO E UMA ENGINE, e essa e a mudanca que este arquivo carrega.
# ============================================================================
# Ate 2026-09-01 havia uma unica linha `emr`. O sub-projeto de EMR on EKS mediu
# que as TRES plataformas publicam Iceberg DIFERENTE -- divergencia em 6 de 26
# releases comparaveis entre EC2 e EKS:
#
#   emr-7.7.0   EC2 publica Iceberg 1.7.1-amzn-0; EKS publica 1.6.1-amzn-2.
#               MINOR diferente, e portanto aplicabilidade diferente de
#               qualquer feature que tenha entrado entre as duas.
#   emr-6.5.0   EC2 publica Iceberg 0.12.0; o EKS NAO publica Iceberg nenhum.
#
# Uma celula que respondia por tres plataformas que divergem e pior que celula
# ausente: ausencia e recusa, e aquela celula era uma afirmacao. Agora sao
# `emr_ec2`, `emr_serverless` e `emr_eks`.
#
# A VERSAO DE ICEBERG NAO E REPETIDA AQUI. Ela mora em
# `knowledge/<plataforma>/runtime-matrix.yaml` e e carregada por
# `sparkforge/facts/runtime_matrix.py`. Repeti-la seria a terceira copia do
# mesmo fato. O que ESTA aqui e `min_library_version` -- a partir de qual
# release da BIBLIOTECA a capacidade aparece -- e o cruzamento com a release da
# plataforma e CALCULADO por `sparkforge/storage/readiness.py`.
#
# `min_library_version` E LIMITE INFERIOR, e nunca prova de suporte.
# ============================================================================
# O valor e a PRIMEIRA release cujas notas curadas do Apache Iceberg
# (`site/docs/releases.md`, na tag 1.11.0) NOMEIAM a capacidade -- na spec, na
# API ou no core. Duas consequencias, e as duas estao em codigo:
#
#   biblioteca ANTERIOR ao minimo  -> `UNSUPPORTED`. Uma biblioteca publicada
#                                     antes da primeira release que nomeia a
#                                     capacidade nao pode te-la.
#   biblioteca ATENDE o minimo     -> NAO vira `SUPPORTED`. O resultado e o que
#                                     a celula da engine disser, que quase
#                                     sempre e `UNKNOWN`. Atender o minimo e
#                                     condicao NECESSARIA, nunca suficiente:
#                                     a AWS repackaga (`-amzn-N`) e pode
#                                     desabilitar o que a upstream entrega.
#
# Feature sem `min_library_version` e LACUNA REGISTRADA: as notas curadas lidas
# nesta coleta nao nomeiam a capacidade em release nenhuma entre 1.6.0 e
# 1.10.1. Ela sai `UNKNOWN` no cruzamento, com a razao dizendo isso.
#
# O LIMITE DA GRANULARIDADE, declarado: a matriz de runtime do EMR on EKS e
# indexada por FAMILIA (`7.7.0`), nao por variante de imagem. A propria fonte
# declara que `emr-7.7.0-java8-latest` NAO tem Iceberg enquanto `emr-7.7.0`
# tem. Perguntar por um label com variante devolve `UNKNOWN` com a razao
# `variante_de_imagem_fora_da_matriz`, nunca a resposta da familia.
#
# VOCABULARIO DE `status` (fechado, validado pelo carregador): SUPPORTED,
# UNSUPPORTED, PARTIAL, READ_ONLY, WRITE_ONLY, PREVIEW, ENGINE_DEPENDENT,
# VERSION_DEPENDENT, UNKNOWN, CONFLICTING. `source_type` reusa
# `sparkforge/facts/runtime_matrix.py:SOURCE_TYPES` -- o mesmo vocabulario da
# matriz de runtime, importado de la e nunca redeclarado.
#
# CHAVE DE VERSAO `"*"`: a fonte nao qualifica a afirmacao por versao da
# engine. O Glue distingue 6.0 de 5.1 por escrito, entao tem duas chaves; a
# afirmacao sobre o Athena vale para a engine sem recorte de versao, e mentir
# uma versao ali seria precisao inventada.
#
# UMA ESCOLHA DE JULGAMENTO, DECLARADA: a AWS nomeia VARIANT-com-shredding,
# timestamp de nanossegundo e tipos geoespaciais como suportados no Glue 6.0 E
# diz que os tipos novos da v3 so funcionam com Spark DataFrames (nao com
# DynamicFrame, nem no Visual ETL do Glue Studio). O recorte vale para os tres.
# `variant` esta como SUPPORTED porque e a capacidade que a fonte anuncia como
# headline do 6.0, com o recorte registrado na propria `note`; os outros dois
# estao como PARTIAL, que e o que o recorte descreve. Quem ler as tres celulas
# junto ve o mesmo limite nas tres.
#
# IAM NAO E PROVA DE ACESSO AO DADO. Lake Formation, S3, KMS e Glue Catalog sao
# camadas SEPARADAS: uma feature pode ser suportada pela engine e inalcancavel
# pela FGAC. As quatro combinacoes que o prompt mestre nomeia estao em
# `engines.lakeformation.note`, cada uma com o estado que a fonte sustenta --
# duas confirmadas, duas `UNKNOWN`.
#
# Fontes, e o que cada uma sustenta:
#   - migrating-version-60.html (OFFICIAL_TECHNICAL_DOC): o suporte declarado e
#     as limitacoes declaradas do Glue 6.0 e 5.1, mais a nao-leitura de
#     `format-version = 3` pelo Athena.
#   - querying-iceberg.html (OFFICIAL_TECHNICAL_DOC): as consideracoes e
#     limitacoes do Athena sobre Iceberg, INCLUSIVE as duas afirmacoes sobre
#     Lake Formation.
#   - querying-iceberg-updating-iceberg-table-data.html (OFFICIAL_TECHNICAL_DOC):
#     INSERT/UPDATE/DELETE/MERGE INTO no Athena, e o recorte de merge-on-read.
#   - querying-iceberg-evolving-table-schema.html (OFFICIAL_TECHNICAL_DOC): as
#     mudancas de schema e as DDL que o Athena expoe.
#   - connect-glu-iceberg-rest.html (OFFICIAL_TECHNICAL_DOC): o endpoint Iceberg
#     REST do Glue Data Catalog, as especificacoes que ele suporta e as
#     operacoes REST que ele expoe.
#   - site/docs/releases.md da tag apache-iceberg-1.11.0 (UPSTREAM_RELEASE): as
#     notas CURADAS por release da biblioteca. Sustenta `min_library_version` e
#     NENHUMA celula de engine.
#   - Iceberg-release-history.html (OFFICIAL_TECHNICAL_DOC): a versao de
#     biblioteca por release de EMR. Nao sustenta celula de feature nenhuma --
#     ver `engines.emr_ec2.note`.
#   - format/spec.md da tag apache-iceberg-1.11.0 (UPSTREAM_SPEC): quais
#     features sao da spec v3, ou seja, o campo `spec_version`. Nao sustenta
#     celula de engine nenhuma.
schema_version: 1

# Notas por engine. Aqui mora o que se SABE sobre a engine sem que isso
# preencha celula alguma -- a fronteira que a secao 20 protege.
engines:
  glue:
    note: >-
      Unica engine com celula afirmativa por NOME de feature da v3 nesta
      matriz, porque e a unica cuja documentacao oficial as enumera. A versao
      de Iceberg por release do Glue mora em `knowledge/glue/runtime-matrix.yaml`
      e nao e repetida aqui.
    source: "https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html"
    source_type: OFFICIAL_TECHNICAL_DOC
    retrieved: "2026-08-22"
  athena:
    note: >-
      Tres afirmacoes disponiveis, de TRES paginas diferentes, e nenhuma
      delas se estende as outras features. (1) A pagina de migracao do Glue 6.0:
      tabela criada com 'format-version'='3' nao pode ser lida pelo Athena SQL, com
      o erro textual "Cannot read unsupported version 3" -- repare no que essa frase
      e: uma afirmacao sobre o FORMATO DA TABELA, nao sobre feature nenhuma.
      Estende-la para "logo toda feature da v3 e UNSUPPORTED no Athena" preencheria
      seis celulas a mais a partir de uma fonte que nao fala de nenhuma delas.
      (2) A pagina de atualizacao de dado do Athena: MERGE INTO existe, sempre em
      merge-on-read. (3) A pagina de evolucao de schema: as DDL que o Athena expoe.
      Cada uma preenche UMA celula, e a celula carrega a SUA fonte.
      A mesma pagina de consideracoes declara duas coisas que NAO viraram celula
      porque nao sao sobre feature: "Athena supports Apache Iceberg version 1.4.2" e
      "Athena only creates and operates on Iceberg v2 tables". A primeira e a versao
      da biblioteca embutida no Athena, e ela NAO entra no cruzamento de
      `min_library_version` -- o cruzamento so vale para plataformas com matriz de
      runtime versionada por release. Esta note e onde o conhecimento mora enquanto
      nao sustenta celula.
    source: "https://docs.aws.amazon.com/athena/latest/ug/querying-iceberg.html"
    source_type: OFFICIAL_TECHNICAL_DOC
    retrieved: "2026-09-01"
  emr_ec2:
    note: >-
      Amazon EMR on EC2. A release mais recente listada, emr-7.13.0, traz
      Iceberg 1.10.0-amzn-1, e NENHUMA release de EMR on EC2 listada traz 1.11.0.
      Isso sustenta uma unica afirmacao: feature que EXIGE a biblioteca 1.11 nao
      esta disponivel em release listada. Nao sustenta que o EMR nao leia v3 --
      1.10.0 e a versao que o Glue 5.1 usa para ESCREVER v3. Nenhuma pagina da AWS
      lida nesta coleta nomeia feature de Iceberg v3 por nome para o EMR, entao toda
      celula de engine aqui e UNKNOWN. O que o motor CONSEGUE responder e o
      cruzamento por release: `knowledge/emr/runtime-matrix.yaml` tem `iceberg` em
      28 das 30 releases, e `min_library_version` transforma isso num limite
      inferior conferivel.
    source: "https://docs.aws.amazon.com/emr/latest/ReleaseGuide/Iceberg-release-history.html"
    source_type: OFFICIAL_TECHNICAL_DOC
    retrieved: "2026-08-22"
  emr_serverless:
    note: >-
      Amazon EMR Serverless. Plataforma SEPARADA do EMR on EC2, e nao uma
      etiqueta: `knowledge/emr-serverless/runtime-matrix.yaml` publica DUAS das
      cinco colunas de EC2 (`spark` e `iceberg`), porque as outras tres nao tem
      fonte do lado do Serverless. Nenhuma fonte de feature de Iceberg do Serverless
      foi lida nesta coleta: toda celula de engine e UNKNOWN, e a resposta util vem
      do cruzamento por release.
  emr_eks:
    note: >-
      Amazon EMR on EKS. Plataforma SEPARADA, e a que motivou a quebra da
      linha `emr`: ela diverge do EC2 em 6 de 26 releases comparaveis na coluna
      `iceberg`, e em `emr-6.5.0` nao publica Iceberg NENHUM -- que e recusa
      nomeada (`iceberg_ausente_na_release`), nao `UNSUPPORTED`. Nao saber que
      versao roda e diferente de saber que nao suporta.
      LIMITE DECLARADO: a matriz e indexada por FAMILIA de release. A propria fonte
      diz que `emr-7.7.0-java8-latest` NAO tem Iceberg enquanto `emr-7.7.0` tem, e
      por isso um label com variante de imagem devolve `UNKNOWN` com razao propria
      em vez da resposta da familia.
      Nenhuma fonte de feature de Iceberg do EMR on EKS foi lida nesta coleta: toda
      celula de engine e UNKNOWN.
  redshift:
    note: >-
      Declarado pelo `ConsumerGraph` (`sparkforge/facts/consumers.py`).
      Nenhuma fonte de Redshift sobre feature de Iceberg foi lida nesta coleta, e
      Redshift nao tem matriz de runtime neste repositorio -- entao nem a celula de
      engine nem o cruzamento por release respondem. Toda celula e UNKNOWN.
  trino:
    note: >-
      Declarado pelo `ConsumerGraph`. Nenhuma fonte de Trino foi lida nesta
      coleta. Toda celula e UNKNOWN.
  spark:
    note: >-
      Declarado pelo `ConsumerGraph` como servico generico -- Spark FORA das
      plataformas gerenciadas, onde quem escolhe o jar de Iceberg e o operador.
      Justamente por isso nao ha matriz de runtime que responda por ele: a versao de
      biblioteca nao e publicada por ninguem. Toda celula e UNKNOWN, e a medida que
      destravaria e o operador declarar a versao do runtime Iceberg que ele empacota.
  flink:
    note: >-
      Pedido pelo secao 7 do prompt mestre. Nenhuma fonte de Flink foi lida
      nesta coleta -- as notas curadas do Iceberg citam Flink em varias releases, mas
      citar uma release da BIBLIOTECA nao diz o que uma implantacao de Flink executa.
      Toda celula e UNKNOWN.
  pyiceberg:
    note: >-
      Nenhuma fonte de PyIceberg foi lida nesta coleta. PyIceberg tem
      versionamento PROPRIO, independente da biblioteca Java: `min_library_version`
      NAO se aplica a ele, e cruzar as duas numeracoes seria inventar equivalencia.
      Toda celula e UNKNOWN.
  bigquery:
    note: >-
      Pedido pela secao 7 do prompt mestre. Nenhuma fonte do Google BigQuery
      foi lida nesta coleta. Toda celula e UNKNOWN.
  rest_client:
    note: >-
      Cliente Iceberg REST generico, pedido pela secao 7 do prompt mestre.
      A unica afirmacao disponivel vem da pagina do endpoint Iceberg REST do Glue
      Data Catalog, e ela e sobre o ENDPOINT, nao sobre o cliente: o que um cliente
      consegue fazer depende da engine por tras dele, e por isso a unica celula
      afirmativa aqui e `ENGINE_DEPENDENT`.
    source: "https://docs.aws.amazon.com/glue/latest/dg/connect-glu-iceberg-rest.html"
    source_type: OFFICIAL_TECHNICAL_DOC
    retrieved: "2026-09-01"
  s3_tables:
    note: >-
      Nenhuma fonte de S3 Tables sobre feature de Iceberg foi lida nesta
      coleta. A pagina do endpoint REST do Glue diz que ele alcanca tabelas em
      "Amazon S3 Table storage", o que e afirmacao sobre ALCANCE e nao sobre feature.
      Toda celula e UNKNOWN.
  lakeformation:
    note: >-
      IAM NAO E PROVA DE ACESSO AO DADO, e esta linha existe para que isso
      seja consultavel. Lake Formation, S3, KMS e Glue Catalog sao camadas
      SEPARADAS: uma feature pode ser suportada pela engine e inalcancavel pela
      FGAC. As quatro combinacoes que a secao 7 do prompt mestre nomeia, e o estado
      de cada uma nesta coleta.
      (1) VARIANT x FGAC: CONFIRMADO. FGAC nao e suportado com coluna VARIANT
      (pagina de migracao do Glue 6.0) -- ver
      `features.variant.engines.lakeformation`.
      (2) DELETE/MERGE x FGAC: CONFIRMADO. "you cannot use Lake Formation to manage
      permissions for operations like VACUUM, MERGE, UPDATE or OPTIMIZE with these
      table formats" (pagina de Iceberg do Athena) -- ver
      `features.merge_into.engines.lakeformation`.
      (3) v3 x FGAC: UNKNOWN. Nenhuma fonte lida fala de FGAC contra o FORMATO da
      tabela. A medida que destravaria e uma pagina de Lake Formation que nomeie
      `format-version`.
      (4) REST Catalog x Lake Formation: UNKNOWN. A pagina do endpoint Iceberg REST
      do Glue nao menciona Lake Formation em lugar nenhum -- ver
      `features.rest_catalog.engines.lakeformation`.
      Uma quinta afirmacao lida e sobre METADATA e nao sobre feature, e por isso
      mora aqui: com filtro de linha ou de celula do Lake Formation na tabela base,
      as metadata tables `$partitions`, `$files`, `$manifests` e `$snapshots` e a
      coluna `$path` falham com `AccessDeniedException` no Athena. E o caso limpo de
      "a engine suporta, e a camada de governanca nao deixa chegar ao dado".
    source: "https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html"
    source_type: OFFICIAL_TECHNICAL_DOC
    retrieved: "2026-08-22"

features:
