        "6.0":
          status: UNSUPPORTED
          source: "https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html"
          source_type: OFFICIAL_TECHNICAL_DOC
          retrieved: "2026-08-22"
          note: >-
            Limitacao declarada pela AWS. A feature esta na spec v3 e NAO na
            engine: partition spec e sort order continuam de argumento unico.
            E o caso que mostra por que a metade "spec" nao substitui a metade
            "engine" -- aqui a spec implica o CONTRARIO do que a engine faz.
        "5.1": UNKNOWN
