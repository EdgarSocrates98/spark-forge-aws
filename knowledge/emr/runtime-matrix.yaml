# Matriz de runtime do Amazon EMR on EC2. Dado, nunca constante em Python.
#
# POR QUE ESTE ARQUIVO EXISTE. Ate esta entrega a matriz de EMR on EC2 era a
# unica das quatro plataformas que morava COMO LITERAL em codigo -- `EMR_MATRIX`,
# em `sparkforge/facts/runtime_detect.py`, com 30 releases escritas a mao. Versao
# de release e fato EXTERNO: muda por decisao da AWS, nao deste repositorio, e
# fato externo deste repositorio carrega fonte e data. O dict em codigo nao
# carregava nenhuma das duas.
#
# MEDIDO ANTES DE MOVER, celula a celula, em 2026-08-31: o conteudo de
# `EMR_MATRIX` e o das tabelas das secoes 2 e 3 de `runtime-matrix.md`
# coincidem nas 30 releases e nas cinco colunas, sem UMA divergencia. Nao houve
# escolha a fazer entre os dois lados -- o que este arquivo faz e dar
# procedencia ao que ja estava certo, nao corrigir valor.
#
# O VOCABULARIO E FECHADO, e sao cinco componentes:
#
#   spark             a versao do fork da AWS, `{comunidade}-amzn-{N}`, CRUA.
#                     O sufixo e informacao real (secao 1 do .md); truncar aqui
#                     esconderia que o cluster roda um fork. Quem compara range
#                     trunca na hora de comparar, em `rules/version_scope.py`.
#   hadoop            fato conferido que NAO deriva para `RuntimeContext`:
#                     nenhuma regra do catalogo o tem em `runtime_scope`.
#   iceberg           AUSENTE em `6.4.0`, porque a celula da pagina oficial e
#                     vazia -- nem `"0.0.0"` nem `""` (secao 4.2 do .md).
#   python_installed  LISTA, nao valor: a coluna `Python` da pagina lista os
#                     interpretadores INSTALADOS (secao 4.1 do .md). Achatar
#                     num valor so escolheria por conta propria qual deles o
#                     PySpark usa.
#   python            o default do PySpark, e SO onde a AWS o documenta: 7.x
#                     inteira, e ausente na serie 6.x, onde a fonte nao o
#                     reafirma por release.
#
# Uma chave fora dessas cinco estoura na carga. E a unica forma pratica de esta
# matriz ganhar um eixo por edicao distraida -- por exemplo `scala`, que a
# pagina de Glue publica e a de EMR nao.
#
# FONTE E DATA. As duas paginas de *Application versions* cobrem todas as
# celulas das secoes 2 e 3, e por isso sao declaradas no nivel do documento. A
# unica celula com fonte PROPRIA e o `python` de `7.13.0`: ele vem da release
# note daquela release, que declara a virada do default do PySpark para 3.11 --
# e por isso aquela linha declara `sources` proprio, somado ao do documento.
schema_version: 1
sources:
  - "https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-release-app-versions-7.x.html"
  - "https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-release-app-versions-6.x.html"
retrieved: "2026-08-01"
versions:
