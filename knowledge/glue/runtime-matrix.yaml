# Matriz de runtime do AWS Glue. Dado, nunca constante em Python.
#
# POR QUE ESTE ARQUIVO EXISTE: o fato de versao morava em dois lugares --
# `GLUE_MATRIX` compilado em `sparkforge/facts/runtime_detect.py` e a prosa de
# `knowledge/glue/runtime-matrix.md` -- sem nada que forcasse os dois a
# concordarem. Versao e fato EXTERNO: muda por decisao da AWS, nao deste
# repositorio, entao precisa carregar fonte e data como qualquer outro fato
# externo daqui.
#
# Os quatro runtimes abaixo vieram de `GLUE_MATRIX` (movidos, nao
# re-derivados) e foram confirmados em 2026-08-21 contra a tabela do Apendice
# A de migrating-version-50.html (3.0, 4.0, 5.0) e contra o blog/whats-new de
# 5.1 -- ambos ja vigiados em sources.lock.json antes desta entrega. `scala` e
# `java` foram acrescentados so onde a fonte lida os declara explicitamente;
# omitidos onde nao ha essa confirmacao (nao adivinhados).
