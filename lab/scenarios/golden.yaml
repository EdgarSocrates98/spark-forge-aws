    title: Sink slowdown propagation
    version: 1
    profile: {<<: *standard, profile: streaming}
    fidelity: *local
    topology: {source: kafka, processor: flink, sink: iceberg_rest}
    dataset: {schema: order, seed: 119, records: 1000, key_cardinality: 100, skew: 0, late_event_ratio: 0, duplicate_ratio: 0}
