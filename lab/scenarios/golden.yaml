  - id: LAB-020
    slug: multi-engine-network-latency
    title: Multi-engine network latency
    version: 1
    profile: {<<: *standard, profile: lakehouse, mode: standard}
    fidelity: *local
    topology: {catalog: polaris, object_store: minio, writers: [spark, flink], readers: [trino, duckdb]}
