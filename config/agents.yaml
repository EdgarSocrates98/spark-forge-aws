version: 2
defaults:
  max_rounds: 3
  max_messages: 120
  max_tokens: 12000
  max_context_messages: 24
  max_agents: 4
  stagnation_limit: 2
  cheap_before_expensive: true
  require_evidence: true
  require_approval_for_mutation: true
  preserve_kinds:
  - task
  - fact
  - decision
  - snapshot
agents:
- name: sf-inventory
  # `sparkforge_aws_inventory` saiu daqui (docs/sdd/CONFIG_OCA/, 2026-09-20): nao existe em
  # `sparkforge_aws.adapters.tools.TOOLS` (109 tools), e o proprio contrato do executor,
  # `agents/executors/sf-inventory.md`, nao a cita em lugar nenhum -- as tools que ele
  # roda sao `sparkforge_aws_doctor`, `sparkforge_aws_runtime_detect`, `sparkforge_aws_case_get`,
  # `sparkforge_aws_collect_verify`, a familia `sparkforge_aws_collect_*` e `sparkforge_aws_scan`.
  # Era nome sem artefato, registrado como defeito em
  # `docs/superpowers/specs/2026-08-29-context-accounting-design.md` desde 2026-08-29.
  role: inventory
  allowed_tools:
  - sparkforge_aws_runtime_detect
  knowledge_refs:
  - knowledge/INDEX.md
  - knowledge/cross-service-constraints.md
- name: sf-extractor
  # ATENCAO antes de por este arquivo em `VIVOS` de `tests/test_sf_stubs.py`: o valor
  # abaixo COLIDE por nome com `evidence-extractor`, um dos 16 contratos que
  # `docs/sdd/CONFIG_OCA/` removeu de `subagents/`. Nao e referencia pendurada -- `role`
  # e string livre que `sparkforge_aws/registry/loader.py` copia para o `AgentManifest`, e
  # nao resolve para arquivo nenhum. Por isso ele fica fora do MAPA do gate. Mas o teste
  # de documento vivo casa por NOME, e poria este arquivo vermelho sem excecao escrita.
  role: evidence-extractor
  allowed_tools:
  - sparkforge_aws_collect_event_log
  - sparkforge_aws_collect_glue_job
  - sparkforge_aws_collect_iceberg_metadata
  knowledge_refs:
  - knowledge/sources.lock.json
- name: sf-runtime-specialist
  role: runtime-infrastructure
  allowed_tools:
  - sparkforge_aws_runtime_detect
  - sparkforge_aws_collect_glue_job
  - sparkforge_aws_collect_emr_cluster
  - sparkforge_aws_collect_emr_serverless
  - sparkforge_aws_analyze_terraform
  - sparkforge_aws_rules_lookup
  knowledge_refs:
  - knowledge/glue/runtime-matrix.md
  - knowledge/emr/runtime-matrix.md
  - knowledge/emr-serverless/runtime-matrix.md
- name: sf-judge
  role: bottleneck-judge
  allowed_tools:
  - sparkforge_aws_rules_lookup
  - sparkforge_aws_judge
  - sparkforge_aws_fuse
  knowledge_refs:
  - knowledge/performance-principles.md
  - knowledge/cross-service-constraints.md
- name: sf-verifier
  role: verifier
  allowed_tools:
  - sparkforge_aws_validate_output
  - sparkforge_aws_report_verify
  - sparkforge_aws_rules_lookup
  knowledge_refs:
  - knowledge/anti-patterns.md
  - knowledge/agentic-engineering.md
- name: sf-synthesizer
  role: report-synthesizer
  allowed_tools:
  - sparkforge_aws_report_sign
  - sparkforge_aws_report_verify
  - sparkforge_aws_report_github
  - sparkforge_aws_telemetry_export
  knowledge_refs:
  - knowledge/INDEX.md
  - knowledge/agentic-engineering.md
model_selection:
  source: coordinator_account_inventory
  never_hardcode_models: true
  low_risk: cheapest_qualifying_model
  high_risk: strongest_qualifying_reasoning_model
  fallback: stop_and_report_unavailable
observability:
  trace_view: false
  show_content: false
  token_notice: true
  record_usage_when_available: true
  estimate_when_unavailable: true
autonomy_focus:
- improvement
- construction
- documentation
- validation
expansion_registry: config/agentic-expansion.yaml
teams_registry: config/teams-expansion.yaml
offline:
  network_required: false
  manifest: knowledge/offline-manifest.json
  policy: knowledge/offline-policy.md
