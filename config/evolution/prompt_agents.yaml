schema_version: 1
registry_id: prompt-agent-evolution-v1
candidate_root: .
benchmark_suite: evals/token_efficient/fixtures/decision_control_plane_cases.yaml
require_domain_holdout: true
policy_version: prompt-agent-evolution-policy-v3
external_commands: []
authority:
  require_content_digest: true
  require_parent_digest_for_mutation: true
  require_evaluation_receipt: true
  require_rollback_target: true
  require_contract_sha256: true
evaluation_policy:
  quality:
    min_status_accuracy: 1.0
    min_evidence_recall: 1.0
    max_false_positive_rate: 0.0
    max_quality_regression: 0.0
    min_route_accuracy: 1.0
    max_route_regression: 0.0
    require_route_metric: true
  economy:
    max_payload_regression: 0.05
    max_token_regression: 0.0
    max_cost_regression: 0.0
    require_tokens: false
    require_cost: false
policies:
  - policy_id: prompt.prompt.routing.data_domain.1
    family: prompt
    kind: prompt
    contract_id: routing.data_domain
    contract_version: "1"
    minimum_labeled_tasks: 50
    quality:
      min_status_accuracy: 1.0
      min_evidence_recall: 1.0
      max_false_positive_rate: 0.0
      max_quality_regression: 0.0
      min_route_accuracy: 1.0
      max_route_regression: 0.0
      require_route_metric: true
    economy:
      max_payload_regression: 0.05
      max_token_regression: 0.0
      max_cost_regression: 0.0
      require_tokens: false
      require_cost: false
    unresolved:
      deny:
        - transcript_missing
        - transcript_source_unresolved
        - evidence_integrity_unknown
        - metrics_unresolved
        - evidence_ref_unresolved:ci
        - evidence_ref_unresolved:benchmark
        - evidence_ref_unresolved:review
        - evidence_ref_missing:ci
        - evidence_ref_missing:benchmark
        - evidence_ref_missing:review
      allow:
        - cost_unresolved
    evidence:
      required_verified_kinds: [ci, benchmark, review]
      roots:
        - .sparkforge/evidence
        - evals/token_efficient/fixtures
