schema_version: 1

platforms: [claude_code, devin_desktop, devin_cli, codex, copilot_ci]
mechanisms: [mcp, cli, files, playbook, subagent]

notes: >
  Devin Desktop configura MCP por serverUrl (HTTP): `python -m sparkforge.adapters.mcp
  --transport http` e serverUrl `http://<host>:<port>/mcp`. Claude Code, Devin CLI e CI usam
  stdio. `.mcp.json` configura o de Claude Code -- e SO o dele: ele parametriza
  `PYTHONPATH` e `SPARKFORGE_CATALOG` por `${CLAUDE_PLUGIN_ROOT}`, variavel do carregador
  de plugin do Claude Code que nenhuma pagina do Devin documenta expandir; importado como
  esta, o servidor morre na primeira leitura do catalogo. O Devin CLI tem arquivo proprio
  (`.devin/mcp_config.json`, chave `mcpServers`) e comando proprio (`devin mcp add`), e o
  procedimento esta em GUIA_DE_USO.md secao 3.4 -- declarar `mcp` sem dizer como aciona-lo
  seria o defeito do transporte HTTP da Fase 1 outra vez.
  Devin CLI nao le Knowledge nem Playbooks da conta Devin, por isso o procedimento e
  autoritativo em arquivo no repo, nunca em Playbook. Copilot CI nao mantem sessao MCP
  interativa: roda o CLI `sparkforge` como processo de linha de comando dentro do workflow,
  ou opera diretamente sobre arquivo quando nem isso esta disponivel.
  Codex, como Copilot CI, nao mantem sessao MCP interativa da mesma forma: roda o CLI
  `sparkforge` como processo de linha de comando dentro do seu ambiente de execucao, ou
  opera diretamente sobre arquivo. Por isso `codex` nunca declara `mcp` em nenhuma
  capacidade -- o mesmo raciocinio ja aplicado a `copilot_ci`, nao um caso novo.
  `subagent` NAO e mecanismo declarado neste manifesto, de proposito. Despacho de
  subagente e capacidade de HARNESS do Claude Code (o `Agent` tool desta CLI), nao
  conteudo deste repositorio: nenhuma outra plataforma tem um equivalente que este
  repositorio possa acionar. Declara-lo como mecanismo portavel faria o manifesto
  afirmar paridade que nao existe -- o defeito exato do transporte HTTP na Fase 1, que
  `parity.yaml` afirmava e nenhum teste tocava, e que so apareceu quando alguem subiu o
  servidor de verdade. Em vez disso, a capacidade "coordenar investigacao por agente
  especializado" declara `playbook`: a tool/CLI `sparkforge_playbook` le os mesmos
  arquivos em `agents/` e `agents/executors/` que um coordenador Claude Code despacharia
  como subagente, e devolve a mesma decomposicao em passos sequenciais -- perde o
  paralelismo do despacho, mantem o metodo. E o que Devin Desktop, Devin CLI, Codex e
  Copilot CI conseguem consumir sem harness de subagente.

  DESVIO REGISTRADO SOBRE O PARAGRAFO ACIMA (2026-08-04, fase de perfis de subagente do
  Devin). O paragrafo fica como esta, e nao e reescrito: e a convencao deste repositorio
  para decisao registrada que a fonte derrubou pela metade.
  O QUE CAIU: a frase universal "nenhuma outra plataforma tem um equivalente que este
  repositorio possa acionar". Ela cai por contraexemplo medido em
  knowledge/devin/agents-and-subagents.md (retrieved 2026-08-04): o Devin CLI le
  `.agents/agents/` nativamente e importa `.claude/agents/*.md` ("Each `.md` file becomes
  a subagent profile"), e o Devin Local agent do Desktop despacha os mesmos perfis --
  dois diretorios que este repositorio ja publicava antes desta fase, sem nenhuma mudanca.
  Por isso `subagent` entra em `mechanisms`, e a capacidade de coordenacao o declara para
  `claude_code`, `devin_cli` e `devin_desktop`.
  O QUE SOBROU, e continua valendo palavra por palavra: o perfil e nosso, o despacho e
  deles. Nenhum arquivo versionado liga subagente nem fixa modelo -- `subagents_enabled` e
  chave de usuario, "Default subagent model" e setting de organizacao com opcao *None* que
  desliga o despacho por completo, e a propria Cognition declara custom subagents
  EXPERIMENTAIS. E por isso `playbook` continua declarado nas cinco plataformas, inclusive
  nas tres que despacham: ele e o piso que roda quando o despacho esta desligado, nao um
  degrau que `subagent` substitui.
  A DISCIPLINA DO PARAGRAFO SEGUE SENDO EXERCIDA, e nao abandonada: `codex` e `copilot_ci`
  NAO ganham `subagent`, porque a pesquisa nao os cobriu e nada nela diz que eles tenham
  equivalente. Afirmar sem medir seria repetir o defeito do transporte HTTP da Fase 1 que
  este mesmo paragrafo cita como razao de ser da regra.
  RECORTE DO `devin_desktop`, medido e nao inferido: subagente e documentado como
  capacidade do Devin Local agent, sob o toggle "Subagents (Preview)" em Devin Settings, e
  a pagina do Desktop delega formato e descoberta a do CLI. As paginas do motor Cascade
  (cascade.md, skills.md, workflows.md, agents-md.md, advanced.md, agent-command-center.md)
  nao mencionam subagente -- argumento por ausencia, marcado como tal na pesquisa. Fora do
  Devin Local agent com o toggle ligado, a coordenacao no Desktop e `playbook`.

