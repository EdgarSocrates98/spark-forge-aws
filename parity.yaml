  # DUAS capacidades e nao uma, porque a fronteira das duas e diferente e
  # `parity.yaml` e o que uma plataforma le para saber o que existe. `describe`
  # responde "o que esta release publica" -- e o que ela NAO publica, nomeado.
  # `diff` responde "o que muda entre duas", com o eixo declarado. Nenhuma das
  # duas responde "isso quebra?": essa e a capacidade de cima, `assess a Glue
  # version migration step by step`, e colapsar as tres numa so faria o
  # manifesto prometer avaliacao de compatibilidade onde ha leitura de matriz.
  #
  # `knowledge:` com as QUATRO paginas de matriz, e nao com uma: o verbo le as
  # quatro, e declarar so a de Glue faria o degrau `files` -- o que chega a quem
  # nao tem MCP nem Python -- apontar para um quarto do dado.
  - name: describe what a runtime release publishes, and what it does not
    tools: [sparkforge_release_describe]
    cli: [release describe]
    knowledge:
      - knowledge/glue/runtime-matrix.md
      - knowledge/emr/runtime-matrix.md
      - knowledge/emr-serverless/runtime-matrix.md
      - knowledge/emr-eks/runtime-matrix.md
    platforms:
      claude_code: [mcp, cli, files]
      devin_desktop: [mcp, cli, files]
      devin_cli: [mcp, cli, files]
      codex: [cli, files]
      copilot_ci: [cli, files]

  # CAPACIDADE PROPRIA, e nao uma quinta plataforma da de cima. A de cima
  # responde "o que esta release publica" para as QUATRO plataformas de Spark,
  # com um eixo (componente -> versao). Esta responde por versao do Control-M
  # Automation API, com DOIS eixos -- capacidade com fronteira, e componente com
  # exigencia -- e sobre um produto que nao roda Spark. Colapsar as duas faria o
  # manifesto prometer, para Glue e EMR, um eixo de capacidade que aquelas
  # fontes nao publicam.
  #
  # `knowledge:` com a pagina da matriz, que e onde mora o que a fonte NAO
  # sustenta -- inclusive o limite entre o Automation API e o produto Control-M,
  # e o fato de `WebFetch` devolver 403 contra `documents.bmc.com`.
  - name: describe what a Control-M Automation API version supports
    tools: [sparkforge_controlm_describe]
    cli: [controlm describe]
    knowledge:
      - knowledge/controlm/automation-api-matrix.md
    platforms:
      claude_code: [mcp, cli, files]
      devin_desktop: [mcp, cli, files]
      devin_cli: [mcp, cli, files]
      codex: [cli, files]
      copilot_ci: [cli, files]

  # A CAPACIDADE IRMA DA DE CIMA, E A DIFERENCA ENTRE AS DUAS E O QUE ELAS LEEM.
  # `controlm describe` le SO a matriz de `knowledge/` e responde por VERSAO --
  # nao ha artefato do operador em jogo. Esta le o artefato: a definicao
  # `Jobs-as-Code` versionada no repositorio do cliente, que e codigo-fonte da
  # mesma natureza de um `main.tf`. Colapsar as duas numa so faria o manifesto
  # prometer, para quem so quer consultar a matriz, uma capacidade que exige ter
  # o JSON de definicao em maos.
  #
  # `knowledge:` com a pagina da matriz porque e la que mora a FRONTEIRA que o
  # cruzamento usa -- e tambem o que a fonte NAO sustenta, incluindo as 9 versoes
  # da faixa sem afirmacao propria e o fato de `WebFetch` devolver 403 contra
  # `documents.bmc.com`.
  #
  # NAO HA `collect` PAR, e a ausencia e decidida: `Jobs-as-Code` e codigo-fonte
  # no repositorio do cliente, nao resposta de API. Nao ha o que baixar, e um
  # verbo de coleta aqui seria parametro sem consumidor.
  - name: extract facts from a Control-M Jobs-as-Code definition
    tools: [sparkforge_analyze_controlm_jobs]
    cli: [analyze controlm-jobs]
    knowledge:
      - knowledge/controlm/automation-api-matrix.md
    platforms:
      claude_code: [mcp, cli, files]
      devin_desktop: [mcp, cli, files]
      devin_cli: [mcp, cli, files]
      codex: [cli, files]
      copilot_ci: [cli, files]

  - name: diff component versions between two runtime releases
    tools: [sparkforge_release_diff]
    cli: [release diff]
    knowledge:
      - knowledge/glue/runtime-matrix.md
      - knowledge/emr/runtime-matrix.md
      - knowledge/emr-serverless/runtime-matrix.md
      - knowledge/emr-eks/runtime-matrix.md
    platforms:
      claude_code: [mcp, cli, files]
      devin_desktop: [mcp, cli, files]
      devin_cli: [mcp, cli, files]
      codex: [cli, files]
      copilot_ci: [cli, files]

  # As quatro plataformas atravessam o MESMO verbo, e por isso uma capacidade
  # so: `sparkforge_migration_assess` ganhou o parametro `platform` em vez de
  # uma tool nova por plataforma, e a CLI cobre a mesma superficie com
  # `migrate glue` (a plataforma esta no nome, publicada antes das quatro
  # existirem) mais `migrate emr --platform`, que escolhe entre as tres
  # matrizes de EMR. Nenhum runtime sai da matriz de outra plataforma.
  - name: assess a runtime version migration step by step, on any of the four platforms
    tools: [sparkforge_migration_assess]
    cli: [migrate glue, migrate emr, migrate controlm]
    knowledge:
      - knowledge/glue/runtime-matrix.md
      - knowledge/emr/runtime-matrix.md
      - knowledge/emr-serverless/runtime-matrix.md
      - knowledge/emr-eks/runtime-matrix.md
      - knowledge/controlm/automation-api-matrix.md
    platforms:
      claude_code: [mcp, cli, files]
      devin_desktop: [mcp, cli, files]
      devin_cli: [mcp, cli, files]
      codex: [cli, files]
      copilot_ci: [cli, files]

